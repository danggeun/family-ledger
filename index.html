}
/* 아이 바꾸기: 탭 · 밀기 같은 길 */
/* 바꾸기 직전 화면의 복사본을 같은 방향으로 내보낸다. 홈은 맨 앞, 아이 화면은 맨 뒤 */
/* 화면 밖 기록 줄은 복사본에서 뺀다(아이폰에서 복제가 한 프레임을 넘긴다). 자리는 render 전에 잰다 */
function rowsOffscreen(old){ if(!old) return -1; var vh=window.innerHeight, rows=old.querySelectorAll(".row");
  for(var i=0;i<rows.length;i++){ if(rows[i].getBoundingClientRect().top>vh) return i; } return -1; }
function ghostOut(old, dir, front, cut){
  if(!old || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var g=old.cloneNode(true); g.className=old.classList.contains("kid") ? "kid ghost gout-"+dir : "screen home ghost gout-"+dir;
  if(cut>=0){ var crows=g.querySelectorAll(".row"); for(var i=crows.length-1;i>=cut;i--) if(crows[i].parentNode) crows[i].parentNode.removeChild(crows[i]); }
  if(front) root.insertBefore(g, root.firstChild); else root.appendChild(g);
  setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 110);
}
function pickKid(id){
  if(id===S.sel) return;
  if(S.tour && S.tour.step==="swipe") S.tour.step=tourNext("swipe");     // 밀어 봤다(탭으로 바꿔도) — 다음으로
  var ids=kidIds();
  S.ui.homeSlide = ids.indexOf(id) > ids.indexOf(S.sel) ? "l" : "r";
  var old=root.querySelector(".screen.home"), cut=rowsOffscreen(old);
  S.sel=id; lsSet("yd_sel",id); S.datePick=false; S.memoFocus=false; S.limit=LIST_PAGE; resetDraft(); render();
  ghostOut(old, S.ui.homeSlideWas, true, cut);
}
/* 홈 좌우 밀기: 아이 화면과 같은 문턱. 진짜로 바꾸고(S.sel) 끝에서는 멈춘다.
   키보드가 떠 있거나 입력줄 · 칩 위에서 시작한 끌기는 무시 */
// 키보드가 떠 있다(용도 칩 또는 글자칸에 커서). 버튼에 남은 포커스는 아니다. 이때 홈 밀기는 무시
function keyboardUp(){
  var a=document.activeElement;
  return !!(S.memoFocus || (a && a.matches && a.matches(".entry input")));
}
// 입력줄을 쓰는 중(키보드 또는 날짜 칩). 이때 목록을 누르면 닫기만 한다
function writingEntry(){ return keyboardUp() || !!S.datePick; }
function homeSwipe(node){
  hSwipe(node, {
    vertical: "drop",
    start: function(t, e){
      if(S.children.length<2 || nearEdge(t.clientX)) return false;
      if(e.target.closest && e.target.closest(".entry, .chips")) return false;   // 입력줄·칩 위에서 시작한 끌기는 그 칸의 것
      if(keyboardUp()) return false;               // 날짜 칩만 열린 건 막지 않는다(밀면 칩이 닫힌다)
    },
    end: function(r){
      if(r.moved) S.ui.homeDragClick=true;
      if(!r.far) return;
      var ids=kidIds(), j=ids.indexOf(S.sel)+(r.dx<0?1:-1);

    }

function renderHome(){
  var wrap=el("div","screen home"+(S.ui.homeSlide?" slide-"+S.ui.homeSlide:"")); S.ui.homeSlideWas=S.ui.homeSlide; S.ui.homeSlide=null;

  } else if(c){
    bar.appendChild(el("span","k on", c.name));
  }
  bar.appendChild(el("div","sp"));
  // 톱니는 선 그림(⚙ 글자는 아이폰에서 이모지로 그려진다)
  var gear=el("button","gear"); gear.setAttribute("aria-label","설정"); gear.innerHTML=GEAR_SVG;
  gear.onclick=function(){
    if(!store){ toast("연결이 안 돼요"); return; }   // 캐시 화면뿐이면 설정을 열지 않는다
    navOpen("settings", function(){ S.screen="settings"; });
    store.gateState().then(function(g){ S.gate=g; if(S.screen==="settings") render(); if(g && g.is_reader) loadFb(); }, ignore);
  };
  bar.appendChild(gear);
  wrap.appendChild(bar);
  // 칩은 입력줄 밖을 누르면 닫는다
  // 적는 중에 입력줄 밖을 누르면 키보드를 내리고 칩을 닫기만 한다(그 탭으로 다른 화면은 안 연다).
  // 캡처 단계에서 잡고, 상태는 손이 닿는 순간 적는다(click 때는 포커스가 이미 풀렸다)
  var wasTyping=false;
  wrap.addEventListener("pointerdown", function(ev){
    S.ui.homeDragClick=false;                       // 새로 누르면 지난 끌기 표시는 버린다 (click 이 안 오는 기기도 있다)
    wasTyping = writingEntry();
  }, true);
  wrap.addEventListener("click", function(ev){
    if(S.ui.homeDragClick){ S.ui.homeDragClick=false; ev.preventDefault(); ev.stopPropagation(); return; }   // 끌기가 만든 click
    if(ev.target.closest(".entry, .chips")) return;
    var d=S.draft;

    if(wasTyping && ev.target.closest(".row, .more, .thead, .mdiv, .empty-msg")){
      ev.preventDefault(); ev.stopPropagation();
    }
    wasTyping=false;
    S.memoFocus=false; S.datePick=false;
    var a=document.activeElement; if(a && a.blur) a.blur();

  }, true);

  }

  bb.appendChild(el("b",null, fmt(balanceOf(c.id))));
  bb.appendChild(el("i",null,"원"));
  var pig=document.createElement("img"); pig.className="pig"; pig.src="logo-pig-sm.png"; pig.alt=""; bb.appendChild(pig);
  bb.onclick=function(){ navOpen("kidView", function(){ S.kidView=c.id; }); };

  if(!rows.length){

    r.appendChild(el("span","t",fmt(e.total)));

  }
  return wrap;
}

/* 처음 금액 줄. 눌러서 고친다 */
function ledgerStart(c){           // 통장이 시작된 날(아이 등록일과 가장 이른 기록 중 빠른 쪽)
  var d=localDay(c.created_at) || today();
  entriesFor(c.id).forEach(function(e){ if(e.entry_date < d) d=e.entry_date; });
  return d;
}
// above = 바로 위 월 머리의 "YYYY-MM"(없으면 null). 처음 금액의 해가 그 머리(없으면 올해)와 다르면 제 월 머리를 단다 — 줄에선 해를 빼므로
function openingRow(c, above){
  var frag=document.createDocumentFragment(), d=ledgerStart(c);
  if(d.slice(0,4)!==(above || today()).slice(0,4)) frag.appendChild(monthHead(d.slice(0,7), {inc:0, out:0}));
  var r=el("button","row open");
  r.appendChild(el("span","d",listDate(d)));
  r.appendChild(el("span","m","처음 금액"));
  r.appendChild(el("span","a",""));
  r.appendChild(el("span","t",fmt(c.opening_balance||0)));
  r.onclick=function(){ navOpen("editOpen", function(){ S.editOpen={id:c.id, amountStr:String(c.opening_balance||0)}; }); };
  frag.appendChild(r);
  return frag;
}

function monthHead(key, sum){
  var p=key.split("-"), thisYear=today().slice(0,4);
  var d=el("div","mdiv");
  d.appendChild(el("span","mname", (p[0]===thisYear ? "" : p[0]+"년 ") + (+p[1]) + "월"));
  var parts=[];
  if(sum.inc) parts.push("받은 돈 " + sum.inc.toLocaleString("ko-KR"));
  if(sum.out) parts.push("쓴 돈 " + sum.out.toLocaleString("ko-KR"));
  d.appendChild(el("span","msum", parts.join("   ")));
  return d;
}

function renderNewRow(){
  var d=S.draft, frag=document.createDocumentFragment();
  var row=el("div","entry");

  var dbtn=el("button","dbtn",listDate(d.date));
  dbtn.onclick=function(){ S.datePick=!S.datePick; S.memoFocus=false; render(); };
  row.appendChild(dbtn);

  var memo=el("input","memo"); memo.type="text"; memo.value=d.memo;
  // "용도" 안내는 그 아이의 기록이 없을 때만
  memo.placeholder = S.entries.some(function(e){ return e.child_id===S.sel && (e.memo||"").trim(); }) ? "" : "용도";
  memo.autocomplete="off"; memo.enterKeyHint="next";
  memo.oninput=function(){ d.memo=memo.value; updateOk();
    if(!d.signByHand) setSign(signForMemo(d.memo) || -1);    // 손으로 부호를 바꿨으면 그 뒤로는 안 건드린다
  };
  memo.onfocus=function(){ if(!S.memoFocus){ S.memoFocus=true; S.datePick=false; redrawChips(); } };
  memo.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); amt.focus(); } };
  row.appendChild(memo);

  var acell=el("div","acell");
  var sign=el("button","sign");
  var amt=moneyInput("amt", d.amount ? fmtNum(d.amount) : "", function(v){ d.amount=v; updateOk(); }, {enter:submitNew, hint:"done", placeholder:"0"});
  function setSign(v){            // render() 대신 그 자리만(키보드 유지)
    d.sign=v;
    sign.textContent = v>0?"+":"\u2212";
    sign.className = "sign"+(v>0?" plus":"");
    amt.className = "amt"+(v>0?" in":"");
    sign.setAttribute("aria-label", v>0?"받은 돈":"쓴 돈");
  }
  setSign(d.sign);
  sign.onclick=function(){ d.signByHand=true; setSign(-d.sign); if(S.tour && S.tour.step==="sign") tourSync(); };
  acell.appendChild(sign);
  amt.onfocus=function(){ if(S.memoFocus||S.datePick){ S.memoFocus=false; S.datePick=false; redrawChips(); } };
  acell.appendChild(amt); row.appendChild(acell);

  var ok=el("button","ok","\u2713"); ok.setAttribute("aria-label","저장"); ok.onclick=submitNew;
  row.appendChild(ok);
  function updateOk(){ ok.disabled = !(Number(d.amount)>0); }
  updateOk();
  frag.appendChild(row);

  var slot=el("div"); slot.id="chips"; frag.appendChild(slot);
  fillChips(slot);
  return frag;

  function redrawChips(){ var n=document.getElementById("chips"); if(n){ n.innerHTML=""; fillChips(n); } }
  function fillChips(slot){
    if(S.datePick){
      var box=el("div","chips dates"), t=today();
      [["오늘",t],["어제",addDays(t,-1)],["그저께",addDays(t,-2)]].forEach(function(pair){
        var b=el("button",null,pair[0]); if(d.date===pair[1]) b.className="on";
        b.onclick=function(){ d.date=pair[1]; d.dateByHand=true; S.datePick=false; render(); };
        box.appendChild(b);
      });
      var near = d.date===t || d.date===addDays(t,-1) || d.date===addDays(t,-2);

/* 적다 만 입력은 아이를 바꾸거나 입력줄 밖으로 나가면 비운다(다른 아이 기록으로 저장되지 않게) */
/* 금액칸 커서는 늘 끝(끝에서 치고 끝에서 지운다). 전체 선택만 예외.
   브라우저가 커서를 놓은 뒤 옮겨야 해서 한 틱 늦춘다 */
document.addEventListener("selectionchange", function(){ if(S.ui.moneyInp && document.activeElement===S.ui.moneyInp) caretEnd(S.ui.moneyInp); });
function caretEnd(inp){ setTimeout(function(){ var n=inp.value.length, a=inp.selectionStart, z=inp.selectionEnd;
    if(document.activeElement!==inp || (a===n && z===n)) return;
    if(a===0 && z===n && n>0) return;
    try{ inp.setSelectionRange(n,n); }catch(_){} }, 0); }
function tapEnd(inp){
  function end(){ caretEnd(inp); }
  inp.addEventListener("focus", function(){ S.ui.moneyInp=inp; end(); });
  inp.addEventListener("blur", function(){ if(S.ui.moneyInp===inp) S.ui.moneyInp=null; });
  ["click","select","keyup"].forEach(function(t){ inp.addEventListener(t, end); });
}
/* 콤마를 다시 찍어도 커서가 제자리에 오게 커서 앞 숫자 수로 다시 놓는다 */
function fmtMoney(inp){
  // 9자리까지. 서버 int 범위를 넘으면 알 수 없는 오류
  var raw=inp.value, k=digits(raw.slice(0, inp.selectionStart||0)).length, v=digits(raw).slice(0,9);
  inp.value = v ? Number(v).toLocaleString("ko-KR") : "";
  var pos=0, c=0; while(c<k && pos<inp.value.length){ if(/\d/.test(inp.value[pos])) c++; pos++; }
  try{ inp.setSelectionRange(pos,pos); }catch(_){}
  return v;
}
function resetDraft(){ S.draft=newDraft(); }
function submitNew(){
  var d=S.draft, n=Number(d.amount);
  if(!(n>0)) return;
  if(!store){ toast("연결이 안 돼요"); return; }   // supabase-js 를 못 받아 캐시 화면만 뜬 상태 — 그냥 가면 줄은 남고 저장은 안 된다
  // 날짜를 고르지 않았으면 적는 순간의 오늘(자정을 넘겨도)
  var e={child_id:S.sel, entry_date:d.dateByHand ? d.date : today(), memo:d.memo.trim(), amount:d.sign*n, auto_key:null};
  // 낙관적 반영
  var tmp=Object.assign({id:"tmp-"+Date.now(), created_at:new Date().toISOString()}, e);
  S.entries.push(tmp);
  S.draft=newDraft(); S.memoFocus=false; S.datePick=false;
  if(document.activeElement) document.activeElement.blur();
  render();
  var typed={date:d.date, dateByHand:d.dateByHand, memo:d.memo, amount:d.amount, sign:d.sign, signByHand:d.signByHand};   // 실패하면 돌려준다
  store.addEntry(e).then(function(saved){
    var i=S.entries.indexOf(tmp);
    if(i>=0) S.entries[i]=saved;
    else if(!S.entries.some(function(x){ return x.id===saved.id; })) S.entries.push(saved);   // 그 사이 reload 가 tmp 를 걷어갔으면 직접 넣는다
    render();
  }).catch(function(err){
    S.entries=S.entries.filter(function(x){return x!==tmp;});
    // 치던 걸 입력줄에 돌려준다. 그 사이 다른 아이로 넘어갔으면 돌려주지 않고 누구 것인지 알린다
    var same = S.sel===e.child_id, kid=childOf(e.child_id);
    if(same && !S.draft.memo && !S.draft.amount) S.draft=typed;
    render(); toast((same || !kid ? "" : kid.name+" ")+"저장 실패: "+errText(err)); report("새 기록 저장 실패", err); });
}

/* 되돌리기는 바꾸기 직전 값만(캐시로 되돌리면 그 사이 성공한 편집까지 지워진다) */
function errText(err){ return err && err.message ? err.message : String(err); }
// 일부러 삼키는 실패(공유 창 닫기, 서비스워커 등록 실패 등)
function ignore(){}
// 되돌릴 게 없는 요청용. 있으면 tryStore
function failToast(label){ return function(err){ toast(label+": "+errText(err)); report(label, err); }; }
function tryStore(req, undo, msg){
  // req 가 동기로 던져도 catch 로
  return Promise.resolve().then(function(){ if(!store) throw new Error("연결이 안 돼요"); return req(); })
    .catch(function(err){ undo(); render(); toast((msg||"저장 실패")+": "+errText(err)); report(msg||"저장 실패", err); return reload(); });
}

/* ── 시트 공통: 막 + 시트 + 제목 + 본문(.f) + 버튼 줄(.btns). 닫기는 늘 navBack ── */
function sheet(title, build){
  var frag=document.createDocumentFragment();
  var dim=el("div","dim"); dim.onclick=navBack; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,title));
  var f=el("div","f"); build(f);
  sh.appendChild(f); frag.appendChild(sh);
  return frag;
}
function sheetButtons(f, list){            // list: [[글자, 추가 클래스, onclick], …] — 왼쪽부터
  var btns=el("div","btns");
  list.forEach(function(b){ var x=el("button","btn"+(b[1]?" "+b[1]:""), b[0]); x.onclick=b[2]; btns.appendChild(x); });
  f.appendChild(btns); return btns;
}
function field(f, label, control){         // 회색 라벨 + 칸
  var g=el("div"); g.appendChild(el("label",null,label)); g.appendChild(control); f.appendChild(g); return g;
}
function labeledBox(f, label, inp){        // 라벨 + 테두리 상자 안의 입력칸 (+ "원")
  var bx=el("div","box"); bx.appendChild(inp); if(inp.inputMode==="numeric") bx.appendChild(el("span",null,"원"));
  return field(f, label, bx);
}
function fmtNum(v){ return Number(v).toLocaleString("ko-KR"); }
/* 금액칸: 숫자 키패드 · 콤마(onInput 엔 숫자만) · 커서는 끝. shown = 처음 보일 글자, opt = {enter, hint, placeholder} */
// 칸보다 긴 금액은 글자를 줄인다(안 그러면 앞자리가 잘려 보인다)
function fitText(inp){
  inp.style.fontSize="";
  if(!inp.isConnected || inp.scrollWidth<=inp.clientWidth) return;
  var size=parseFloat(getComputedStyle(inp).fontSize), min=Math.round(size*0.6);
  while(inp.scrollWidth>inp.clientWidth && size>min){ size--; inp.style.fontSize=size+"px"; }
}
function moneyInput(cls, shown, onInput, opt){
  opt=opt||{};
  var inp=el("input", cls); inp.type="text"; inp.inputMode="numeric";
  if(opt.placeholder!=null) inp.placeholder=opt.placeholder;
  inp.value = shown;
  inp.oninput=function(){ var v=fmtMoney(inp); fitText(inp); onInput(v); };
  if(shown) requestAnimationFrame(function(){ fitText(inp); });   // 다시 그린 칸·시트가 이미 긴 금액으로 열릴 때
  if(opt.hint) inp.enterKeyHint=opt.hint;
  if(opt.enter) inp.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); opt.enter(); } };
  tapEnd(inp);
  return inp;
}
function textInput(value, onInput, onEnter, hint){
  var inp=document.createElement("input"); inp.type="text"; inp.value=value||"";
  inp.oninput=function(){ onInput(inp.value); };
  if(hint) inp.enterKeyHint=hint;
  if(onEnter) inp.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); onEnter(); } };
  return inp;
}

function renderEditSheet(){

    // 입력줄과 같은 순서: 날짜 → 용도 → 금액
    if(!isAuto){                                       // 자동 줄은 날짜를 못 바꾼다(그 날짜가 곧 열쇠)
      var dateBtn=el("button","box tapbox"); dateBtn.appendChild(el("span","grow", shortDate(e.entry_date)));

    }
    var amount=moneyInput(e.sign>0?"r in":"r", fmtNum(e.amountStr||0), function(v){ e.amountStr=v; }, {enter:function(){ save(); }, hint:"done"});
    var memo=textInput(e.memo, function(v){ e.memo=v; }, function(){ amount.focus(); }, "next");
    labeledBox(f, "용도", memo);
    labeledBox(f, "금액", amount);

    if((e.updated_by || e.created_by) && !isAuto){   // 마지막으로 손댄 기기. 자동 줄은 뺀다
      var who = e.updated_by || e.created_by;            // 옛 줄은 updated_by 가 없다
      var fixed = !!e.updated_by && !!e.created_by && e.updated_by !== e.created_by;   // 적은 사람과 다르면 고친 것
      var mine = who===(store && store.userId);          // store 가 없는 캐시 화면에서도 시트는 열려야 한다
      f.appendChild(el("p","note", (mine ? "내가 " : "다른 기기에서 ") + (fixed ? "고쳤어요" : "적었어요")));
    }

    sheetButtons(f, [
      [e.arm ? (isAuto?"정말 건너뛰기":"정말 삭제") : (isAuto?"이번 주 건너뛰기":"삭제"), "danger"+(e.arm?" arm":""), remove],
      ["취소", "", navBack],
      ["저장", "pri", save]
    ]);

    function remove(){                                   // 두 번 눌러야 한다 — 첫 번째는 글자만 바뀐다
      if(!e.arm){ e.arm=true; render(); return; }
      var id=e.id; navBack();
      if(isAuto){                                        // 자동 줄은 지우면 다시 생기므로, 남겨두고 숨긴다
        var t=S.entries.find(function(x){return x.id===id;}); if(t) t.skipped=true; render();
        tryStore(function(){ return store.updateEntry(id,{skipped:true}); }, function(){ if(t) t.skipped=false; }, "실패");
      } else {
        var at=S.entries.findIndex(function(x){return x.id===id;}), removed=S.entries[at];
        S.entries=S.entries.filter(function(x){return x.id!==id;}); render();
        tryStore(function(){ return store.deleteEntry(id); },
          function(){ if(removed && S.entries.indexOf(removed)<0) S.entries.splice(Math.min(at,S.entries.length),0,removed); }, "삭제 실패");
      }
    }
    function save(){
      var n=Number(e.amountStr); if(!(n>0)){ toast("금액을 넣어주세요"); return; }
      var patch={entry_date:e.entry_date, memo:(e.memo||"").trim(), amount:e.sign*n, updated_by:store&&store.userId};
      var id=e.id; navBack();
      var t=S.entries.find(function(x){return x.id===id;}), before=t?Object.assign({},t):null;
      if(t) Object.assign(t,patch);
      render();
      tryStore(function(){ return store.updateEntry(id,patch); }, function(){ if(t) Object.assign(t,before); });
    }
  });
}

/* ── 의견 · 오류 보고 ──
   읽는 건 운영자가 고른 한 폰(app_gate.reader_user_id)만. 오류는 문장 · 버전 · 기종만 보낸다.
   같은 문장은 하루 한 번, 기기당 하루 20개. 끊긴 동안 난 것과 보고 자체의 실패는 안 보낸다 */
function deviceName(){
  var ua=navigator.userAgent, m;
  var os=(m=ua.match(/(iPhone|iPad)[^)]*? OS (\d+)_(\d+)/)) ? m[1]+" iOS "+m[2]+"."+m[3]
    : (m=ua.match(/Android ([\d.]+)(?:; ([^;)]+))?/)) ? "Android "+m[1]+(m[2] && m[2]!=="K" ? " "+m[2] : "")
    : isIOS ? "iPad" : "기타";
  var home=window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  return os+" · "+(home?"홈 화면 앱":"브라우저")+" · "+window.innerWidth+"px";
}
var REPORT_MAX=20;
function report(where, err){
  if(!store || store.kind!=="supabase" || !store.familyId || !navigator.onLine) return;
  var msg=(where+": "+errText(err)).slice(0,300), log;
  try{ log=JSON.parse(lsGet("yd_report")||"null"); }catch(e){ log=null; }
  if(!log || log.day!==today()) log={day:today(), sent:{}, n:0};
  if(log.sent[msg] || log.n>=REPORT_MAX) return;
  log.sent[msg]=1; log.n++; lsSet("yd_report", JSON.stringify(log));
  store.sendFeedback("error", msg+" · "+S.screen).catch(ignore);
}
window.addEventListener("error", function(e){ report("오류", (e.message||"")+" ("+e.lineno+":"+e.colno+")"); });

/* ── 시트를 아래로 밀어서 닫기 ── */
/* 끌어서 닫기 문턱: 시트는 아래로, 화면은 왼쪽 가장자리에서 */
var DRAG_CLOSE={SLOP:8, EDGE:32, OUT_MS:170,
  SHEET:{FLICK_PX:40, FLICK_SPEED:0.4, FAR:0.3}, SCREEN:{FLICK_PX:60, FLICK_SPEED:0.45, FAR:0.35}};
function dragFar(d, ms, size, k){ return (d>k.FLICK_PX && d/ms > k.FLICK_SPEED) || d > size*k.FAR; }
function sheetDrag(sh){
  var x0=0, y0=0, dy=0, t0=0, on=false, go=false;
  sh.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    if(sh.scrollTop>0) return;                            // 시트 안이 스크롤돼 있으면 스크롤이 먼저
    var box=e.target.closest && e.target.closest(".skiplist,.fblist,textarea"); if(box && box.scrollTop>0) return;   // 안쪽 목록 · 글칸이 스크롤돼 있으면 닫지 않는다
    on=true; go=false; dy=0; x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=e.timeStamp; sh.style.transition="none";
  }, {passive:true});
  sh.addEventListener("touchmove", function(e){
    if(!on) return;
    var d=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    // 방향은 처음 움직임으로 한 번만(축 고정). 아래가 우세할 때만 닫는다
    if(!go){
      if(Math.abs(d)<DRAG_CLOSE.SLOP && Math.abs(dx)<DRAG_CLOSE.SLOP) return;
      if(d<=0 || Math.abs(dx)>=Math.abs(d)){ on=false; return; }    // 위로·옆으로 끌면 무시
      go=true;
    }
    e.preventDefault(); dy=Math.max(0,d); sh.style.transform="translateY("+dy+"px)";
  }, {passive:false});
  function end(e){
    if(!on) return; on=false; if(!go) return;
    sh.style.transition="transform .2s ease-out";
    if(dragFar(dy, e.timeStamp-t0, sh.offsetHeight, DRAG_CLOSE.SHEET)){ sh.style.transform="translateY(100%)"; setTimeout(navBack, DRAG_CLOSE.OUT_MS); }
    else sh.style.transform="";
  }
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
}

/* ── 뒤로 가기 ──
   열 때 pushState, 닫기는 전부 navBack → popstate 한 곳. iOS 홈 화면 앱은 edgeSwipe */
S.ui.navBase = (history.state && history.state.d) || 0;   // 설정을 연 채 새로고침하면 그 칸이 바닥이 된다 — 거기서부터 센다
function navOpen(key, open){
  open();
  try{ history.pushState({d:S.ui.navBase+S.ui.navStack.length+1}, ""); S.ui.navStack.push(key); }
  catch(e){ navCloseKey(key); }                         // pushState 가 거부되면(사파리 횟수 제한) 열지 않는다
  render();
}
function navCloseKey(k){ if(k==="settings") S.screen="home"; else S[k]=null; }
function navBack(){ if(S.ui.navStack.length && !S.ui.backing){ S.ui.backing=true; history.back(); } }   // 닫는 건 popstate 한 곳에서
function navCloseTop(){
  var k=S.ui.navStack.pop(); if(!k) return;
  navCloseKey(k);                                             // 자기가 연 것만 닫는다
}
window.addEventListener("popstate", function(e){
  S.ui.backing=false;
  var d=((e.state && e.state.d)||0)-S.ui.navBase;                // 방문 기록이 몇 칸을 건너뛰었든 그 깊이까지 닫는다
  while(S.ui.navStack.length>Math.max(0,d)) navCloseTop();
  render();
});

/* ── 왼쪽 가장자리 끌기로 뒤로 ── */
function edgeSwipe(node, onBack){
  var x0=0, y0=0, dx=0, t0=0, on=false, go=false;
  node.addEventListener("touchstart", function(e){
    var t=e.touches[0]; on = e.touches.length===1 && t.clientX<=DRAG_CLOSE.EDGE;
    if(!on) return;
    x0=t.clientX; y0=t.clientY; dx=0; go=false; t0=e.timeStamp; node.style.transition="none";
  }, {passive:true});
  node.addEventListener("touchmove", function(e){
    if(!on) return;
    var t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!go){
      if(Math.abs(mx)<DRAG_CLOSE.SLOP && Math.abs(my)<DRAG_CLOSE.SLOP) return;   // 아직 방향 모름
      if(Math.abs(my)>Math.abs(mx)){ on=false; return; }             // 세로면 스크롤에 양보
      go=true; node.classList.add("drag");
    }
    e.preventDefault();
    dx=Math.max(0,mx); node.style.transform="translateX("+dx+"px)";
  }, {passive:false});
  function end(e){
    if(!on) return; on=false;
    if(!go) return;
    node.style.transition="transform .2s ease-out";
    if(dragFar(dx, e.timeStamp-t0, node.clientWidth, DRAG_CLOSE.SCREEN)){                // 짧게 튕겨도 나가짐
      node.style.transform="translateX(100%)"; setTimeout(onBack, DRAG_CLOSE.OUT_MS); }
    else { node.style.transform=""; node.classList.remove("drag"); }
  }
  node.addEventListener("touchend", end); node.addEventListener("touchcancel", end);
}

function csvText(){
  var q=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };   // 이름·용도 모두 — 쉼표가 들어가도 열이 안 밀린다

    lines.push([q(c.name), ledgerStart(c), q("처음 금액"), "", c.opening_balance||0].join(","));   // 첫 줄 = 처음 금액(화면의 처음 금액 줄과 같은 날짜)
    withTotals(c.id).reverse().forEach(function(e){ lines.push([q(c.name),e.entry_date,q(e.memo),e.amount,e.total].join(",")); });
  });
  return lines.join("\n");
}
function exportCSV(){
  var text=csvText();
  // 파일로 바로 내려받는다
  // 앞의 BOM 은 엑셀이 한글을 깨지 않고 열게 한다
  try{
    if(isIOS && navigator.canShare && window.File){     // 아이폰 홈 화면 앱은 a[download] 가 안 될 때가 있어 파일 공유로
      var file=new File(["\uFEFF"+text], "용돈기입장 "+today()+".csv", {type:"text/csv"});
      if(navigator.canShare({files:[file]})){ navigator.share({files:[file], title:"용돈기입장 기록"}).catch(ignore); return; }
    }
    var a=document.createElement("a");
    if("download" in a){
      var url=URL.createObjectURL(new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8"}));
      a.href=url; a.download="용돈기입장 "+today()+".csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      return;                                            // 알림은 안 띄운다(폰이 내려받기 표시를 띄운다)
    }
  }catch(e){ /* 파일 공유·내려받기가 안 되는 브라우저 — 아래 글자 공유·복사로 */ }
  if(navigator.share){ navigator.share({title:"용돈기입장 기록",text:text}).catch(ignore); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(text)
      .then(function(){ toast("복사했어요"); }, function(){ showText(text); }); return; }
  showText(text);
  function showText(t){    // 공유도 복사도 안 되는 환경 — 그래도 빈손으로 끝나지 않게
    var w=window.open("","_blank");
    if(w){ w.document.write("<pre style='font:14px/1.6 monospace;white-space:pre-wrap;padding:16px'></pre>");
           w.document.querySelector("pre").textContent=t; }
    else toast("내보내기를 지원하지 않는 환경이에요");
  }
}

/* ── 연결이 아예 안 될 때 (쓰던 내용도 없는 기기) ── */
function renderFail(){
  var wrap=el("div","start");
  var top=el("div","start-top");
  var logo=el("div","logo"); var img=document.createElement("img"); img.src="logo-pig-t.png"; img.alt="";
  logo.appendChild(img); top.appendChild(logo);
  top.appendChild(el("h2",null,"연결이 안 돼요"));
  top.appendChild(el("p",null,"잠시 뒤에 다시 열어보세요.\n기록은 그대로 있어요."));
  var body=el("div","start-body");
  var again=el("button","btn pri","다시 시도");
  again.onclick=function(){ S.screen="loading"; render(); boot(); };
  body.appendChild(again);
  wrap.appendChild(top); wrap.appendChild(body); return wrap;
}

/* ── 첫 시작 ── */
function renderOnboard(){
  var o=S.onboard, wrap=el("div","start");
  var top=el("div","start-top");
  var logo=el("div","logo"); var img=document.createElement("img");
  img.src="logo-pig-t.png"; img.alt=""; logo.appendChild(img); top.appendChild(logo);
  top.appendChild(el("h2",null,"용돈기입장"));
  var body=el("div","start-body");
  if(!o.mode){
    // 앱 안 브라우저(카톡 등)는 저장소가 따로라 경고한다. 안드로이드 크롬 탭은 설치 앱과 저장소를 같이 써서 경고하지 않는다
    var inApp=/KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\/|; wv\)/i.test(navigator.userAgent);
    if(inApp){
      var w0=el("div","warn");
      w0.appendChild(el("b",null,"다른 앱 안에서 열렸어요."));
      w0.appendChild(el("p",null,"여기서 시작하면 기록이 따로 놀아요. 메뉴에서 '다른 브라우저로 열기'를 눌러 "+(isIOS?"사파리":"크롬")+"로 열어 주세요."));
      body.appendChild(w0);
    } else if(isIOS && !window.navigator.standalone){
      var w=el("div","warn");
      w.appendChild(el("b",null,"먼저 홈 화면에 추가해 주세요."));
      w.appendChild(el("p",null,"아래 공유 버튼에서 홈 화면에 추가를 누르고, 그 아이콘으로 열어서 시작해 주세요. 사파리에서 바로 시작하면 기록이 따로 놀아요."));
      body.appendChild(w);
    }
    var st=el("div","stack");
    var b1=el("button","btn pri","새로 시작하기"); b1.onclick=function(){ o.mode="new"; render(); }; st.appendChild(b1);
    if(store.kind==="supabase"){
      var b2=el("button","btn","가족 코드로 참여"); b2.onclick=function(){ o.mode="join"; render(); }; st.appendChild(b2);
    }
    if(S.ui.installEvt){                                  // 안드로이드 크롬이 설치 가능을 알려왔을 때만
      var b3=el("button","btn","홈 화면에 추가");
      b3.onclick=function(){
        var ev=S.ui.installEvt; ev.prompt();
        (ev.userChoice||Promise.resolve()).then(function(){ S.ui.installEvt=null; render(); }, ignore); };
      st.appendChild(b3);
    }
    body.appendChild(st);
    wrap.appendChild(top); wrap.appendChild(body); return wrap;
  }

  if(o.mode==="join"){
    top.appendChild(el("p",null,"다른 폰 설정에 있는 코드를 넣어주세요."));
    var f=el("div","f");
    var bx=el("div","box");
    var ci=document.createElement("input"); ci.type="text"; ci.placeholder="ABCD-1234";
    ci.autocapitalize="characters"; ci.autocomplete="off"; ci.value=o.code;
    ci.className="code-in";
    // 치는 대로 ABCD-1234 꼴로(대문자 · 영숫자, 4자리 뒤 -). 커서는 끝
    ci.oninput=function(){ var raw=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
      o.code = raw.length>4 ? raw.slice(0,4)+"-"+raw.slice(4) : raw;
      if(ci.value!==o.code) ci.value=o.code;
      try{ ci.setSelectionRange(ci.value.length, ci.value.length); }catch(_){} };
    ci.maxLength=9;
    bx.appendChild(ci); f.appendChild(bx);
    var btns=el("div","btns");
    var back=el("button","btn","뒤로"); back.onclick=function(){ o.mode=null; render(); };
    var go=el("button","btn pri","참여");
    go.onclick=function(){
      var code=o.code.trim().replace(/[^A-Z0-9]/g,"");
      if(code.length!==8){ toast("코드 8자리를 확인해 주세요"); return; }
      code=code.slice(0,4)+"-"+code.slice(4);
      go.disabled=true;
      store.joinFamily(code).then(function(){ S.screen="home"; return reload(); })
        .catch(function(err){ go.disabled=false; toast(errText(err)); });
    };
    btns.appendChild(back); btns.appendChild(go); f.appendChild(btns);
    body.appendChild(f);
    wrap.appendChild(top); wrap.appendChild(body); return wrap;
  }

  top.appendChild(el("p",null,"이름이랑 지금 가진 돈만 적으면 돼요."));
  var f2=el("div","f");
  o.names.forEach(function(nm,i){
    var r=el("div","pair");
    var ni=document.createElement("input"); ni.type="text"; ni.value=nm; ni.placeholder="이름";
    ni.oninput=function(){ o.names[i]=ni.value; }; r.appendChild(ni);
    var ai=moneyInput("r", o.opens[i], function(v){ o.opens[i]=v; }, {placeholder:"0"});   // 치는 동안엔 쉼표, 다시 그리면 저장한 숫자 그대로
    r.appendChild(ai); r.appendChild(el("span",null,"원"));
    f2.appendChild(r);
  });
  var tools=el("div","start-tools");
  if(o.names.length<MAX_KIDS){
    var addk=el("button","link sm","＋ 아이 추가");
    addk.onclick=function(){ o.names.push(ORDINALS[o.names.length]); o.opens.push(""); render(); };
    tools.appendChild(addk);
  }
  if(o.names.length>1){
    var rm=el("button","link sm","－ 마지막 아이 빼기");
    rm.onclick=function(){ o.names.pop(); o.opens.pop(); render(); };
    tools.appendChild(rm);
  }
  f2.appendChild(tools);
  var btns2=el("div","btns");
  var back2=el("button","btn","뒤로"); back2.onclick=function(){ o.mode=null; render(); };
  var go2=el("button","btn pri","시작");
  go2.onclick=function(){
    var names=o.names.map(function(x){ return x.trim(); });
    if(names.some(function(x){ return !x; })){ toast("이름을 넣어주세요"); return; }
    go2.disabled=true;
    var code=genCode(), keys=Object.keys(COLORS);
    (store.familyId ? Promise.resolve() : store.createFamily(code)).then(function(){   // 아이 저장이 실패해 다시 누를 때 가족을 또 만들지 않는다
      return store.loadAll().then(function(d){                                         // 앞 시도에서 들어간 아이는 건너뛴다
        var have={}; d.children.forEach(function(c){ have[c.sort]=1; });
        return names.reduce(function(pr,nm,i){
          if(have[i]) return pr;
          return pr.then(function(){
            return store.upsertChild({name:nm, color:keys[i%keys.length], sort:i,
              opening_balance:Number(o.opens[i])||0, weekly_on:false, weekly_amount:0});
          });
        }, Promise.resolve()); });
    }).then(function(){ S.screen="home"; return reload(); })
      .catch(function(err){ go2.disabled=false; toast("시작 실패: "+errText(err)); });
  };
  btns2.appendChild(back2); btns2.appendChild(go2); f2.appendChild(btns2);
  body.appendChild(f2);
  wrap.appendChild(top); wrap.appendChild(body); return wrap;
}

/* 안드로이드 크롬 설치 이벤트. 받아 두면 시작 화면에 "홈 화면에 추가" 버튼 */
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); S.ui.installEvt=e; if(S.screen==="onboard") render(); });
window.addEventListener("appinstalled", function(){ S.ui.installEvt=null; if(S.screen==="onboard") render(); });
window.addEventListener("resize", function(){ if(S.tour) tourSync(); });    // 안내 중 회전으로 자리가 바뀌면 다시 잰다
window.addEventListener("scroll", function(){ if(S.tour) tourSync(); }, {passive:true});
window.addEventListener("scrollend", function(){ if(S.tour) tourSync(); });   // iOS 는 scroll 이 늦거나 안 올 때가 있다

/* ══════════════════════ 부팅 ══════════════════════ */
function boot(){
 return ensureFamily().then(function(ok){
  // "가족 없음"(시작 화면)과 "실패"(캐시 화면 또는 연결 안 됨)는 다르다. 실패에 시작 화면을 보이면 기록이 없어진 것처럼 보인다
  if(!ok){ S.screen="onboard"; render(); return; }
  S.screen="home";
  return reload();
 }).catch(function(e){
  console.error(e);
  if(useCache()){ S.screen="home"; render(); return; }        // 쓰던 기기 — 마지막 화면 + 배너
  S.screen="fail"; render();                                   // 처음 보는 기기
 });
}
render(); boot();

// 설정을 열어 둔 채 돌아와도 받는다(그날 자동 용돈)
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && (S.screen==="home" || S.screen==="settings")) reload(); });
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(ignore); }); }

// 테스트용(tests/unit.test.js). 앱은 안 쓴다
window.__app = {S:S, APP_VERSION:APP_VERSION, KID_BG:KID_BG, THEME_PAPER:THEME_PAPER, SUPABASE_JS:SUPABASE_JS,
  fmt:fmt, fmtSigned:fmtSigned, digits:digits, addDays:addDays, dowOf:dowOf, localDay:localDay, plainDate:plainDate, shortDate:shortDate,
  splitWon:splitWon, memoBase:memoBase, signForMemo:signForMemo, recentMemos:recentMemos, withTotals:withTotals, balanceOf:balanceOf,
  csvText:csvText, normalizeUrl:normalizeUrl, genCode:genCode, reload:reload,
  lastAutoDay:lastAutoDay, firstPayChoices:firstPayChoices, byDateThenCreated:byDateThenCreated, ensureAllowances:ensureAllowances};
})();
</script>

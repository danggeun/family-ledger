<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>용돈기입장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="용돈기입장">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#FFFFFF; --bg:#F5F6F8; --ink:#1B1F24; --muted:#7A828C; --line:#E6E9ED; --line-2:#F0F2F4;
  --c-blue:#2F6FA8;   --c-blue-soft:#EDF3FA;
  --c-apricot:#D9743C;--c-apricot-soft:#FBEFE6;
  --c-green:#3F8F5B;  --c-green-soft:#E9F5EE;
  --c-purple:#7A5FB0; --c-purple-soft:#F1ECFA;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; overscroll-behavior-y:none}
button,input{font:inherit; color:inherit}
button{appearance:none; border:0; background:none; padding:0; cursor:pointer}
input{border:0; background:none; outline:none; min-width:0}
[hidden]{display:none!important}
.screen{min-height:100dvh; padding-top:var(--sat)}

/* ── 상단 ── */
.top{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px}
.top h1{font-size:15px; font-weight:600; margin:0}
.top .icon{width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:19px; color:var(--muted)}
.top .icon:active{background:var(--line-2)}

/* ── 잔액 카드 ── */
.bal-row{display:flex; gap:8px; padding:6px 14px 10px; overflow-x:auto; scrollbar-width:none}
.bal-row::-webkit-scrollbar{display:none}
.bal{flex:1 0 46%; min-width:140px; border-radius:16px; padding:12px 14px 10px; border:1.5px solid var(--line); background:var(--paper); text-align:left; transition:background .12s,border-color .12s}
.bal .nm{font-size:12px; font-weight:500; color:var(--muted)}
.bal .amt{font-size:23px; font-weight:600; margin-top:1px; letter-spacing:-.01em; white-space:nowrap}
.bal .amt small{font-size:12px; font-weight:400; color:var(--muted); margin-left:2px}
.bal.on{border-color:var(--c); background:var(--c-soft)}
.bal.on .nm{color:var(--c)}

/* ── 통장 ── */
.pb{padding:0 12px 120px}
.pb-head{display:grid; grid-template-columns:42px 1fr 74px 68px; gap:6px; padding:8px 4px 6px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line)}
.pb-head span:nth-child(n+3){text-align:right}
.row{display:grid; grid-template-columns:42px 1fr 74px 68px; gap:6px; padding:10px 4px; border-bottom:1px solid var(--line-2); align-items:center; font-size:14px; width:100%; text-align:left}
.row .d{color:var(--muted); font-size:12px}
.row .m{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .m.empty{color:var(--muted)}
.row .a{text-align:right; white-space:nowrap}
.row .a.in{color:var(--c)}
.row .t{text-align:right; font-weight:500; white-space:nowrap}
.row.auto .m::after{content:" 자동"; font-size:10px; color:var(--muted); vertical-align:1px}
.row:active{background:var(--line-2)}

/* ── 새 줄 (인라인 입력) ── */
.new{display:grid; grid-template-columns:42px 1fr 96px 34px; gap:6px; align-items:center; padding:8px 4px; margin:6px 0 2px; background:#FFF9E6; outline:1.5px dashed #E4BE58; border-radius:10px}
.new .dbtn{font-size:12px; line-height:1.2; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:6px 2px; text-align:center; color:var(--ink)}
.new input.memo{font-size:16px; padding:6px 4px; border-bottom:1px solid transparent}
.new input.memo::placeholder{color:#A6ADB5}
.new .acell{display:flex; align-items:center; gap:3px; justify-content:flex-end}
.new .sign{width:24px; height:24px; border-radius:50%; background:var(--ink); color:#fff; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none}
.new .sign.plus{background:var(--c)}
.new input.amt{font-size:16px; text-align:right; width:100%; padding:6px 0}
.new input.amt::placeholder{color:#A6ADB5}
.new .ok{width:34px; height:34px; border-radius:9px; background:var(--ink); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center}
.new .ok[disabled]{background:#C9CED4}
.chips{display:flex; gap:6px; flex-wrap:wrap; padding:6px 4px 4px}
.chips button{border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px; background:var(--paper)}
.chips button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.chips.dates{padding-top:2px}
.chips input[type=date]{border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:16px; background:var(--paper); color:var(--ink)}
.empty-msg{padding:40px 12px; text-align:center; color:var(--muted); font-size:14px}

/* ── 시트 ── */
.dim{position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:30}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-radius:18px 18px 0 0; padding:14px 18px calc(18px + var(--sab)); z-index:31; box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 12px; font-size:15px; font-weight:600}
.f{display:flex; flex-direction:column; gap:10px}
.f label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px}
.f .box{border:1px solid var(--line); border-radius:11px; padding:10px 12px; display:flex; align-items:center; gap:8px}
.f .box input{flex:1; font-size:16px}
.f .box input.r{text-align:right}
.seg{display:flex; background:var(--line-2); border-radius:11px; padding:3px}
.seg button{flex:1; padding:9px; border-radius:9px; font-size:14px; color:var(--muted); font-weight:500}
.seg button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btns{display:flex; gap:8px; margin-top:6px}
.btn{flex:1; height:46px; border-radius:12px; font-size:15px; font-weight:500; display:flex; align-items:center; justify-content:center; background:var(--line-2); color:var(--ink)}
.btn.pri{background:var(--ink); color:#fff}
.btn.danger{color:#C33; background:#FBEAEA; flex:0 0 auto; padding:0 16px}
.btn.danger.arm{background:#C33; color:#fff}
.btn[disabled]{opacity:.45}

/* ── 설정 · 시작 ── */
.page{padding:0 18px calc(40px + var(--sab))}
.nav{display:flex; align-items:center; gap:6px; padding:10px 8px 6px}
.nav .back{width:40px; height:40px; font-size:26px; font-weight:300; display:flex; align-items:center; justify-content:center; border-radius:10px}
.nav .back:active{background:var(--line-2)}
.nav h2{margin:0; font-size:16px; font-weight:600}
.sec-h{font-size:11.5px; color:var(--muted); letter-spacing:.03em; margin:22px 0 6px; font-weight:500}
.srow{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-2); font-size:15px}
.srow .grow{flex:1}
.srow .val{color:var(--muted); font-size:13.5px; text-align:right}
.srow input{font-size:16px; text-align:right; width:110px}
.srow input.nm{text-align:left; width:auto; flex:1}
.dot{width:14px; height:14px; border-radius:50%; flex:none}
.tog{width:44px; height:26px; border-radius:13px; background:#D1D5DA; position:relative; flex:none; transition:background .15s}
.tog.on{background:var(--c-blue)}
.tog::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s}
.tog.on::after{left:21px}
.sub{padding:6px 0 10px 24px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px}
.sub .dow{display:flex; gap:4px}
.sub .dow button{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); font-size:13px}
.sub .dow button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.sub .box{border:1px solid var(--line); border-radius:9px; padding:6px 10px; display:flex; align-items:center; gap:4px}
.sub .box input{width:70px; text-align:right; font-size:16px}
.code{font-family:ui-monospace,Menlo,monospace; font-size:20px; letter-spacing:.08em; font-weight:600}
.note{font-size:13px; color:var(--muted); line-height:1.55; margin:6px 0 0}
.swatch{display:flex; gap:8px}
.swatch button{width:26px; height:26px; border-radius:50%; border:2px solid transparent}
.swatch button.on{border-color:var(--ink)}
.link{color:var(--c-blue); font-size:14px; padding:12px 0}
.hero{padding:60px 0 20px; text-align:center}
.hero .logo{width:72px; height:72px; border-radius:20px; background:var(--c-blue); margin:0 auto 18px; display:flex; align-items:center; justify-content:center}
.hero .logo i{display:block; width:34px; height:44px; background:#fff; border-radius:4px; position:relative}
.hero .logo i::before,.hero .logo i::after{content:""; position:absolute; left:6px; right:6px; height:3px; background:var(--c-blue); border-radius:2px; top:12px; box-shadow:0 9px 0 var(--c-blue), 0 18px 0 var(--c-blue)}
.hero h2{font-size:22px; margin:0 0 6px}
.hero p{color:var(--muted); margin:0; font-size:14px}
.stack{display:flex; flex-direction:column; gap:10px; margin-top:24px}
.toast{position:fixed; left:50%; bottom:calc(24px + var(--sab)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center}
.toast.show{opacity:1}
.syncdot{width:7px; height:7px; border-radius:50%; background:#C9CED4; display:inline-block; margin-right:6px; vertical-align:1px}
.syncdot.on{background:var(--c-green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

/* ══════════════════════ 유틸 ══════════════════════ */
var COLORS = {
  blue:   {c:"var(--c-blue)",    soft:"var(--c-blue-soft)",    hex:"#2F6FA8"},
  apricot:{c:"var(--c-apricot)", soft:"var(--c-apricot-soft)", hex:"#D9743C"},
  green:  {c:"var(--c-green)",   soft:"var(--c-green-soft)",   hex:"#3F8F5B"},
  purple: {c:"var(--c-purple)",  soft:"var(--c-purple-soft)",  hex:"#7A5FB0"}
};
var DOW = ["일","월","화","수","목","금","토"];
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }   // 로컬 날짜. toISOString 금지(UTC 밀림)
function today(){ return ymd(new Date()); }
function addDays(s, n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function dowOf(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getDay(); }
function fmt(n){ n=Math.round(n||0); var s=Math.abs(n).toLocaleString("ko-KR"); return (n<0?"−":"")+s; }
function fmtSigned(n){ return (n>0?"+":"−")+Math.abs(n).toLocaleString("ko-KR"); }
function digits(s){ return (s||"").replace(/[^\d]/g,""); }
function shortDate(s){ var t=today(); if(s===t) return "오늘"; if(s===addDays(t,-1)) return "어제"; var p=s.split("-"); var y=p[0]===t.slice(0,4)?"":p[0].slice(2)+"."; return y+(+p[1])+"."+pad(+p[2]); }
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function uid(){ return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,function(c){ return (c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16); }); }
function genCode(){ var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out=""; var r=crypto.getRandomValues(new Uint8Array(8)); for(var i=0;i<8;i++){ out+=A[r[i]%A.length]; if(i===3) out+="-"; } return out; }
var toastT; function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },1800); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ══════════════════════ 저장소: 로컬 ══════════════════════ */
function LocalStore(){
  this.kind = "local";
  this.key = "yd_local_v1";
  this.db = JSON.parse(lsGet(this.key) || "null") || {family:null, children:[], entries:[]};
}
LocalStore.prototype = {
  save: function(){ lsSet(this.key, JSON.stringify(this.db)); },
  init: function(){ return Promise.resolve(this.db.family ? {familyId:this.db.family.id, code:this.db.family.code} : null); },
  createFamily: function(code){ this.db.family={id:uid(), code:code}; this.save(); return Promise.resolve(this.db.family.id); },
  joinFamily: function(){ return Promise.reject(new Error("로컬 모드에서는 코드 참여가 안 돼요. config.js에 Supabase 정보를 넣어주세요.")); },
  loadAll: function(){ var d=this.db; return Promise.resolve({family:d.family, children:d.children.slice().sort(function(a,b){return a.sort-b.sort;}), entries:d.entries.slice()}); },
  upsertChild: function(c){ var i=this.db.children.findIndex(function(x){return x.id===c.id;}); if(i<0){ c.id=c.id||uid(); c.created_at=c.created_at||new Date().toISOString(); this.db.children.push(c);} else this.db.children[i]=Object.assign({},this.db.children[i],c); this.save(); return Promise.resolve(c); },
  deleteChild: function(id){ this.db.children=this.db.children.filter(function(x){return x.id!==id;}); this.db.entries=this.db.entries.filter(function(x){return x.child_id!==id;}); this.save(); return Promise.resolve(); },
  addEntry: function(e){ e.id=uid(); e.created_at=new Date().toISOString(); e.updated_at=e.created_at; this.db.entries.push(e); this.save(); return Promise.resolve(e); },
  addEntriesIgnoreDup: function(rows){ var self=this, n=0; rows.forEach(function(r){ var dup=self.db.entries.some(function(x){return x.child_id===r.child_id && x.auto_key && x.auto_key===r.auto_key;}); if(!dup){ r.id=uid(); r.created_at=new Date().toISOString(); r.updated_at=r.created_at; self.db.entries.push(r); n++; } }); this.save(); return Promise.resolve(n); },
  updateEntry: function(id, patch){ var e=this.db.entries.find(function(x){return x.id===id;}); if(e){ Object.assign(e,patch); e.updated_at=new Date().toISOString(); } this.save(); return Promise.resolve(); },
  deleteEntry: function(id){ this.db.entries=this.db.entries.filter(function(x){return x.id!==id;}); this.save(); return Promise.resolve(); },
  subscribe: function(){ }
};

/* ══════════════════════ 저장소: Supabase ══════════════════════ */
function SupaStore(cfg){
  this.kind = "supabase";
  this.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  this.familyId = null;
}
SupaStore.prototype = {
  init: function(){
    var self=this, sb=this.sb;
    return sb.auth.getSession().then(function(r){
      if(r.data.session) return r.data.session;
      return sb.auth.signInAnonymously().then(function(r2){ if(r2.error) throw r2.error; return r2.data.session; });
    }).then(function(){
      return sb.from("family_members").select("family_id, families(code)").limit(1);
    }).then(function(r){
      if(r.error) throw r.error;
      if(!r.data || !r.data.length) return null;
      self.familyId = r.data[0].family_id;
      return {familyId:self.familyId, code:(r.data[0].families||{}).code};
    });
  },
  createFamily: function(code){ var self=this; return this.sb.rpc("create_family",{p_code:code}).then(function(r){ if(r.error) throw r.error; self.familyId=r.data; return r.data; }); },
  joinFamily: function(code){ var self=this; return this.sb.rpc("join_family",{p_code:code}).then(function(r){ if(r.error) throw new Error("코드를 찾을 수 없어요. 다시 확인해 주세요."); self.familyId=r.data; return r.data; }); },
  loadAll: function(){
    var sb=this.sb, fid=this.familyId;
    return Promise.all([
      sb.from("families").select("id, code").eq("id", fid).single(),
      sb.from("children").select("*").eq("family_id", fid).order("sort"),
      sb.from("entries").select("*").eq("family_id", fid)
    ]).then(function(rs){
      rs.forEach(function(r){ if(r.error) throw r.error; });
      return {family:rs[0].data, children:rs[1].data||[], entries:rs[2].data||[]};
    });
  },
  upsertChild: function(c){ c.family_id=this.familyId; var q=c.id ? this.sb.from("children").update(c).eq("id",c.id).select().single() : this.sb.from("children").insert(c).select().single(); return q.then(function(r){ if(r.error) throw r.error; return r.data; }); },
  deleteChild: function(id){ return this.sb.from("children").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; }); },
  addEntry: function(e){ e.family_id=this.familyId; return this.sb.from("entries").insert(e).select().single().then(function(r){ if(r.error) throw r.error; return r.data; }); },
  addEntriesIgnoreDup: function(rows){ var fid=this.familyId; rows.forEach(function(r){ r.family_id=fid; }); return this.sb.from("entries").upsert(rows,{onConflict:"child_id,auto_key", ignoreDuplicates:true}).select().then(function(r){ if(r.error) throw r.error; return (r.data||[]).length; }); },
  updateEntry: function(id, patch){ patch.updated_at=new Date().toISOString(); return this.sb.from("entries").update(patch).eq("id",id).then(function(r){ if(r.error) throw r.error; }); },
  deleteEntry: function(id){ return this.sb.from("entries").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; }); },
  subscribe: function(cb){
    var fid=this.familyId;
    this.sb.channel("fam-"+fid)
      .on("postgres_changes",{event:"*",schema:"public",table:"entries",filter:"family_id=eq."+fid}, cb)
      .on("postgres_changes",{event:"*",schema:"public",table:"children",filter:"family_id=eq."+fid}, cb)
      .subscribe();
  }
};

/* ══════════════════════ 상태 ══════════════════════ */
var CFG = window.APP_CONFIG || {};
var store = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) ? new SupaStore(CFG) : new LocalStore();
var S = {
  screen:"loading", family:null, children:[], entries:[],
  sel: lsGet("yd_sel") || null,
  draft:{date:today(), memo:"", amount:"", sign:-1},
  memoFocus:false, datePick:false,
  edit:null,            // 편집 중인 entry
  onboard:{mode:null, names:["첫째","둘째"], opens:["",""], code:""}
};
var root = document.getElementById("app");

/* ══════════════════════ 계산 ══════════════════════ */
function childOf(id){ return S.children.find(function(c){return c.id===id;}); }
function entriesFor(cid){
  return S.entries.filter(function(e){return e.child_id===cid && !e.skipped;})
    .sort(function(a,b){ return a.entry_date<b.entry_date?-1:a.entry_date>b.entry_date?1:(a.created_at<b.created_at?-1:1); });
}
function withTotals(cid){
  var c=childOf(cid); var run=c?(c.opening_balance||0):0;
  var rows=entriesFor(cid).map(function(e){ run+=e.amount; return Object.assign({},e,{total:run}); });
  return rows.reverse();
}
function balanceOf(cid){ var c=childOf(cid); var b=c?(c.opening_balance||0):0; entriesFor(cid).forEach(function(e){ b+=e.amount; }); return b; }
function recentMemos(cid){
  var seen={}, out=[];
  withTotals(cid).forEach(function(e){ var m=(e.memo||"").trim(); if(!m||seen[m]||e.auto_key) return; seen[m]=1; out.push(m); });
  return out.slice(0,6);
}

/* ══════════════════════ 자동 입금 ══════════════════════ */
function ensureAllowances(){
  var t=today(), rows=[];
  S.children.forEach(function(c){
    if(!c.weekly_on || c.weekly_dow==null || !(c.weekly_amount>0)) return;
    var from = c.weekly_start || (c.created_at||"").slice(0,10) || t;
    var have={}; S.entries.forEach(function(e){ if(e.child_id===c.id && e.auto_key) have[e.auto_key]=1; });
    var d=from, guard=0;
    while(d<=t && guard++<400){
      if(dowOf(d)===c.weekly_dow){ var k="w:"+d; if(!have[k]) rows.push({child_id:c.id, entry_date:d, memo:"용돈", amount:c.weekly_amount, auto_key:k}); }
      d=addDays(d,1);
    }
  });

var loading=false, pendingReload=false;
function reload(){
  if(loading){ pendingReload=true; return Promise.resolve(); }
  loading=true;
  return store.loadAll().then(function(d){
    S.family=d.family; S.children=d.children; S.entries=d.entries;
    if(!S.sel || !childOf(S.sel)) S.sel = S.children.length ? S.children[0].id : null;
    return ensureAllowances();
  }).then(function(n){
    if(n>0) return store.loadAll().then(function(d){ S.entries=d.entries; });
  }).catch(function(e){ console.error(e); toast("불러오기 실패: "+(e.message||e)); })
  .then(function(){ loading=false; render(); if(pendingReload){ pendingReload=false; reload(); } });
}

    f2.appendChild(r);
  });
  var addk=el("button","link",o.names.length<4?"＋ 아이 추가":""); if(o.names.length<4){ addk.onclick=function(){ o.names.push(["첫째","둘째","셋째","넷째"][o.names.length]); o.opens.push(""); render(); }; f2.appendChild(addk); }
  if(o.names.length>1){ var rm=el("button","link","－ 마지막 아이 빼기"); rm.onclick=function(){ o.names.pop(); o.opens.pop(); render(); }; f2.appendChild(rm); }
  var btns2=el("div","btns"); var back2=el("button","btn","뒤로"); back2.onclick=function(){ o.mode=null; render(); };
  var go2=el("button","btn pri","시작"); go2.onclick=function(){
    var names=o.names.map(function(s){return s.trim();}); if(names.some(function(s){return !s;})){ toast("이름을 넣어주세요"); return; }
    go2.disabled=true;
    var code=genCode(), keys=Object.keys(COLORS);
    store.createFamily(code).then(function(){
      return names.reduce(function(p,nm,i){ return p.then(function(){ return store.upsertChild({name:nm, color:keys[i%4], sort:i, opening_balance:Number(o.opens[i])||0, weekly_on:false, weekly_amount:0}); }); }, Promise.resolve());
    }).then(function(){ S.screen="home"; return reload(); }).catch(function(err){ go2.disabled=false; toast("시작 실패: "+(err.message||err)); });
  };
  btns2.appendChild(back2); btns2.appendChild(go2); f2.appendChild(btns2); wrap.appendChild(f2);
  return wrap;
}

/* ══════════════════════ 부팅 ══════════════════════ */
render();
store.init().then(function(fam){
  if(!fam){ S.screen="onboard"; render(); return; }
  S.screen="home";
  store.subscribe(function(){ clearTimeout(window.__rt); window.__rt=setTimeout(reload, 300); });
  return reload();
}).catch(function(e){ console.error(e); S.screen="onboard"; render(); toast("연결 실패: "+(e.message||e)); });

document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && S.screen==="home") reload(); });
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
</body>

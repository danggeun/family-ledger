<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>용돈기입장</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="용돈기입장">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="splash.png">
<style>
:root{
  --paper:#FDFCFA;
  --wash:#F3F1EC;
  --ink:#111317;
  --ink-2:#3E434B;
  --ink-3:#5D6067;
  --muted:#767C86;
  --faint:#9AA0A9;
  --hair:#E8E5DE;
  --hair-2:#F1EFE9;
  --in:#1B7A5A;
  --c:#2F6FA8;
  /* 타입 램프 — 7단계. 본문권(11·12·13·15·17)은 촘촘히, 표시권(28·44)은 약 1.6배씩 */
  --t1:11px;  /* 뱃지 */
  --t2:12px;  /* 캡션·라벨·날짜 */
  --t3:13px;  /* 보조 텍스트 */
  --t4:15px;  /* 본문 */
  --t5:17px;  /* 강조·입력·제목 */
  --t6:28px;  /* 큰 제목 */
  --t7:44px;  /* 잔액 */
  /* 4px 간격 격자 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:var(--t4); line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;}
button,input{font:inherit; color:inherit}
button{appearance:none; border:0; background:none; padding:0; cursor:pointer}
input{border:0; background:none; outline:none; min-width:0}
[hidden]{display:none!important}
.screen{min-height:100dvh; padding:calc(var(--sat) + 6px) 20px calc(48px + var(--sab))}

/* ─── 상단: 아이 탭 + 설정 ─── */
.bar{display:flex; align-items:center; gap:22px; height:46px}
.bar .k{position:relative; padding:12px 0; font-size:var(--t5); font-weight:600; color:var(--faint);
  letter-spacing:-.01em; transition:color .15s}
.bar .k.on{color:var(--c-mid)}
.bar .k.on::after{content:""; position:absolute; left:0; right:0; bottom:4px; height:4px;
  border-radius:2px; background:var(--c)}
.bar .sp{flex:1}
.bar .gear{width:38px; height:38px; margin-right:-9px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:var(--t5); color:var(--muted)}
.bar .gear:active{background:var(--wash)}

/* ─── 달력 ─── */
.calh{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px}
.calh .t{font-size:var(--t4); font-weight:700}
.calh .navb{width:38px; height:38px; border-radius:50%; font-size:var(--t5); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center}
.calh .navb:disabled{opacity:.25}
.calh .navb:active:not(:disabled){background:var(--wash)}
.calw{display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
  font-size:var(--t2); color:var(--muted); padding-bottom:2px}
.calg{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.calg button, .calg .pad{height:44px}
.calg button{border-radius:13px; font-size:var(--t4); color:var(--ink)}
.calg button:disabled{color:var(--faint); opacity:.4}
.calg button.today{font-weight:700; box-shadow:inset 0 0 0 1px var(--hair)}
.calg button.on{background:var(--ink); color:#fff; font-weight:700}
.calg button:active:not(.on):not(:disabled){background:var(--wash)}
.f .box.tapbox{width:100%; text-align:left; font-size:var(--t5); font-weight:500}
.f .box.tapbox .grow{flex:1}
.f .box.tapbox .chev{color:var(--faint); font-size:var(--t5); line-height:1}

/* ─── 연결 안 됨 알림 ─── */
.offbar{display:flex; align-items:center; gap:var(--s2); width:100%; text-align:left;
  background:var(--wash); border-radius:12px; padding:11px 12px; margin:var(--s2) 0 0;
  font-size:var(--t3); color:var(--ink-2)}
.offbar .d{width:7px; height:7px; border-radius:50%; background:#C79A2E; flex:none}
.offbar .r{margin-left:auto; font-weight:600; color:var(--ink)}
.offbar:active{background:var(--hair)}

/* ─── 잔액 ─── */
/* ─── 아이에게 보여주기 — 로고의 세계로 들어가는 화면. 배경·돼지·돈 모두 로고 타일과 같은 문법 ─── */
.balbtn{display:flex; align-items:baseline; gap:5px; margin-left:-6px; padding:0 8px 0 6px; border-radius:12px}
.balbtn:active{background:var(--wash)}
.balbtn .pig{align-self:center; width:31px; height:28px; margin-left:8px; object-fit:contain}
.kid{position:fixed; inset:0; z-index:60; background:#FDF6E7; color:#2B1D14; overflow:auto;
  display:flex; flex-direction:column; align-items:center; padding:calc(var(--sat) + 64px) 24px calc(32px + var(--sab))}
.kid .x{position:absolute; top:calc(var(--sat) + 10px); right:14px; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:var(--t6); font-weight:300; color:#B9AB96}
.kid .pig{width:222px; height:auto; aspect-ratio:600/569; flex:none}   /* 비율을 미리 잡아둬야 그림이 늦게 떠도 배치가 안 흔들린다 */
.kid .kn{font-size:var(--t5); font-weight:700; color:var(--c-mid); margin-top:6px}
.kid .ka{display:flex; align-items:baseline; gap:5px; margin-top:2px}
.kid .ka b{font-size:var(--t7); font-weight:800; letter-spacing:-.04em; line-height:1.05}
.kid .ka i{font-style:normal; font-size:var(--t5); font-weight:600; color:#8C7B66}
.money{display:flex; flex-direction:column; gap:var(--s4); align-items:flex-start; margin-top:var(--s5)}
.kid.tight .pig{width:150px}      /* 줄이 많거나 화면이 작으면 돼지를 줄여 한 화면에 담는다 */
.kid.tight .money{gap:var(--s3); margin-top:var(--s4)}
.kid.tighter .pig{width:104px}
.kid.tighter .money{gap:var(--s2)}
.money .row{display:flex; align-items:center; padding:0; border:0; background:none}
.money .st{position:relative}
.money .st svg{position:absolute; left:0; top:0; display:block}
.money .xn{margin-left:var(--s2); font-weight:700; font-size:var(--t4); color:#8C7B66}
.bal{display:flex; align-items:baseline; gap:5px; padding:var(--s4) 0 var(--s5)}
.bal b{font-size:var(--t7); font-weight:700; letter-spacing:-.04em; line-height:1; color:var(--ink)}
.bal i{font-style:normal; font-size:var(--t5); font-weight:600; color:var(--muted)}

/* ─── 표 ─── */
.thead,.row{display:grid; grid-template-columns:44px 1fr 86px 78px; gap:8px; align-items:center}
.thead{padding:0 2px var(--s3); border-bottom:1px solid var(--hair);
  font-size:var(--t2); font-weight:600; color:var(--muted); letter-spacing:.01em}
.thead span:nth-child(n+3){text-align:right}
.row{padding:14px 2px; border-bottom:1px solid var(--hair-2); width:100%; text-align:left}
.row .d{font-size:var(--t2); font-weight:500; color:var(--ink-3)}
.row .m{font-size:var(--t4); font-weight:500; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .m.empty{color:var(--faint)}
.row .a{text-align:right; font-size:var(--t4); font-weight:600; letter-spacing:-.02em; white-space:nowrap}
.row .a.in{color:var(--in)}
.row .t{text-align:right; font-size:var(--t3); font-weight:600; color:var(--ink-3);
  letter-spacing:-.015em; white-space:nowrap}
.row.auto .m::after{content:"자동"; font-size:var(--t1); font-weight:600; color:var(--muted);
  border:1px solid var(--hair); border-radius:4px; padding:1px 4px; margin-left:6px; vertical-align:2px}
.row:active{background:var(--wash)}
.row.open .m{color:var(--muted)}
.row.open .t{color:var(--muted); font-weight:500}

/* ─── 입력 줄 (통장 맨 윗줄) ─── */
.entry{display:grid; grid-template-columns:44px 1fr 98px 36px; gap:8px; align-items:center;
  background:#FFFFFF; border-radius:14px; padding:10px 11px; margin:12px -11px 4px;
  box-shadow:0 1px 2px rgba(40,34,24,.05), 0 8px 20px -14px rgba(40,34,24,.28)}
.entry .dbtn{font-size:var(--t2); font-weight:600; line-height:1.15; color:var(--ink-2);
  background:var(--wash); border-radius:9px; padding:8px 2px; text-align:center}
.entry .dbtn:active{background:var(--hair-2)}
.entry input.memo{font-size:var(--t5); font-weight:500; padding:7px 2px; letter-spacing:-.01em}
.entry input.memo::placeholder{color:var(--faint); font-weight:400}
.entry .acell{display:flex; align-items:center; gap:6px; justify-content:flex-end}
.entry .sign{width:25px; height:25px; border-radius:50%; background:var(--ink); color:#fff;
  font-size:var(--t5); line-height:1; display:flex; align-items:center; justify-content:center; flex:none}
.entry .sign.plus{background:var(--in)}
.entry input.amt{font-size:var(--t5); font-weight:600; text-align:right; width:100%;
  padding:7px 0; letter-spacing:-.02em}
.entry input.amt::placeholder{color:var(--faint); font-weight:400}
.entry .ok{width:36px; height:36px; border-radius:11px; background:var(--ink); color:#fff;
  font-size:var(--t5); display:flex; align-items:center; justify-content:center}
.entry .ok[disabled]{background:var(--hair); color:var(--faint)}
.chips{display:flex; gap:6px; padding:10px 0 2px; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button, .chips input[type=date]{flex:none; white-space:nowrap}
.chips button{border:0; border-radius:999px; padding:7px 13px;
  font-size:var(--t3); font-weight:500; color:var(--ink-2); background:var(--wash)}
.chips button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.chips button.cal{border:1px solid var(--hair); background:var(--paper); color:var(--ink-2)}
.chips button.cal.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.chips input[type=date]{border:1px solid var(--hair); border-radius:999px; padding:4px 11px;
  font-size:var(--t5); background:var(--paper); color:var(--ink-2)}

/* ─── 월 구분 ─── */
.mdiv{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:var(--s6) 2px var(--s2)}
.mdiv .mname{font-size:var(--t3); font-weight:700; letter-spacing:-.01em}
.mdiv .msum{font-size:var(--t2); font-weight:500; color:var(--muted); white-space:nowrap}
.more{width:100%; margin-top:var(--s5); padding:var(--s4); border-radius:13px;
  border:1px solid var(--hair); font-size:var(--t3); font-weight:600; color:var(--ink-2)}
.more:active{background:var(--wash)}
.empty-msg{white-space:pre-line; padding:56px 16px; text-align:center;
  color:var(--muted); font-size:var(--t4); line-height:1.8}

/* ─── 시트 ─── */
.dim{position:fixed; inset:0; background:rgba(17,19,23,.32); z-index:30}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--paper);
  border-radius:22px 22px 0 0; padding:8px 20px calc(20px + var(--sab)); z-index:31;
  box-shadow:0 -8px 40px rgba(17,19,23,.16)}
.sheet::before{content:""; display:block; width:36px; height:4px; border-radius:2px;
  background:var(--hair); margin:0 auto 14px}
.sheet h3{margin:0 0 var(--s4); font-size:var(--t3); font-weight:600; text-align:center; color:var(--muted)}
.f{display:flex; flex-direction:column; gap:12px}
.f label{font-size:var(--t2); font-weight:500; color:var(--muted); display:block; margin-bottom:6px}
.f .box{border:1px solid var(--hair); border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:8px}
.f .box:focus-within{border-color:var(--ink)}
.f .box input{flex:1; font-size:var(--t5); font-weight:500}
.f .box input.r{text-align:right; font-weight:600; letter-spacing:-.02em}
.tabs{display:flex; background:var(--wash); border-radius:12px; padding:3px}
.tabs button{flex:1; padding:10px; border-radius:9px; font-size:var(--t4); font-weight:600; color:var(--muted)}
.tabs button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(17,19,23,.1)}
.btns{display:flex; gap:8px; margin-top:6px}
.btn{flex:1; height:56px; border-radius:15px; font-size:var(--t4); font-weight:600;
  display:flex; align-items:center; justify-content:center; background:var(--wash); color:var(--ink)}
.btn.pri{background:var(--ink); color:#fff}
.btn.danger{flex:0 0 auto; padding:0 18px; color:#B43F35; background:var(--paper); box-shadow:inset 0 0 0 1px var(--hair)}
.btn.danger.arm{background:#B43F35; color:#fff; box-shadow:none}
.btn[disabled]{opacity:.4}

/* ─── 설정 ─── */
.page{touch-action:pan-y; will-change:transform}          /* 세로 스크롤은 브라우저가, 왼쪽 가장자리 가로 끌기는 우리가 */
.page.drag{box-shadow:-6px 0 22px rgba(0,0,0,.10)}
.nav{display:flex; align-items:center; gap:2px; height:46px; margin-bottom:4px}
.nav .back{width:40px; height:40px; margin-left:-11px; font-size:var(--t6); font-weight:300;
  display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--ink)}
.nav .back:active{background:var(--wash)}
.nav h2{margin:0; font-size:var(--t5); font-weight:700; letter-spacing:-.02em}
.sec-h{font-size:var(--t2); font-weight:600; color:var(--muted); letter-spacing:.04em;
  margin:var(--s6) 0 2px; text-transform:none}
.srow{display:flex; align-items:center; gap:12px; padding:15px 0;
  border-bottom:1px solid var(--hair-2); font-size:var(--t4)}
.srow .grow{flex:1; min-width:0}
.srow .val{color:var(--ink-3); font-size:var(--t3); text-align:right}
.srow input{font-size:var(--t5); font-weight:600; text-align:right; width:110px; letter-spacing:-.02em}
.srow input.nm{text-align:left; font-weight:500; width:auto; flex:1; letter-spacing:-.01em}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.f .dow{display:flex; gap:6px}
.f .dow button{flex:1; height:42px; border-radius:11px; border:1px solid var(--hair); font-size:var(--t4); font-weight:500; color:var(--ink-2)}
.f .dow button.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600}
.srow .val.off{color:var(--faint)}
.swatch{display:flex; gap:10px}
.swatch button{width:20px; height:20px; border-radius:50%; position:relative}
.swatch button.on::after{content:""; position:absolute; inset:-5px; border-radius:50%;
  border:1.5px solid var(--ink)}
.note{font-size:var(--t3); line-height:1.7; color:var(--muted); margin:var(--s3) 0 0}
.link{display:block; width:100%; text-align:left; color:var(--ink); font-size:var(--t4);
  font-weight:500; padding:15px 0; border-bottom:1px solid var(--hair-2)}
.link:active{color:var(--muted)}
.link.sm{font-size:var(--t3); color:var(--ink-2); border-bottom:0; padding:14px 0 0}
.code{font-family:ui-monospace,Menlo,monospace; font-size:var(--t5); font-weight:600; letter-spacing:.08em}
.srow .copy{flex:none; font-size:var(--t3); font-weight:600; color:var(--ink-2);
  background:var(--wash); border-radius:9px; padding:7px 12px; margin-left:var(--s3)}
.srow .copy:active{background:var(--hair)}
.srow .kmore{flex:none; width:30px; height:30px; margin-right:-6px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:var(--t4); color:var(--faint); letter-spacing:.06em}
.srow .kmore:active{background:var(--wash)}
button.srow{width:100%; text-align:left}
.srow.tap:active{background:var(--wash)}
.srow .chev{flex:none; font-size:var(--t5); color:var(--faint); line-height:1; margin-left:var(--s2)}
.ver{text-align:right; font-size:var(--t2); color:var(--faint); margin:var(--s6) 0 0}
.syncdot{width:6px; height:6px; border-radius:50%; background:var(--faint);
  display:inline-block; margin-right:8px; vertical-align:2px}
.syncdot.on{background:var(--in)}

/* ─── 시작 ─── */
.start{min-height:100dvh; display:flex; flex-direction:column;
  padding:calc(var(--sat) + 8px) 22px calc(30px + var(--sab))}
.start-top{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:20px}
.start-top .logo{width:124px; margin:0 0 var(--s3) -15px}   /* 배경 없는 돼지. 몸통이 아니라 그림 전체 기준이라 왼쪽 여백만큼 당김 */
.start-top .logo img{width:100%; height:auto; display:block}
.start-top h2{font-size:var(--t6); font-weight:700; margin:0; letter-spacing:-.03em; line-height:1.25}
.start-top p{white-space:pre-line; font-size:var(--t4); color:var(--muted); margin:var(--s3) 0 0; line-height:1.65}
.stack{display:flex; flex-direction:column; gap:9px}
.warn{background:var(--wash); border-radius:14px; padding:15px 16px; margin-bottom:16px}
.warn b{font-size:var(--t4); font-weight:600; display:block}
.warn p{margin:6px 0 0; font-size:var(--t3); line-height:1.65; color:var(--muted)}
.pair{border:1px solid var(--hair); border-radius:13px; padding:11px 14px;
  display:flex; align-items:center; gap:8px}
.pair:focus-within{border-color:var(--ink)}
.pair input{flex:1; font-size:var(--t5); font-weight:500}
.pair input.r{flex:0 0 100px; text-align:right; font-weight:600; letter-spacing:-.02em}
.pair span{font-size:var(--t3); color:var(--muted)}

.toast{position:fixed; left:50%; bottom:calc(30px + var(--sab)); transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:var(--t3);
  font-weight:500; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none;
  max-width:88vw; text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

/* ══════════════════════ 유틸 ══════════════════════ */
var APP_VERSION = "1.1.0";   // 올릴 때 sw.js 의 CACHE 도 같이

/* hex = 탭 밑줄·점(면), mid = 이름 글자(글자로 읽히게 조금 눌렀지만 색은 그대로 알아볼 수 있게).
   아이들이 "내 색"을 바로 알아보는 게 이 색의 유일한 목적이라 채도를 살린다.
   키를 지우지 말 것 — 그 색을 쓰던 아이가 파랑으로 튄다 */
var COLORS = {
  blue:   {hex:"#1E88E5", mid:"#0B6BD8"},
  green:  {hex:"#1DB954", mid:"#0F8A3C"},
  yellow: {hex:"#FFC400", mid:"#9C7000"},   // 밑줄·점은 샛노랑 그대로. 글자는 노랑을 어둡게 하면 무조건 갈색이라 여기가 한계
  apricot:{hex:"#FF7A1A", mid:"#C2510A"},
  pink:   {hex:"#FF3D8F", mid:"#D81B60"},
  purple: {hex:"#8B4FE8", mid:"#6D3BD0"}
};

var DOW = ["일","월","화","수","목","금","토"];
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }   // 로컬 날짜. toISOString 금지(UTC 밀림)
function today(){ return ymd(new Date()); }
function addDays(s, n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function dowOf(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getDay(); }
function fmt(n){ n=Math.round(n||0); var s=Math.abs(n).toLocaleString("ko-KR"); return (n<0?"−":"")+s; }
function fmtSigned(n){ return (n>0?"+":"−")+Math.abs(n).toLocaleString("ko-KR"); }
function digits(s){ return (s||"").replace(/[^\d]/g,""); }
function shortDate(s){ var t=today(); if(s===t) return "오늘"; if(s===addDays(t,-1)) return "어제"; var p=s.split("-"); var y=p[0]===t.slice(0,4)?"":p[0].slice(2)+"."; return y+(+p[1])+"."+pad(+p[2]); }
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function uid(){ return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,function(c){ return (c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16); }); }
function genCode(){ var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out=""; var r=crypto.getRandomValues(new Uint8Array(8)); for(var i=0;i<8;i++){ out+=A[r[i]%A.length]; if(i===3) out+="-"; } return out; }
var toastT; function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },1800); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ══════════════════════ 저장소: 로컬 ══════════════════════ */
function LocalStore(){
  this.kind = "local";
  this.key = "yd_local_v1";
  this.db = JSON.parse(lsGet(this.key) || "null") || {family:null, children:[], entries:[]};
}
LocalStore.prototype = {
  save: function(){ lsSet(this.key, JSON.stringify(this.db)); },
  init: function(){ return Promise.resolve(this.db.family ? {familyId:this.db.family.id, code:this.db.family.code} : null); },
  createFamily: function(code){ this.db.family={id:uid(), code:code}; this.save(); return Promise.resolve(this.db.family.id); },
  joinFamily: function(){ return Promise.reject(new Error("로컬 모드에서는 코드 참여가 안 돼요. config.js에 Supabase 정보를 넣어주세요.")); },
  gateState: function(){ return Promise.resolve({is_owner:!!this.db.family, open_until:this.db.openUntil||null}); },
  openFamilies: function(min){ this.db.openUntil = min>0 ? new Date(Date.now()+min*60000).toISOString() : null;
    this.save(); return Promise.resolve(this.db.openUntil); },
  loadAll: function(){ var d=this.db; return Promise.resolve({family:d.family, children:d.children.slice().sort(function(a,b){return a.sort-b.sort;}), entries:d.entries.slice()}); },
  upsertChild: function(c){ var i=this.db.children.findIndex(function(x){return x.id===c.id;}); if(i<0){ c.id=c.id||uid(); c.created_at=c.created_at||new Date().toISOString(); this.db.children.push(c);} else this.db.children[i]=Object.assign({},this.db.children[i],c); this.save(); return Promise.resolve(c); },
  deleteChild: function(id){ this.db.children=this.db.children.filter(function(x){return x.id!==id;}); this.db.entries=this.db.entries.filter(function(x){return x.child_id!==id;}); this.save(); return Promise.resolve(); },
  addEntry: function(e){ e.id=uid(); e.created_at=new Date().toISOString(); e.updated_at=e.created_at; this.db.entries.push(e); this.save(); return Promise.resolve(e); },
  addEntriesIgnoreDup: function(rows){ var self=this, n=0; rows.forEach(function(r){ var dup=self.db.entries.some(function(x){return x.child_id===r.child_id && x.auto_key && x.auto_key===r.auto_key;}); if(!dup){ r.id=uid(); r.created_at=new Date().toISOString(); r.updated_at=r.created_at; self.db.entries.push(r); n++; } }); this.save(); return Promise.resolve(n); },
  updateEntry: function(id, patch){ var e=this.db.entries.find(function(x){return x.id===id;}); if(e){ Object.assign(e,patch); e.updated_at=new Date().toISOString(); } this.save(); return Promise.resolve(); },
  deleteEntry: function(id){ this.db.entries=this.db.entries.filter(function(x){return x.id!==id;}); this.save(); return Promise.resolve(); },
  subscribe: function(){ }
};

/* ══════════════════════ 저장소: Supabase ══════════════════════ */
function SupaStore(cfg){
  this.kind = "supabase";
  this.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  this.familyId = null;
}
SupaStore.prototype = {
  init: function(){
    var self=this, sb=this.sb;
    return sb.auth.getSession().then(function(r){
      if(r.data.session) return r.data.session;
      return sb.auth.signInAnonymously().then(function(r2){ if(r2.error) throw r2.error; return r2.data.session; });
    }).then(function(){
      return sb.from("family_members").select("family_id, families(code)").limit(1);
    }).then(function(r){
      if(r.error) throw r.error;
      if(!r.data || !r.data.length) return null;
      self.familyId = r.data[0].family_id;
      return {familyId:self.familyId, code:(r.data[0].families||{}).code};
    });
  },
  createFamily: function(code){ var self=this; return this.sb.rpc("create_family",{p_code:code}).then(function(r){
    if(r.error) throw new Error(/duplicate|unique/i.test(r.error.message||"") ? "코드가 겹쳤어요. 한 번 더 눌러주세요." : (r.error.message||"실패"));
    self.familyId=r.data; return r.data; }); },
  joinFamily: function(code){ var self=this; return this.sb.rpc("join_family",{p_code:code}).then(function(r){ if(r.error) throw new Error("코드를 찾을 수 없어요. 다시 확인해 주세요."); self.familyId=r.data; return r.data; }); },
  gateState: function(){ return this.sb.rpc("gate_state").then(function(r){ return r.error ? {is_owner:false, open_until:null} : r.data; }); },
  openFamilies: function(min){ return this.sb.rpc("open_families",{p_minutes:min}).then(function(r){ if(r.error) throw r.error; return r.data; }); },
  // Supabase 는 한 번에 최대 1000줄만 준다. 기록은 계속 쌓이므로 나눠 받지 않으면
  // 어느 날부터 조용히 잘리고 잔액이 틀려진다. 정렬을 고정해야 페이지가 겹치거나 빠지지 않는다.
  allEntries: function(){
    var sb=this.sb, fid=this.familyId, out=[], SIZE=1000;
    function page(from){
      return sb.from("entries").select("*").eq("family_id", fid)
        .order("entry_date").order("id").range(from, from+SIZE-1)
        .then(function(r){
          if(r.error) throw r.error;
          var rows=r.data||[]; out=out.concat(rows);
          return rows.length<SIZE ? out : page(from+SIZE);
        });
    }
    return page(0);
  },
  loadAll: function(){
    var sb=this.sb, fid=this.familyId;
    return Promise.all([
      sb.from("families").select("id, code").eq("id", fid).single(),
      sb.from("children").select("*").eq("family_id", fid).order("sort"),
      this.allEntries()
    ]).then(function(rs){
      if(rs[0].error) throw rs[0].error;
      if(rs[1].error) throw rs[1].error;
      return {family:rs[0].data, children:rs[1].data||[], entries:rs[2]};
    });
  },
  upsertChild: function(c){ c.family_id=this.familyId; var q=c.id ? this.sb.from("children").update(c).eq("id",c.id).select().single() : this.sb.from("children").insert(c).select().single(); return q.then(function(r){ if(r.error) throw r.error; return r.data; }); },
  deleteChild: function(id){ return this.sb.from("children").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; }); },   // entries 는 on delete cascade
  addEntry: function(e){ e.family_id=this.familyId; return this.sb.from("entries").insert(e).select().single().then(function(r){ if(r.error) throw r.error; return r.data; }); },
  addEntriesIgnoreDup: function(rows){ var fid=this.familyId; rows.forEach(function(r){ r.family_id=fid; }); return this.sb.from("entries").upsert(rows,{onConflict:"child_id,auto_key", ignoreDuplicates:true}).select().then(function(r){ if(r.error) throw r.error; return (r.data||[]).length; }); },
  updateEntry: function(id, patch){ patch.updated_at=new Date().toISOString(); return this.sb.from("entries").update(patch).eq("id",id).then(function(r){ if(r.error) throw r.error; }); },
  deleteEntry: function(id){ return this.sb.from("entries").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; }); },
  subscribe: function(cb){
    var fid=this.familyId;
    this.sb.channel("fam-"+fid)
      .on("postgres_changes",{event:"*",schema:"public",table:"entries",filter:"family_id=eq."+fid}, cb)
      .on("postgres_changes",{event:"*",schema:"public",table:"children",filter:"family_id=eq."+fid}, cb)
      .subscribe();
  }
};

/* ══════════════════════ 상태 ══════════════════════ */
var CFG = window.APP_CONFIG || {};
var store = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) ? new SupaStore(CFG) : new LocalStore();
var S = {
  screen:"loading", family:null, children:[], entries:[],
  sel: lsGet("yd_sel") || null,
  draft:{date:today(), memo:"", amount:"", sign:-1},
  memoFocus:false, datePick:false, limit:60,
  edit:null,            // 편집 중인 entry
  editOpen:null,        // 처음 금액 고치는 중
  editKid:null,         // 아이 지우는 중
  editWeek:null,        // 매주 용돈 고치는 중
  kidView:null,         // 아이에게 보여주는 화면에 띄운 아이
  editGate:null,        // 새 가족 만들기 여닫는 중
  pickDate:null,        // 달력으로 날짜 고르는 중 {target, date, view}
  gate:null,            // {is_owner, open_until} — 설정 화면에서 한 번 물어본다

  onboard:{mode:null, names:["첫째","둘째"], opens:["",""], code:""}
};
var root = document.getElementById("app");

/* ══════════════════════ 계산 ══════════════════════ */
function childOf(id){ return S.children.find(function(c){return c.id===id;}); }
function entriesFor(cid){
  return S.entries.filter(function(e){return e.child_id===cid && !e.skipped;})
    .sort(function(a,b){ return a.entry_date<b.entry_date?-1:a.entry_date>b.entry_date?1:(a.created_at<b.created_at?-1:1); });
}
function withTotals(cid){
  var c=childOf(cid); var run=c?(c.opening_balance||0):0;
  var rows=entriesFor(cid).map(function(e){ run+=e.amount; return Object.assign({},e,{total:run}); });
  return rows.reverse();
}
function balanceOf(cid){ var c=childOf(cid); var b=c?(c.opening_balance||0):0; entriesFor(cid).forEach(function(e){ b+=e.amount; }); return b; }
function recentMemos(cid){
  var seen={}, out=[];
  withTotals(cid).forEach(function(e){ var m=(e.memo||"").trim(); if(!m||seen[m]||e.auto_key) return; seen[m]=1; out.push(m); });
  return out.slice(0,4);
}

/* ══════════════════════ 아이에게 보여주기 — 돈 그림 ══════════════════════ */
// 로고의 동전과 같은 문법: 외곽선 없음, 안쪽에 한 톤 밝은 면, 왼쪽 위 하이라이트. 지폐 크기는 실제 원화처럼 5만>1만>5천>1천
// 라벨은 "1만"이 아니라 숫자 그대로 — 아이가 "1만"의 1을 보고 500보다 작다고 읽었다. 자릿수가 많은 쪽이 큰 돈이라는 게 바로 보여야 한다
var NOTE={50000:{w:134,h:58,c:"#F6C443",i:"#FBD86A",t:"#6B4A00"}, 10000:{w:126,h:55,c:"#7CC48E",i:"#A3D8B0",t:"#1F5A31"},
          5000:{w:116,h:51,c:"#F4A072",i:"#F9BE9B",t:"#7A3612"},   1000:{w:108,h:48,c:"#86B7E8",i:"#ADCDF1",t:"#1E4A76"}};
var COIN={500:{d:56,c:"#C8CCD1",i:"#DEE1E5",t:"#3B4046"}, 100:{d:50,c:"#C8CCD1",i:"#DEE1E5",t:"#3B4046"},
          50:{d:42,c:"#C8CCD1",i:"#DEE1E5",t:"#3B4046"},   10:{d:36,c:"#D9A377",i:"#E8BD97",t:"#5C3A1B"}};
var KID_FONT="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
function noteSvg(v){ var d=NOTE[v], r=Math.round(d.h*.18), n=4;
  return '<svg width="'+d.w+'" height="'+d.h+'" viewBox="0 0 '+d.w+' '+d.h+'">'+
    '<rect x="1" y="1" width="'+(d.w-2)+'" height="'+(d.h-2)+'" rx="'+r+'" fill="'+d.c+'" stroke="#FDF6E7" stroke-width="2"/>'+
    '<rect x="'+(n+1)+'" y="'+(n+1)+'" width="'+(d.w-2*n-2)+'" height="'+(d.h-2*n-2)+'" rx="'+(r-2)+'" fill="'+d.i+'"/>'+
    '<circle cx="'+(d.h*.44)+'" cy="'+(d.h/2)+'" r="'+(d.h*.22)+'" fill="'+d.c+'"/>'+
    '<text x="'+(d.w*.62)+'" y="'+(d.h/2)+'" text-anchor="middle" dominant-baseline="central" font-family="'+KID_FONT+'" font-weight="800" font-size="'+Math.round(d.h*.36)+'" fill="'+d.t+'">'+v+'</text></svg>'; }
function coinSvg(v){ var d=COIN[v], R=d.d/2;
  return '<svg width="'+d.d+'" height="'+d.d+'" viewBox="0 0 '+d.d+' '+d.d+'">'+
    '<circle cx="'+R+'" cy="'+R+'" r="'+(R-1)+'" fill="'+d.c+'" stroke="#FDF6E7" stroke-width="2"/>'+
    '<circle cx="'+R+'" cy="'+R+'" r="'+(R-5)+'" fill="'+d.i+'"/>'+
    '<path d="M '+(R*.55)+' '+(R*.62)+' A '+(R*.62)+' '+(R*.62)+' 0 0 1 '+(R*.9)+' '+(R*.42)+'" stroke="#fff" stroke-opacity=".75" stroke-width="'+Math.max(2,R*.14)+'" stroke-linecap="round" fill="none"/>'+
    '<text x="'+R+'" y="'+(R+1)+'" text-anchor="middle" dominant-baseline="central" font-family="'+KID_FONT+'" font-weight="800" font-size="'+Math.round(R*.62)+'" fill="'+d.t+'">'+v+'</text></svg>'; }
function splitWon(n){ var out=[]; n=Math.max(0,Math.round(n||0));
  [50000,10000,5000,1000,500,100,50,10].forEach(function(v){ var c=Math.floor(n/v); if(c){ out.push([v,c]); n-=c*v; } }); return out; }
function moneyRows(n){
  var box=el("div","money");
  splitWon(n).forEach(function(p){ var v=p[0], c=p[1], isN=v>=1000, d=isN?NOTE[v]:COIN[v], w=isN?d.w:d.d, h=isN?d.h:d.d;
    var step=isN?Math.round(w*.30):w+6, show=Math.min(c,5);        // 지폐는 부채꼴로 겹치고, 동전은 나란히
    var row=el("div","row"), st=el("div","st"); st.style.width=(w+step*(show-1))+"px"; st.style.height=h+"px";
    var html=""; for(var i=0;i<show;i++) html+='<div style="position:absolute;left:'+(i*step)+'px;top:0">'+(isN?noteSvg(v):coinSvg(v))+'</div>';
    st.innerHTML=html; row.appendChild(st);
    if(c>show) row.appendChild(el("span","xn","\u00d7"+c));          // 5만원권만 여기 올 수 있다 (탐욕 분해)
    box.appendChild(row); });
  return box;
}
function renderKidView(){
  var c=childOf(S.kidView), col=COLORS[(c||{}).color]||COLORS.blue;
  var v=el("div","kid"); v.style.setProperty("--c-mid",col.mid);

  v.appendChild(el("div","kn",c?c.name:""));

  v.appendChild(moneyRows(balanceOf(S.kidView)));
  function fit(){                                       // 넘치면 한 단계씩 줄인다 (작은 폰·큰 금액)
    v.classList.remove("tight","tighter");
    if(v.scrollHeight > v.clientHeight) v.classList.add("tight");
    if(v.scrollHeight > v.clientHeight) v.classList.add("tighter");

  requestAnimationFrame(fit); pig.addEventListener("load", fit);

/* ══════════════════════ 자동 입금 ══════════════════════ */
function ensureAllowances(){
  var t=today(), rows=[];
  S.children.forEach(function(c){
    if(!c.weekly_on || c.weekly_dow==null || !(c.weekly_amount>0)) return;
    // 시작점은 "마지막 자동 줄 다음 날". weekly_start 에서 세면 오래 쓸수록 루프가 길어져
    // 안전장치(400)에 먼저 걸리고, 그때부터 최근 주가 영영 안 채워진다.
    var have={}, last="";
    S.entries.forEach(function(e){ if(e.child_id===c.id && e.auto_key){ have[e.auto_key]=1;
      if(e.entry_date>last) last=e.entry_date; } });
    var start = c.weekly_start || (c.created_at||"").slice(0,10) || t;
    var from = last && last>=start ? addDays(last,1) : start;
    var floor = addDays(t,-400);          // 아주 오래 안 열었어도 몇 년치를 한꺼번에 넣지는 않는다
    if(from < floor) from = floor;        // 대신 루프는 항상 오늘까지 도달한다 (예전엔 여기서 끊겨 최근 주가 비었다)
    var d=from, guard=0;
    while(d<=t && guard++<420){
      if(dowOf(d)===c.weekly_dow){ var k="w:"+d; if(!have[k]) rows.push({child_id:c.id, entry_date:d, memo:"용돈", amount:c.weekly_amount, auto_key:k}); }
      d=addDays(d,1);
    }
  });
  if(!rows.length) return Promise.resolve(0);
  return store.addEntriesIgnoreDup(rows);
}

/* ══════════════════════ 마지막으로 받은 내용 ══════════════════════ */
// 서버가 안 될 때 빈 화면이나 "새로 시작하기"를 보여주면 기록이 날아간 것처럼 보인다.
// 마지막으로 성공한 내용을 기기에 두고, 안 되는 동안에는 그걸 그대로 보여주면서 위에 한 줄로 알린다.
var CACHE_KEY="yd_cache_v1";
function cacheSave(d){
  if(store.kind!=="supabase") return;
  try{ lsSet(CACHE_KEY, JSON.stringify({family:d.family, children:d.children, entries:d.entries, at:Date.now()})); }catch(e){}
}
function cacheLoad(){
  try{ var c=JSON.parse(lsGet(CACHE_KEY)||"null"); return (c && c.children) ? c : null; }catch(e){ return null; }
}
function useCache(){
  var c=cacheLoad(); if(!c) return false;
  S.family=c.family; S.children=c.children; S.entries=c.entries;
  if(!S.sel || !childOf(S.sel)) S.sel = S.children.length ? S.children[0].id : null;
  S.offline=true; return true;
}

/* ══════════════════════ 데이터 로드 ══════════════════════ */
var loading=false, pendingReload=false;
function reload(again){
  if(loading){ pendingReload=true; return Promise.resolve(); }
  loading=true; var failed=null;
  return store.loadAll().then(function(d){
    S.family=d.family; S.children=d.children; S.entries=d.entries; S.offline=false;
    if(!S.sel || !childOf(S.sel)) S.sel = S.children.length ? S.children[0].id : null;
    return ensureAllowances();
  }).then(function(n){
    if(n>0) return store.loadAll().then(function(d){ S.entries=d.entries; });
  }).then(function(){ cacheSave({family:S.family, children:S.children, entries:S.entries}); })
  .catch(function(e){ console.error(e); failed=e; })
  .then(function(){
    loading=false;
    // 몇 시간 만에 열면 만료된 토큰 갱신과 첫 요청이 겹쳐 한 번 튕긴다.
    // 사용자에게 알릴 일이 아니라 다시 해보면 되는 일이라, 조용히 한 번 더 하고 그래도 안 되면 그때 알린다.
    if(failed && !again){ return new Promise(function(go){ setTimeout(go, 800); }).then(function(){ return reload(true); }); }
    if(failed){ S.offline=true; if(!S.children.length) useCache(); }   // 화면에 배너로 남는다. 토스트로 스쳐 지나가지 않게
    render(); if(pendingReload){ pendingReload=false; reload(); }
  });
}

/* ══════════════════════ 렌더 ══════════════════════ */
function render(){
  root.innerHTML="";
  if(S.screen==="loading") root.appendChild(el("div","empty-msg","불러오는 중…"));
  else if(S.screen==="fail") root.appendChild(renderFail());
  else if(S.screen==="onboard") root.appendChild(renderOnboard());
  else if(S.screen==="settings") root.appendChild(renderSettings());
  else root.appendChild(renderHome());
  if(S.edit) root.appendChild(renderEditSheet());
  if(S.editOpen) root.appendChild(renderOpenSheet());
  if(S.editKid) root.appendChild(renderKidSheet());
  if(S.editWeek) root.appendChild(renderWeekSheet());
  if(S.editGate) root.appendChild(renderGateSheet());
  if(S.pickDate) root.appendChild(renderDateSheet());
  if(S.kidView) root.appendChild(renderKidView());
}

/* ── 홈 ── */
function offlineBar(){
  var b=el("button","offbar");
  b.appendChild(el("span","d"));
  b.appendChild(el("span",null,"연결이 안 돼요. 마지막으로 받은 내용이에요"));
  b.appendChild(el("span","r","다시"));
  b.onclick=function(){ reload(); };
  return b;
}
function renderHome(){
  var wrap=el("div","screen");
  var c=childOf(S.sel), col=c?(COLORS[c.color]||COLORS.blue):COLORS.blue;
  wrap.style.setProperty("--c", col.hex);
  wrap.style.setProperty("--c-mid", col.mid);

  var bar=el("div","bar");
  if(S.children.length>1){
    S.children.forEach(function(k){
      var on=k.id===S.sel, b=el("button","k"+(on?" on":""), k.name);
      if(on) b.style.setProperty("--c",(COLORS[k.color]||COLORS.blue).hex);
      b.onclick=function(){ S.sel=k.id; lsSet("yd_sel",k.id); S.datePick=false; S.memoFocus=false; S.limit=60; render(); };
      bar.appendChild(b);
    });
  } else if(c){
    bar.appendChild(el("span","k on", c.name));
  }
  bar.appendChild(el("div","sp"));
  var gear=el("button","gear","\u2699"); gear.setAttribute("aria-label","설정");
  gear.onclick=function(){
    navOpen("settings", function(){ S.screen="settings"; });
    store.gateState().then(function(g){ S.gate=g; if(S.screen==="settings") render(); }, function(){});
  };
  bar.appendChild(gear);
  wrap.appendChild(bar);
  if(S.offline) wrap.appendChild(offlineBar());

  if(!S.sel){
    wrap.appendChild(el("div","empty-msg","설정에서 아이를 먼저 추가해 주세요."));
    return wrap;
  }

  var bal=el("div","bal");
  var bb=el("button","balbtn"); bb.setAttribute("aria-label","돼지저금통 열어보기");   // 아이에게 보여주는 화면
  bb.appendChild(el("b",null, fmt(balanceOf(c.id))));
  bb.appendChild(el("i",null,"원"));
  var pig=document.createElement("img"); pig.className="pig"; pig.src="logo-pig-sm.png"; pig.alt=""; bb.appendChild(pig);
  bb.onclick=function(){ navOpen("kidView", function(){ S.kidView=c.id; }); };
  bal.appendChild(bb); wrap.appendChild(bal);

  var head=el("div","thead");
  ["날짜","용도","금액","총액"].forEach(function(h){ head.appendChild(el("span",null,h)); });
  wrap.appendChild(head);

  wrap.appendChild(renderNewRow());

  var rows=withTotals(S.sel);
  if(!rows.length){
    wrap.appendChild(el("div","empty-msg","아직 적은 게 없어요.\n위에서 첫 줄을 적어보세요."));
    wrap.appendChild(openingRow(c));
    return wrap;
  }
  var sums={};
  rows.forEach(function(e){
    var k=e.entry_date.slice(0,7), m=sums[k]||(sums[k]={inc:0,out:0});
    if(e.amount>0) m.inc+=e.amount; else m.out-=e.amount;
  });
  var shown=rows.slice(0, S.limit), lastK=null;
  shown.forEach(function(e){
    var mk=e.entry_date.slice(0,7);
    if(mk!==lastK){ lastK=mk; wrap.appendChild(monthHead(mk, sums[mk])); }
    var r=el("button","row"+(e.auto_key?" auto":""));
    r.appendChild(el("span","d",shortDate(e.entry_date)));
    r.appendChild(el("span","m"+(e.memo?"":" empty"), e.memo||"—"));
    r.appendChild(el("span","a"+(e.amount>0?" in":""), fmtSigned(e.amount)));
    r.appendChild(el("span","t",fmt(e.total)));
    r.onclick=function(){ navOpen("edit", function(){ S.edit=Object.assign({}, e, {amountStr:String(Math.abs(e.amount)), sign:e.amount>0?1:-1, arm:false}); }); };
    wrap.appendChild(r);
  });
  if(rows.length > shown.length){
    var more=el("button","more","이전 기록 " + (rows.length - shown.length) + "줄 더 보기");
    more.onclick=function(){ S.limit += 60; render(); };
    wrap.appendChild(more);
  } else {
    wrap.appendChild(openingRow(c));   // 기록의 첫 줄이므로 맨 아래
  }
  return wrap;
}

/* 통장 맨 아래 — 시작할 때 있던 돈. 눌러서 고친다. */
function ledgerStart(c){           // 이 통장이 시작된 날 (아이 등록일과 가장 이른 기록 중 빠른 쪽)
  var d=(c.created_at||"").slice(0,10) || today();
  entriesFor(c.id).forEach(function(e){ if(e.entry_date < d) d=e.entry_date; });
  return d;
}
function openingRow(c){
  var r=el("button","row open");
  r.appendChild(el("span","d",shortDate(ledgerStart(c))));
  r.appendChild(el("span","m","처음 금액"));
  r.appendChild(el("span","a",""));
  r.appendChild(el("span","t",fmt(c.opening_balance||0)));
  r.onclick=function(){ navOpen("editOpen", function(){ S.editOpen={id:c.id, amountStr:String(c.opening_balance||0)}; }); };
  return r;
}

function monthHead(key, sum){
  var p=key.split("-"), thisYear=today().slice(0,4);
  var d=el("div","mdiv");
  d.appendChild(el("span","mname", (p[0]===thisYear ? "" : p[0]+"년 ") + (+p[1]) + "월"));
  var parts=[];
  if(sum.inc) parts.push("받은 돈 " + sum.inc.toLocaleString("ko-KR"));
  if(sum.out) parts.push("쓴 돈 " + sum.out.toLocaleString("ko-KR"));
  d.appendChild(el("span","msum", parts.join("   ")));
  return d;
}

function renderNewRow(){
  var d=S.draft, frag=document.createDocumentFragment();
  var row=el("div","entry");

  var dbtn=el("button","dbtn",shortDate(d.date));
  dbtn.onclick=function(){ S.datePick=!S.datePick; S.memoFocus=false; render(); };
  row.appendChild(dbtn);

  var memo=el("input","memo"); memo.type="text"; memo.placeholder="용도"; memo.value=d.memo;
  memo.autocomplete="off"; memo.enterKeyHint="next";
  memo.oninput=function(){ d.memo=memo.value; updateOk(); };
  memo.onfocus=function(){ if(!S.memoFocus){ S.memoFocus=true; S.datePick=false; redrawChips(); } };
  memo.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); amt.focus(); } };
  row.appendChild(memo);

  var acell=el("div","acell");
  var sign=el("button","sign"+(d.sign>0?" plus":""), d.sign>0?"+":"\u2212");
  sign.setAttribute("aria-label", d.sign>0?"받은 돈":"쓴 돈");
  sign.onclick=function(){
    d.sign=-d.sign;
    sign.textContent=d.sign>0?"+":"\u2212";
    sign.className="sign"+(d.sign>0?" plus":"");
    sign.setAttribute("aria-label", d.sign>0?"받은 돈":"쓴 돈");
  };
  acell.appendChild(sign);
  var amt=el("input","amt"); amt.type="text"; amt.inputMode="numeric"; amt.placeholder="0";
  amt.value=d.amount?Number(d.amount).toLocaleString("ko-KR"):""; amt.enterKeyHint="done";
  amt.oninput=function(){ var v=digits(amt.value); d.amount=v; amt.value=v?Number(v).toLocaleString("ko-KR"):""; updateOk(); };
  amt.onfocus=function(){ if(S.memoFocus||S.datePick){ S.memoFocus=false; S.datePick=false; redrawChips(); } };
  amt.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); submitNew(); } };
  acell.appendChild(amt); row.appendChild(acell);

  var ok=el("button","ok","\u2713"); ok.setAttribute("aria-label","저장"); ok.onclick=submitNew;
  row.appendChild(ok);
  function updateOk(){ ok.disabled = !(Number(d.amount)>0); }
  updateOk();
  frag.appendChild(row);

  var slot=el("div"); slot.id="chips"; frag.appendChild(slot);
  fillChips(slot);
  return frag;

  function redrawChips(){ var n=document.getElementById("chips"); if(n){ n.innerHTML=""; fillChips(n); } }
  function fillChips(slot){
    if(S.datePick){
      var box=el("div","chips dates"), t=today();
      [["오늘",t],["어제",addDays(t,-1)],["그저께",addDays(t,-2)]].forEach(function(pair){
        var b=el("button",null,pair[0]); if(d.date===pair[1]) b.className="on";
        b.onclick=function(){ d.date=pair[1]; S.datePick=false; render(); };
        box.appendChild(b);
      });
      var near = d.date===t || d.date===addDays(t,-1) || d.date===addDays(t,-2);
      var more=el("button", near?"cal":"cal on", near ? "달력" : shortDate(d.date));
      more.onclick=function(){ openDatePick("draft", d.date); };
      box.appendChild(more); slot.appendChild(box);
    } else if(S.memoFocus){
      var ms=recentMemos(S.sel); if(!ms.length) return;
      var box2=el("div","chips");
      ms.forEach(function(m){
        var b=el("button",null,m);
        b.onmousedown=function(ev){ ev.preventDefault(); };
        b.onclick=function(){ d.memo=m; memo.value=m; amt.focus(); };
        box2.appendChild(b);
      });
      slot.appendChild(box2);
    }
  }
}

function submitNew(){
  var d=S.draft, n=Number(d.amount);
  if(!(n>0)) return;
  var e={child_id:S.sel, entry_date:d.date, memo:d.memo.trim(), amount:d.sign*n, auto_key:null};
  // 낙관적 반영
  var tmp=Object.assign({id:"tmp-"+Date.now(), created_at:new Date().toISOString()}, e);
  S.entries.push(tmp);
  S.draft={date:today(), memo:"", amount:"", sign:-1}; S.memoFocus=false; S.datePick=false;
  if(document.activeElement) document.activeElement.blur();
  render();
  store.addEntry(e).then(function(saved){
    var i=S.entries.indexOf(tmp); if(i>=0) S.entries[i]=saved; render();
  }).catch(function(err){ S.entries=S.entries.filter(function(x){return x!==tmp;}); render(); toast("저장 실패: "+(err.message||err)); });
}

/* ── 편집 시트 ── */
function renderEditSheet(){
  var e=S.edit, frag=document.createDocumentFragment();
  var dim=el("div","dim"); dim.onclick=navBack; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,e.auto_key?"자동 용돈 고치기":"고치기"));
  var f=el("div","f");

  var seg=el("div","tabs");
  [["받은 돈",1],["쓴 돈",-1]].forEach(function(p){ var b=el("button",null,p[0]); if(e.sign===p[1]) b.className="on"; b.onclick=function(){ e.sign=p[1]; render(); }; seg.appendChild(b); });
  f.appendChild(seg);

  var g1=el("div"); g1.appendChild(el("label",null,"금액"));
  var b1=el("div","box"); var ai=document.createElement("input"); ai.className="r"; ai.inputMode="numeric"; ai.value=Number(e.amountStr||0).toLocaleString("ko-KR");
  ai.oninput=function(){ e.amountStr=digits(ai.value); ai.value=e.amountStr?Number(e.amountStr).toLocaleString("ko-KR"):""; };
  b1.appendChild(ai); b1.appendChild(el("span",null,"원")); g1.appendChild(b1); f.appendChild(g1);

  var g2=el("div"); g2.appendChild(el("label",null,"용도"));
  var b2=el("div","box"); var mi=document.createElement("input"); mi.type="text"; mi.value=e.memo||""; mi.oninput=function(){ e.memo=mi.value; }; b2.appendChild(mi); g2.appendChild(b2); f.appendChild(g2);

  var g3=el("div"); g3.appendChild(el("label",null,"날짜"));
  var b3=el("button","box tapbox"); b3.appendChild(el("span","grow", shortDate(e.entry_date)));
  b3.appendChild(el("span","chev","\u203A"));
  b3.onclick=function(){ openDatePick("edit", e.entry_date); };
  g3.appendChild(b3); f.appendChild(g3);

  var btns=el("div","btns");
  var isAuto=!!e.auto_key;
  var del=el("button","btn danger"+(e.arm?" arm":""), e.arm?(isAuto?"정말 건너뛰기":"정말 삭제"):(isAuto?"이번 주 건너뛰기":"삭제"));
  del.onclick=function(){
    if(!e.arm){ e.arm=true; render(); return; }
    var id=e.id; navBack();
    if(isAuto){
      // 자동 줄은 지우면 다시 생기므로, 남겨두고 숨긴다
      var t=S.entries.find(function(x){return x.id===id;}); if(t) t.skipped=true; render();
      store.updateEntry(id,{skipped:true}).catch(function(err){ toast("실패: "+(err.message||err)); reload(); });
    } else {
      S.entries=S.entries.filter(function(x){return x.id!==id;}); render();
      store.deleteEntry(id).catch(function(err){ toast("삭제 실패: "+(err.message||err)); reload(); });
    }
  };
  var cancel=el("button","btn","취소"); cancel.onclick=navBack;
  var save=el("button","btn pri","저장"); save.onclick=function(){
    var n=Number(e.amountStr); if(!(n>0)){ toast("금액을 넣어주세요"); return; }
    var patch={entry_date:e.entry_date, memo:(e.memo||"").trim(), amount:e.sign*n};
    var id=e.id; navBack();
    var t=S.entries.find(function(x){return x.id===id;}); if(t) Object.assign(t,patch);
    render();
    store.updateEntry(id,patch).catch(function(err){ toast("저장 실패: "+(err.message||err)); reload(); });
  };
  btns.appendChild(del); btns.appendChild(cancel); btns.appendChild(save); f.appendChild(btns);
  sh.appendChild(f); frag.appendChild(sh);
  return frag;
}

/* ── 날짜 고르기 ──────────────────────────────────────
   기기 기본 달력(input type=date)은 OS 것이라 이 앱만 혼자 톤이 튄다.
   고르는 날이 거의 최근 며칠이라 화려할 필요도 없어서 같은 문법으로 직접 그린다. */
function openDatePick(target, date){
  navOpen("pickDate", function(){ S.pickDate={target:target, date:date, view:date.slice(0,7)}; });
}
function renderDateSheet(){
  var st=S.pickDate, t=today(), frag=document.createDocumentFragment();
  var dim=el("div","dim"); dim.onclick=navBack; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,"날짜"));
  var f=el("div","f");

  var y=+st.view.slice(0,4), m=+st.view.slice(5,7);
  var head=el("div","calh");
  var prev=el("button","navb","\u2039"); prev.setAttribute("aria-label","이전 달");
  prev.onclick=function(){ st.view = (m===1) ? (y-1)+"-12" : y+"-"+pad(m-1); render(); };
  var title=el("span","t", y+"년 "+m+"월");
  var next=el("button","navb","\u203A"); next.setAttribute("aria-label","다음 달");
  next.disabled = st.view >= t.slice(0,7);
  next.onclick=function(){ st.view = (m===12) ? (y+1)+"-01" : y+"-"+pad(m+1); render(); };
  head.appendChild(prev); head.appendChild(title); head.appendChild(next); f.appendChild(head);

  var wd=el("div","calw"); DOW.forEach(function(n){ wd.appendChild(el("span",null,n)); }); f.appendChild(wd);

  var grid=el("div","calg");
  var first=new Date(y, m-1, 1), days=new Date(y, m, 0).getDate();
  for(var i=0;i<first.getDay();i++) grid.appendChild(el("div","pad"));
  for(var dd=1; dd<=days; dd++){
    (function(dd){
      var iso=y+"-"+pad(m)+"-"+pad(dd);
      var b=el("button",null,String(dd));
      if(iso===st.date) b.className="on"; else if(iso===t) b.className="today";
      b.disabled = iso>t;                                  // 아직 오지 않은 날은 적을 일이 없다
      b.onclick=function(){ applyDate(st.target, iso); navBack(); };
      grid.appendChild(b);
    })(dd);
  }
  f.appendChild(grid);

  var btns=el("div","btns");
  var today_=el("button","btn","오늘"); today_.onclick=function(){ applyDate(st.target, t); navBack(); };
  var cancel=el("button","btn","닫기"); cancel.onclick=navBack;
  btns.appendChild(today_); btns.appendChild(cancel); f.appendChild(btns);
  sh.appendChild(f); frag.appendChild(sh);
  return frag;
}
function applyDate(target, iso){
  if(target==="edit" && S.edit) S.edit.entry_date=iso;
  else { S.draft.date=iso; S.datePick=false; }
}

/* ── 새 가족 만들기 시트 ── */
function gateLeft(){   // 남은 분. 잠겨 있으면 0
  var u=S.gate && S.gate.open_until; if(!u) return 0;
  return Math.max(0, Math.ceil((new Date(u) - new Date())/60000));
}
function renderGateSheet(){
  var frag=document.createDocumentFragment();
  var dim=el("div","dim"); dim.onclick=navBack; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,"새 가족 만들기"));
  var f=el("div","f"), left=gateLeft();
  f.appendChild(el("p","note", left
    ? "지금 열려 있어요. "+left+"분 뒤에 저절로 잠겨요."
    : "잠겨 있어요. 열어두는 동안에만 다른 사람이 새 가족을 만들 수 있어요."));
  var btns=el("div","btns");                       // 상태마다 할 일은 하나뿐. 세 개를 늘어놓으면 글자가 잘린다
  var cancel=el("button","btn","닫기"); cancel.onclick=navBack; btns.appendChild(cancel);
  var act=el("button","btn pri", left ? "지금 잠그기" : "10분 동안 열기");
  act.onclick=function(){ setGate(left ? 0 : 10); };
  btns.appendChild(act); f.appendChild(btns);
  sh.appendChild(f); frag.appendChild(sh);
  return frag;
  function setGate(min){
    store.openFamilies(min).then(function(t){
      S.gate.open_until=t; navBack(); toast(min>0?"10분 동안 열었어요":"잠갔어요");
    }, function(err){ toast("실패: "+(err.message||err)); });
  }
}

/* ── 매주 용돈 시트 ── */
function renderWeekSheet(){
  var w=S.editWeek, c=childOf(w.id), frag=document.createDocumentFragment();
  var close=navBack;
  var dim=el("div","dim"); dim.onclick=close; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,(c?c.name:"")+" · 매주 용돈"));
  var f=el("div","f");
  var seg=el("div","tabs");
  [["안 함",false],["매주",true]].forEach(function(p){ var b=el("button",w.on===p[1]?"on":"",p[0]); b.onclick=function(){ w.on=p[1]; render(); }; seg.appendChild(b); });
  f.appendChild(seg);
  if(w.on){
    var g1=el("div"); g1.appendChild(el("label",null,"요일"));
    var dow=el("div","dow");
    DOW.forEach(function(nm,i){ var b=el("button",i===w.dow?"on":"",nm); b.onclick=function(){ w.dow=i; render(); }; dow.appendChild(b); });
    g1.appendChild(dow); f.appendChild(g1);
    var g2=el("div"); g2.appendChild(el("label",null,"금액"));
    var bx=el("div","box"); var ai=document.createElement("input"); ai.className="r"; ai.inputMode="numeric"; ai.placeholder="0";
    ai.value=w.amountStr?Number(w.amountStr).toLocaleString("ko-KR"):"";
    ai.oninput=function(){ w.amountStr=digits(ai.value); ai.value=w.amountStr?Number(w.amountStr).toLocaleString("ko-KR"):""; };
    bx.appendChild(ai); bx.appendChild(el("span",null,"원")); g2.appendChild(bx); f.appendChild(g2);
  }
  var btns=el("div","btns");
  var cancel=el("button","btn","취소"); cancel.onclick=close;
  var save=el("button","btn pri","저장"); save.onclick=function(){
    var v=Number(w.amountStr)||0;
    if(w.on && !(v>0)){ toast("금액을 넣어주세요"); return; }
    var patch={id:w.id, weekly_on:w.on, weekly_dow:w.dow, weekly_amount:v};
    if(w.on && (!c.weekly_on || c.weekly_dow!==w.dow)) patch.weekly_start=today();   // 켜거나 요일을 바꾸면 오늘부터
    Object.assign(c, patch); navBack();
    store.upsertChild(patch).then(reload).catch(function(err){ toast("저장 실패: "+(err.message||err)); reload(); });
  };
  btns.appendChild(cancel); btns.appendChild(save); f.appendChild(btns);
  sh.appendChild(f); frag.appendChild(sh);
  return frag;
}

/* ── 아이 지우기 시트 ── */
function renderKidSheet(){
  var k=S.editKid, c=childOf(k.id);
  if(!c) return document.createDocumentFragment();   // 지워진 직후 한 프레임. 닫는 건 navCloseTop 이 한다
  var frag=document.createDocumentFragment();
  var dim=el("div","dim"); dim.onclick=navBack; frag.appendChild(dim);
  var sh=el("div","sheet"); sh.appendChild(el("h3",null,c.name));
  var f=el("div","f");
  var n=entriesFor(c.id).length;
  f.appendChild(el("p","note", n ? "적어둔 기록 "+n+"줄도 함께 지워져요." : "적어둔 기록은 없어요."));
  var btns=el("div","btns");
  var del=el("button","btn danger"+(k.arm?" arm":""), k.arm?"정말 지우기":"지우기");
  del.onclick=function(){
    if(!k.arm){ k.arm=true; render(); return; }
    var id=c.id; navBack();
    S.children=S.children.filter(function(x){return x.id!==id;});
    S.entries=S.entries.filter(function(e){return e.child_id!==id;});

/* ── 뒤로 가기 ──────────────────────────────────────
   안드로이드 뒤로 가기 버튼·제스처가 앱을 끄지 않고 화면을 닫게 한다.
   화면을 열 때 방문 기록을 하나 쌓고(navOpen), 닫는 건 전부 navBack() → popstate 한 곳에서 처리한다.
   iOS 홈 화면 앱은 뒤로 가기가 없어서 스와이프(edgeSwipe)가 대신한다. */
var navStack = [];                       // 열려 있는 화면들. 방문 기록 한 칸 = 이 배열 한 칸
function navOpen(key, open){ open(); navStack.push(key); try{ history.pushState({d:navStack.length}, ""); }catch(e){} render(); }
function navBack(){ if(navStack.length) history.back(); }   // 닫는 건 popstate 한 곳에서
function navCloseTop(){
  var k=navStack.pop(); if(!k) return;
  if(k==="settings") S.screen="home"; else S[k]=null;       // 자기가 연 것만 닫는다
}
window.addEventListener("popstate", function(){ navCloseTop(); render(); });

/* ── 왼쪽 가장자리 스와이프로 뒤로 (홈화면 앱엔 사파리 제스처가 없어서 직접) ── */
function edgeSwipe(node, onBack){
  var x0=0, y0=0, dx=0, t0=0, on=false, go=false;
  node.addEventListener("touchstart", function(e){
    var t=e.touches[0]; on = e.touches.length===1 && t.clientX<=32;
    if(!on) return;
    x0=t.clientX; y0=t.clientY; dx=0; go=false; t0=e.timeStamp; node.style.transition="none";
  }, {passive:true});
  node.addEventListener("touchmove", function(e){
    if(!on) return;
    var t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!go){
      if(Math.abs(mx)<8 && Math.abs(my)<8) return;                  // 아직 방향 모름
      if(Math.abs(my)>Math.abs(mx)){ on=false; return; }             // 세로면 스크롤에 양보
      go=true; node.classList.add("drag");
    }
    e.preventDefault();
    dx=Math.max(0,mx); node.style.transform="translateX("+dx+"px)";
  }, {passive:false});
  function end(e){
    if(!on) return; on=false;
    if(!go) return;
    var fast = dx>60 && (dx/(e.timeStamp-t0))>0.45;                 // 짧게 튕겨도 나가짐
    node.style.transition="transform .2s ease-out";
    if(fast || dx>node.clientWidth*0.35){ node.style.transform="translateX(100%)"; setTimeout(onBack,170); }
    else { node.style.transform=""; node.classList.remove("drag"); }
  }
  node.addEventListener("touchend", end); node.addEventListener("touchcancel", end);
}

  S.children.forEach(function(c){
    var r=el("button","srow tap"); r.appendChild(el("span","grow",c.name));
    var on=c.weekly_on && c.weekly_dow!=null && c.weekly_amount>0;
    var v=el("span","val", on ? DOW[c.weekly_dow]+"요일 · "+fmt(c.weekly_amount)+"원" : "안 함"); if(!on) v.classList.add("off");
    r.appendChild(v); r.appendChild(el("span","chev","\u203A"));
    r.onclick=function(){ navOpen("editWeek", function(){ S.editWeek={id:c.id, on:!!c.weekly_on, dow:c.weekly_dow==null?6:c.weekly_dow, amountStr:String(c.weekly_amount||"")}; }); };
    wCard.appendChild(r);

function exportCSV(){
  var lines=["아이,날짜,용도,금액,총액"];
  S.children.forEach(function(c){
    withTotals(c.id).reverse().forEach(function(e){ lines.push([c.name,e.entry_date,'"'+(e.memo||"").replace(/"/g,'""')+'"',e.amount,e.total].join(",")); });
  });
  var text=lines.join("\n");
  if(navigator.share){ navigator.share({title:"용돈기입장 기록",text:text}).catch(function(){}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(text)
      .then(function(){ toast("복사했어요"); }, function(){ showText(text); }); return; }
  showText(text);
  function showText(t){    // 공유도 복사도 안 되는 환경 — 그래도 빈손으로 끝나지 않게
    var w=window.open("","_blank");
    if(w){ w.document.write("<pre style='font:14px/1.6 monospace;white-space:pre-wrap;padding:16px'></pre>");
           w.document.querySelector("pre").textContent=t; }
    else toast("내보내기를 지원하지 않는 환경이에요");
  }
}

/* ── 첫 시작 ── */
function renderOnboard(){
  var o=S.onboard, wrap=el("div","start");
  var top=el("div","start-top");
  var logo=el("div","logo"); var img=document.createElement("img");
  img.src="logo-pig-t.png"; img.alt=""; logo.appendChild(img); top.appendChild(logo);
  top.appendChild(el("h2",null,"용돈기입장"));
  var body=el("div","start-body");
  if(!o.mode){
    var isIOS=/iPhone|iPad/.test(navigator.userAgent);
    if(isIOS && !window.navigator.standalone){
      var w=el("div","warn");
      w.appendChild(el("b",null,"먼저 홈 화면에 추가해 주세요."));
      w.appendChild(el("p",null,"아래 공유 버튼에서 홈 화면에 추가를 누르고, 그 아이콘으로 열어서 시작해 주세요. 사파리에서 바로 시작하면 기록이 따로 놀아요."));
      body.appendChild(w);
    }
    var st=el("div","stack");
    var b1=el("button","btn pri","새로 시작하기"); b1.onclick=function(){ o.mode="new"; render(); }; st.appendChild(b1);
    if(store.kind==="supabase"){
      var b2=el("button","btn","가족 코드로 참여"); b2.onclick=function(){ o.mode="join"; render(); }; st.appendChild(b2);
    }
    body.appendChild(st);
    wrap.appendChild(top); wrap.appendChild(body); return wrap;
  }

  if(o.mode==="join"){
    top.appendChild(el("p",null,"다른 폰 설정에 있는 코드를 넣어주세요."));
    var f=el("div","f");
    var bx=el("div","box");
    var ci=document.createElement("input"); ci.type="text"; ci.placeholder="ABCD-1234";
    ci.autocapitalize="characters"; ci.autocomplete="off"; ci.value=o.code;
    ci.style.textAlign="center"; ci.style.fontSize="21px"; ci.style.fontWeight="700"; ci.style.letterSpacing=".09em";
    ci.oninput=function(){ o.code=ci.value.toUpperCase(); };
    bx.appendChild(ci); f.appendChild(bx);
    var btns=el("div","btns");
    var back=el("button","btn","뒤로"); back.onclick=function(){ o.mode=null; render(); };
    var go=el("button","btn pri","참여");
    go.onclick=function(){
      var code=o.code.trim().replace(/[^A-Z0-9]/g,"");
      if(code.length!==8){ toast("코드 8자리를 확인해 주세요"); return; }
      code=code.slice(0,4)+"-"+code.slice(4);
      go.disabled=true;
      store.joinFamily(code).then(function(){ S.screen="home"; return reload(); })
        .catch(function(err){ go.disabled=false; toast(err.message||String(err)); });
    };
    btns.appendChild(back); btns.appendChild(go); f.appendChild(btns);
    body.appendChild(f);
    wrap.appendChild(top); wrap.appendChild(body); return wrap;
  }

  top.appendChild(el("p",null,"이름이랑 지금 가진 돈만 적으면 돼요."));
  var f2=el("div","f");
  o.names.forEach(function(nm,i){
    var r=el("div","pair");
    var ni=document.createElement("input"); ni.type="text"; ni.value=nm; ni.placeholder="이름";
    ni.oninput=function(){ o.names[i]=ni.value; }; r.appendChild(ni);
    var ai=document.createElement("input"); ai.className="r"; ai.inputMode="numeric";
    ai.placeholder="0"; ai.value=o.opens[i];
    ai.oninput=function(){ var v=digits(ai.value); o.opens[i]=v; ai.value=v?Number(v).toLocaleString("ko-KR"):""; };
    r.appendChild(ai); r.appendChild(el("span",null,"원"));
    f2.appendChild(r);
  });
  var tools=el("div"); tools.style.display="flex"; tools.style.gap="14px";
  if(o.names.length<4){
    var addk=el("button","link sm","＋ 아이 추가");
    addk.onclick=function(){ o.names.push(["첫째","둘째","셋째","넷째"][o.names.length]); o.opens.push(""); render(); };
    tools.appendChild(addk);
  }
  if(o.names.length>1){
    var rm=el("button","link sm","－ 마지막 아이 빼기");
    rm.onclick=function(){ o.names.pop(); o.opens.pop(); render(); };
    tools.appendChild(rm);
  }
  f2.appendChild(tools);
  var btns2=el("div","btns");
  var back2=el("button","btn","뒤로"); back2.onclick=function(){ o.mode=null; render(); };
  var go2=el("button","btn pri","시작");
  go2.onclick=function(){
    var names=o.names.map(function(x){ return x.trim(); });
    if(names.some(function(x){ return !x; })){ toast("이름을 넣어주세요"); return; }
    go2.disabled=true;
    var code=genCode(), keys=Object.keys(COLORS);
    store.createFamily(code).then(function(){
      return names.reduce(function(pr,nm,i){
        return pr.then(function(){
          return store.upsertChild({name:nm, color:keys[i%keys.length], sort:i,
            opening_balance:Number(o.opens[i])||0, weekly_on:false, weekly_amount:0});
        });
      }, Promise.resolve());
    }).then(function(){ S.screen="home"; return reload(); })
      .catch(function(err){ go2.disabled=false; toast("시작 실패: "+(err.message||err)); });
  };
  btns2.appendChild(back2); btns2.appendChild(go2); f2.appendChild(btns2);
  body.appendChild(f2);
  wrap.appendChild(top); wrap.appendChild(body); return wrap;
}

/* ══════════════════════ 부팅 ══════════════════════ */
function boot(){
 return store.init().then(function(fam){
  // init 이 null 을 준 것과 실패한 것은 완전히 다른 일이다.
  // null = 이 기기는 아직 어느 가족에도 안 들어갔다 → 시작 화면.
  // 실패 = 서버에 못 물어봤다 → 시작 화면을 보여주면 "기록이 없어졌다"로 읽힌다.
  if(!fam){ S.screen="onboard"; render(); return; }
  S.screen="home";
  store.subscribe(function(){ clearTimeout(window.__rt); window.__rt=setTimeout(reload, 300); });
  return reload();
 }).catch(function(e){
  console.error(e);
  if(useCache()){ S.screen="home"; render(); return; }        // 쓰던 기기 — 마지막 화면 + 배너
  S.screen="fail"; render();                                   // 처음 보는 기기 — 물어볼 수가 없으니 솔직하게
 });
}
render(); boot();

document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && S.screen==="home") reload(); });
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();

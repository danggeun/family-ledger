<style>
:root{
  --paper:#FDFCFA;
  --wash:#F3F1EC;
  --ink:#111317;
  --ink-2:#3E434B;
  --ink-3:#5D6067;
  --muted:#767C86;
  --faint:#9AA0A9;
  --hair:#E8E5DE;
  --hair-2:#F1EFE9;
  --in:#1B7A5A;          /* 받은 돈 */
  --on-ink:#fff; --card:#FFFFFF;   /* 검은 버튼 위 글자 · 입력줄 흰 바탕 */
  --danger:#B43F35;      /* 삭제·지우기 */
  --warn:#C79A2E;        /* 연결 안 됨 띠의 점 */
  --c:#2F6FA8;           /* 아이 색 기본값. 실제 값은 COLORS 에서 요소마다 */
  /* 아이 화면 크림 판. --kid-bg = JS 의 KID_BG */
  --kid-bg:#FDF6E7; --kid-ink:#2B1D14; --kid-muted:#8C7B66; --kid-faint:#B9AB96;
  /* 타입 램프 7단계 */
  --t1:11px;  /* 뱃지 */
  --t2:12px;  /* 캡션·라벨·날짜 */
  --t3:13px;  /* 보조 텍스트 */
  --t4:15px;  /* 본문 */
  --t5:17px;  /* 강조·입력·제목 */
  --t5b:22px; /* 아이 이름. 램프의 유일한 예외 */
  --t6:28px;  /* 큰 제목 */
  --t7:44px;  /* 잔액 */
  /* 4px 간격 격자 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* 한국어는 어절 단위로 줄바꿈 */
html,body{margin:0; background:var(--paper); color:var(--ink); word-break:keep-all; overflow-wrap:break-word;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:var(--t4); line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;}
button,input{font:inherit; color:inherit}
button{appearance:none; border:0; background:none; padding:0; cursor:pointer}
input{border:0; background:none; outline:none; min-width:0}
[hidden]{display:none!important}
.screen{min-height:100dvh; padding:calc(var(--sat) + 6px) 20px calc(48px + var(--sab))}

/* ─── 상단: 아이 탭 + 설정 ─── */
.bar{display:flex; align-items:center; gap:var(--s4); height:54px}
.bar .k{position:relative; padding:8px 0; font-size:var(--t5b); font-weight:600; color:var(--faint);
  letter-spacing:-.02em; transition:color .15s}
.bar .k.on{color:var(--c-name)}
.bar .k.on::after{content:""; position:absolute; left:0; right:0; bottom:4px; height:4px;
  border-radius:2px; background:var(--c)}
.bar .sp{flex:1}
.bar .gear{width:38px; height:38px; margin-right:-9px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:var(--t5); color:var(--muted)}
.bar .gear:active{background:var(--wash)}

/* ─── 달력 ─── */
.calh{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px}
.calh .t{font-size:var(--t4); font-weight:700}
.calh .navb{width:38px; height:38px; border-radius:50%; font-size:var(--t5); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center}
.calh .navb:disabled{opacity:.25}
.calh .navb:active:not(:disabled){background:var(--wash)}
.calw{display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
  font-size:var(--t2); color:var(--muted); padding-bottom:2px}
.calg{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.calg button, .calg .pad{height:44px}
.calg button{border-radius:13px; font-size:var(--t4); color:var(--ink)}
.calg button:disabled{color:var(--faint); opacity:.4}
.calg button.today{font-weight:700; box-shadow:inset 0 0 0 1px var(--hair)}
.calg button.on{background:var(--ink); color:var(--on-ink); font-weight:700}
.calg button:active:not(.on):not(:disabled){background:var(--wash)}

/* ─── 연결 안 됨 알림 ─── */
.offbar{display:flex; align-items:center; gap:var(--s2); width:100%; text-align:left;
  background:var(--wash); border-radius:12px; padding:11px 12px; margin:var(--s2) 0 0;
  font-size:var(--t3); color:var(--ink-2)}
.offbar .d{width:7px; height:7px; border-radius:50%; background:var(--warn); flex:none}
.offbar .r{margin-left:auto; font-weight:600; color:var(--ink)}
.offbar:active{background:var(--hair)}

/* ─── 잔액 ─── */
.balbtn{display:flex; align-items:baseline; gap:5px; margin-left:-6px; padding:0 8px 0 6px; border-radius:12px}
.balbtn:active{background:var(--wash)}
.balbtn .pig{align-self:center; width:31px; height:28px; margin-left:8px; object-fit:contain}

/* ─── 불러오는 중 ─── */
.load{opacity:0; animation:showlate .45s ease-out .35s forwards}
@keyframes showlate{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
@media (prefers-reduced-motion: reduce){ .load{animation-duration:.01s} }

/* ─── 아이에게 보여주기 ─── */
/* 숫자를 꾹 눌러도 iOS 글자 선택이 안 뜨게 */
.kid{position:fixed; inset:0; z-index:60; background:var(--kid-bg); color:var(--kid-ink); overflow:auto; touch-action:pan-y;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  display:flex; flex-direction:column; align-items:center; padding:calc(var(--sat) + 64px) 24px calc(32px + var(--sab))}
.kid .x{position:absolute; top:calc(var(--sat) + 10px); right:14px; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:var(--t6); font-weight:300; color:var(--kid-faint)}
.kid .pig{width:222px; height:auto; aspect-ratio:600/569; flex:none}   /* 비율을 미리 잡아 그림이 늦게 떠도 배치가 안 흔들리게 */
.kid .kn{font-size:var(--t5b); font-weight:700; color:var(--c-name); margin-top:10px; letter-spacing:-.02em}
.kid .ka{display:flex; align-items:baseline; gap:5px; margin-top:8px}
.kid .ka b{font-size:var(--t7); font-weight:800; letter-spacing:-.04em; line-height:1.05}
.kid .ka i{font-style:normal; font-size:var(--t5); font-weight:600; color:var(--kid-muted)}
.kid .ka b.in{color:var(--in)}
/* 바뀌는 부분만 움직인다(화면 전체를 움직이면 뒤의 홈 목록이 비친다) */
/* 아이 바꾸기 전환: 복사본(.ghost)이 먼저 나가고(0.07초) 새 화면이 들어온다(0.11초) */
/* 들어오는 쪽은 처음부터 투명. 사파리는 지연 애니메이션 전에 최종 상태를 한 프레임 먼저 그린다 */
.kid.slide-l .kn,.kid.slide-l .ka,.kid.slide-l .money,.kid.slide-r .kn,.kid.slide-r .ka,.kid.slide-r .money,
.screen.slide-l > :not(.bar),.screen.slide-r > :not(.bar){
  opacity:0; will-change:transform,opacity; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.kid.slide-l .kn,.kid.slide-l .ka,.kid.slide-l .money{animation:kin-l .11s ease-out .07s both}
.kid.slide-r .kn,.kid.slide-r .ka,.kid.slide-r .money{animation:kin-r .11s ease-out .07s both}
.kid.ghost{pointer-events:none; background:transparent}
/* 복사본의 돼지 · ✕ 는 가리지 않는다(가리면 iOS 에서 돼지가 깜빡인다) */
.kid.ghost .kn,.kid.ghost .ka,.kid.ghost .money,.screen.ghost > :not(.bar){
  will-change:transform,opacity; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.kid.ghost.gout-l .kn,.kid.ghost.gout-l .ka,.kid.ghost.gout-l .money{animation:kout-l .07s ease-in both}
.kid.ghost.gout-r .kn,.kid.ghost.gout-r .ka,.kid.ghost.gout-r .money{animation:kout-r .07s ease-in both}
@keyframes kin-l{from{opacity:0; transform:translateX(22px)} to{opacity:1; transform:none}}
@keyframes kin-r{from{opacity:0; transform:translateX(-22px)} to{opacity:1; transform:none}}
@keyframes kout-l{from{opacity:1; transform:none} to{opacity:0; transform:translateX(-22px)}}
@keyframes kout-r{from{opacity:1; transform:none} to{opacity:0; transform:translateX(22px)}}
.screen.home{touch-action:pan-y}
.screen.slide-l > :not(.bar){animation:kin-l .11s ease-out .07s both}
.screen.slide-r > :not(.bar){animation:kin-r .11s ease-out .07s both}
.screen.ghost{position:absolute; left:0; right:0; top:0; z-index:5; pointer-events:none}   /* 옛 화면과 같은 자리 */
.screen.ghost > .bar{visibility:hidden}                                                   /* 탭 줄은 밑의 새것이 바로 보인다 */
.screen.ghost.gout-l > :not(.bar){animation:kout-l .07s ease-in both}
.screen.ghost.gout-r > :not(.bar){animation:kout-r .07s ease-in both}
/* 움직임 줄이기: 위 규칙과 선택자가 같아야 특이도에서 이긴다 */
@media (prefers-reduced-motion: reduce){
  .kid.slide-l .kn,.kid.slide-l .ka,.kid.slide-l .money,.kid.slide-r .kn,.kid.slide-r .ka,.kid.slide-r .money,
  .screen.slide-l > :not(.bar),.screen.slide-r > :not(.bar){animation:none; opacity:1; will-change:auto}
  .ghost{display:none} }
.kid.one{justify-content:center; padding-top:calc(var(--sat) + 24px)}   /* 돼지가 없는 한 줄 그림은 가운데로 */
.money{display:flex; flex-direction:column; gap:var(--s4); align-items:flex-start; margin-top:var(--s5)}
.kid.tight .pig{width:150px}      /* 넘치면 돼지를 줄인다 */
.kid.tight .money{gap:var(--s3); margin-top:var(--s4)}
.kid.tighter .pig{width:104px}
.kid.tighter .money{gap:var(--s2)}
/* 돈 그림 한 줄도 .row 라 목록 줄 규칙을 같이 받는다. 이름을 바꾸면 간격 · 누름 표시가 달라진다 */
.money .row{display:flex; align-items:center; padding:0; border:0; background:none}
.money .st{position:relative}
.money .st svg{position:absolute; left:0; top:0; display:block}
.money .xn{margin-left:var(--s3); display:inline-flex; align-items:center; gap:3px; white-space:nowrap}
.money .xn b{font-size:var(--t6); font-weight:800; letter-spacing:-.03em; line-height:1}
.money .xn i{font-style:normal; font-size:var(--t5); font-weight:700; line-height:1}
.bal{display:flex; align-items:baseline; gap:5px; padding:var(--s4) 0 var(--s5)}
.bal b{font-size:var(--t7); font-weight:700; letter-spacing:-.04em; line-height:1; color:var(--ink)}
.bal i{font-style:normal; font-size:var(--t5); font-weight:600; color:var(--muted)}

/* ─── 표 ─── */
/* 칸 폭은 em: 폰 글자 크기를 키우면 같이 늘어난다 */
.thead,.row{display:grid; grid-template-columns:2.9333em 1fr 5.7333em 5.2em; gap:8px; align-items:center}
.thead{padding:0 2px var(--s3); border-bottom:1px solid var(--hair);
  font-size:var(--t2); font-weight:600; color:var(--muted); letter-spacing:.01em}
.thead span:nth-child(n+3){text-align:right}
.row{padding:14px 2px; border-bottom:1px solid var(--hair-2); width:100%; text-align:left;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}   /* 길게 눌러도 글자 선택·메뉴가 안 뜨게 */
.row .d{font-size:var(--t2); font-weight:500; color:var(--ink-3)}
.row .m{font-size:var(--t4); font-weight:500; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .m.empty{color:var(--faint)}
.row .a{text-align:right; font-size:var(--t4); font-weight:600; letter-spacing:-.02em; white-space:nowrap}
.row .a.in{color:var(--in)}
.row .t{text-align:right; font-size:var(--t3); font-weight:600; color:var(--ink-3);
  letter-spacing:-.015em; white-space:nowrap}
.row.auto .m::after{content:"자동"; font-size:var(--t1); font-weight:600; color:var(--muted);
  border:1px solid var(--hair); border-radius:4px; padding:1px 4px; margin-left:6px; vertical-align:2px}
.row:active{background:var(--wash)}
.row.open .m{color:var(--muted)}
.row.open .t{color:var(--muted); font-weight:500}

/* ─── 입력 줄 (통장 맨 윗줄) ─── */
.entry{display:grid; grid-template-columns:2.9333em 1fr 6.8667em 2.4em; gap:8px; align-items:center;   /* = 44 · 103 · 36px (부호 30px 기준) */
  background:var(--card); border-radius:14px; padding:10px 11px; margin:12px -11px 4px;
  box-shadow:0 1px 2px rgba(40,34,24,.05), 0 8px 20px -14px rgba(40,34,24,.28)}
.entry .dbtn{font-size:var(--t2); font-weight:600; line-height:1.15; color:var(--ink-2);
  background:var(--wash); border-radius:9px; padding:8px 2px; text-align:center}
.entry .dbtn:active{background:var(--hair-2)}
.entry input.memo{font-size:var(--t5); font-weight:500; padding:7px 2px; letter-spacing:-.01em}
.entry input.memo::placeholder{color:var(--faint); font-weight:400}
.entry .acell{display:flex; align-items:center; gap:6px; justify-content:flex-end}
.entry .sign{width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--on-ink);
  font-size:var(--t5); line-height:1; display:flex; align-items:center; justify-content:center; flex:none}
.entry .sign.plus{background:var(--in)}
.entry input.amt{font-size:var(--t5); font-weight:600; text-align:right; width:100%;
  padding:7px 0; letter-spacing:-.02em}
.entry input.amt::placeholder{color:var(--faint); font-weight:400}
.entry input.amt.in{color:var(--in)}
.entry .ok{width:36px; height:36px; border-radius:11px; background:var(--ink); color:var(--on-ink);
  font-size:var(--t5); display:flex; align-items:center; justify-content:center}
.entry .ok[disabled]{background:var(--hair); color:var(--faint)}
.chips{display:flex; gap:6px; padding:10px 0 2px; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button, .chips input[type=date]{flex:none; white-space:nowrap}
.chips button{border:0; border-radius:999px; padding:7px 13px;
  font-size:var(--t3); font-weight:500; color:var(--ink-2); background:var(--wash)}
.chips button.on{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.chips button.cal{border:1px solid var(--hair); background:var(--paper); color:var(--ink-2)}
.chips button.cal.on{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.chips input[type=date]{border:1px solid var(--hair); border-radius:999px; padding:4px 11px;
  font-size:var(--t5); background:var(--paper); color:var(--ink-2)}

/* ─── 월 구분 ─── */
.mdiv{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:var(--s6) 2px var(--s2)}
.mdiv .mname{font-size:var(--t3); font-weight:700; letter-spacing:-.01em}
.mdiv .msum{font-size:var(--t2); font-weight:500; color:var(--muted); white-space:nowrap}
.more{width:100%; margin-top:var(--s5); padding:var(--s4); border-radius:13px;
  border:1px solid var(--hair); font-size:var(--t3); font-weight:600; color:var(--ink-2)}
.more:active{background:var(--wash)}
.empty-msg{white-space:pre-line; padding:56px 16px; text-align:center;
  color:var(--muted); font-size:var(--t4); line-height:1.8}

/* ─── 시트 ─── */
.dim{position:fixed; inset:0; background:rgba(17,19,23,.32); z-index:30}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--paper);
  border-radius:22px 22px 0 0; padding:8px 20px calc(20px + var(--sab)); z-index:31;
  box-shadow:0 -8px 40px rgba(17,19,23,.16);
  max-height:100dvh; overflow:auto; overscroll-behavior:contain}   /* 키보드로 화면이 줄면 시트 안에서 스크롤 */
.sheet::before{content:""; display:block; width:36px; height:4px; border-radius:2px;
  background:var(--hair); margin:0 auto 14px}
.sheet h3{margin:0 0 var(--s4); font-size:var(--t3); font-weight:600; text-align:center; color:var(--muted)}
.f{display:flex; flex-direction:column; gap:12px}
.f label{font-size:var(--t2); font-weight:500; color:var(--muted); display:block; margin-bottom:6px}
.skiplist{max-height:144px; overflow:auto; overscroll-behavior:contain}   /* 41px × 3.5줄. 반 줄이 걸쳐 보여 더 있음을 알린다 */
.skiprow{display:flex; justify-content:space-between; align-items:center; width:100%; padding:9px 0;
  font-size:var(--t4); color:var(--ink-2); border-bottom:1px solid var(--hair)}
.skiprow:last-child{border-bottom:0}
.skiprow b{font-size:var(--t3); font-weight:600; color:var(--ink-3)}
.skiprow:active b{color:var(--ink)}
.f .box{border:1px solid var(--hair); border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:8px}
.f .box:focus-within{border-color:var(--ink)}
.f .box input{flex:1; font-size:var(--t5); font-weight:500}
.f .box input.r{text-align:right; font-weight:600; letter-spacing:-.02em}
.f .box input.r.in{color:var(--in)}
.f .box input.code-in{text-align:center; font-size:21px; font-weight:700; letter-spacing:.09em}

.f .box.tapbox .grow{flex:1}
.f .box.tapbox .chev{color:var(--faint); font-size:var(--t5); line-height:1}
.tabs{display:flex; background:var(--wash); border-radius:12px; padding:3px}
.tabs button{flex:1; padding:10px; border-radius:9px; font-size:var(--t4); font-weight:600; color:var(--muted)}
.tabs button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(17,19,23,.1)}
.tabs.in button.on{color:var(--in)}
.btns{display:flex; gap:8px; margin-top:6px}
.btn{flex:1; height:56px; border-radius:15px; font-size:var(--t4); font-weight:600;
  display:flex; align-items:center; justify-content:center; background:var(--wash); color:var(--ink)}
.btn.pri{background:var(--ink); color:var(--on-ink)}
.btn.danger{flex:0 0 auto; padding:0 18px; color:var(--danger); background:var(--paper); box-shadow:inset 0 0 0 1px var(--hair)}
.btn.danger.arm{background:var(--danger); color:var(--on-ink); box-shadow:none}
.btn[disabled]{opacity:.4}

/* ─── 설정 ─── */
.screen.page{padding-bottom:calc(32px + var(--sab))}   /* 설정 맨 아래 묶음의 위아래 틈을 32px 로 맞춘다 */
.page{touch-action:pan-y; will-change:transform}          /* 세로 스크롤은 브라우저, 왼쪽 가장자리 가로 끌기는 앱 */
.page.drag{box-shadow:-6px 0 22px rgba(0,0,0,.10)}
.nav{display:flex; align-items:center; gap:2px; height:46px; margin-bottom:4px}
.nav .back{width:40px; height:40px; margin-left:-11px; font-size:var(--t6); font-weight:300;
  display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--ink)}
.nav .back:active{background:var(--wash)}
.nav h2{margin:0; font-size:var(--t5); font-weight:700; letter-spacing:-.02em}
.sec-h{font-size:var(--t2); font-weight:600; color:var(--muted); letter-spacing:.04em;
  margin:var(--s6) 0 2px}
.srow{display:flex; align-items:center; gap:12px; padding:15px 0;
  border-bottom:1px solid var(--hair-2); font-size:var(--t4)}
.srow .grow{flex:1; min-width:0}
.srow .val{color:var(--ink-3); font-size:var(--t3); text-align:right}
.srow input{font-size:var(--t5); font-weight:600; text-align:right; width:110px; letter-spacing:-.02em}
.srow input.nm{text-align:left; font-weight:500; width:auto; flex:1; letter-spacing:-.01em}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.f .dow{display:flex; gap:6px}
.f .dow button{flex:1; height:42px; border-radius:11px; border:1px solid var(--hair); font-size:var(--t4); font-weight:500; color:var(--ink-2)}
.f .dow button.on{background:var(--ink); color:var(--on-ink); border-color:var(--ink); font-weight:600}
.srow .val.off{color:var(--faint)}
.swatch{display:flex; gap:10px}
.swatch button{width:20px; height:20px; border-radius:50%; position:relative}
.swatch button.on::after{content:""; position:absolute; inset:-5px; border-radius:50%;
  border:1.5px solid var(--ink)}
.note{font-size:var(--t3); line-height:1.7; color:var(--muted); margin:var(--s3) 0 0}
.link{display:block; width:100%; text-align:left; color:var(--ink); font-size:var(--t4);
  font-weight:500; padding:15px 0; border-bottom:1px solid var(--hair-2)}
.link:active{color:var(--muted)}
.link.sm{font-size:var(--t3); color:var(--ink-2); border-bottom:0; padding:14px 0 0}
.code{font-family:ui-monospace,Menlo,monospace; font-size:var(--t5); font-weight:600; letter-spacing:.08em}
.srow .val.code{font-size:var(--t3); font-weight:500; color:var(--ink-3)}
.srow .val.code.ok{font-family:inherit; letter-spacing:0}
.srow .kmore{flex:none; width:30px; height:30px; margin-right:-6px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:var(--t4); color:var(--faint); letter-spacing:.06em}
.srow .kmore:active{background:var(--wash)}
button.srow{width:100%; text-align:left}
.srow.tap:active{background:var(--wash)}
.srow .chev{flex:none; font-size:var(--t5); color:var(--faint); line-height:1; margin-left:var(--s2)}
.foot{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4); margin:var(--s6) 0 0}
.ver{text-align:center; font-size:var(--t2); color:var(--faint); margin:var(--s4) 0 0}
.foot .addk,.foot .fb{font-size:var(--t2); color:var(--faint); padding:0}
.foot .fb.new{color:var(--ink-2); font-weight:600}
.foot .addk:active,.foot .fb:active{color:var(--ink-2)}
.f textarea{border:1px solid var(--hair); border-radius:12px; padding:12px 14px; min-height:132px; resize:none; outline:none;
  font:inherit; font-size:var(--t4); line-height:1.55; color:var(--ink); background:none}
.f textarea:focus{border-color:var(--ink)}
.f .linkbtn{align-self:flex-start; font-size:var(--t2); color:var(--faint); padding:2px 0}
.fbsent{margin-top:6px}
.fbsent .fbrow{display:flex; align-items:baseline; gap:12px; padding:8px 0; border-top:1px solid var(--hair)}
.fbsent .b{flex:1; min-width:0; font-size:var(--t3); color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fbsent .s{flex:none; font-size:var(--t2); color:var(--faint)}

.fblist{max-height:56dvh; overflow:auto; overscroll-behavior:contain}

.fbitem .m{font-size:var(--t2); color:var(--faint)}
.fbitem .done{flex:none; font-size:var(--t2); font-weight:600; color:var(--ink-3); padding:2px 0 2px 8px}
.fbitem .done.arm{color:var(--danger)}
.fbitem .b{margin-top:3px; font-size:var(--t4); color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere}
.fbitem.err .b{font-size:var(--t3); color:var(--muted)}
.fbitem .d{margin-top:3px; font-size:var(--t1); color:var(--faint)}

/* ─── 처음 안내: 레이어는 root 밖에 하나, 자리만 옮긴다 ─── */
.tour{position:fixed; inset:0; z-index:70; opacity:0; transition:opacity .25s; pointer-events:none}   /* 구멍을 위해 상자는 터치를 안 받는다 */
.tour.in{opacity:1}
.tour-block,.tour-sample,.tour-card{pointer-events:auto}
.tour.hide,.tour.out,.tour.hide *,.tour.out *{opacity:0; pointer-events:none}
.tour-spot{position:fixed; pointer-events:none; border-radius:14px; box-shadow:0 0 0 200vmax rgba(17,19,23,.56);   /* 그림자가 곧 어두운 막 */
  transition:top .4s cubic-bezier(.2,.8,.2,1), left .4s cubic-bezier(.2,.8,.2,1),
    width .4s cubic-bezier(.2,.8,.2,1), height .4s cubic-bezier(.2,.8,.2,1), border-radius .4s}
.tour-block{position:fixed; touch-action:none}                 /* 구멍 밖 네 장(누르지 못하게) */
.tour-pulse{position:fixed; width:0; height:0; pointer-events:none; transition:top .4s cubic-bezier(.2,.8,.2,1), left .4s cubic-bezier(.2,.8,.2,1)}
.tour-pulse i{position:absolute; left:-24px; top:-24px; width:48px; height:48px; border-radius:50%; border:2px solid var(--on-ink); opacity:0;
  animation:tpulse 2s cubic-bezier(.2,.6,.4,1) infinite}
.tour-pulse i:nth-child(2){animation-delay:.7s}
.tour-pulse.off i{animation:none}
@keyframes tpulse{0%{transform:scale(.45); opacity:.9} 100%{transform:scale(2); opacity:0}}
.tour-sample{position:fixed; left:20px; right:20px; background:var(--paper); border-radius:12px; padding:0 10px; display:none}
.tour-sample.on{display:block}
.tour-sample .row{border-bottom:0}
.row.sample .m::after{content:"예시"; font-size:var(--t1); font-weight:600; color:var(--muted);
  border:1px solid var(--hair); border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:1px}
.tour-card{position:fixed; left:20px; right:20px; background:var(--paper); color:var(--ink); border-radius:18px; padding:18px 18px 14px;
  box-shadow:0 18px 44px -12px rgba(0,0,0,.45); transition:top .4s cubic-bezier(.2,.8,.2,1)}
.tour-card.up .tc-caret{top:auto; bottom:-6px}
.tour-card.hint{pointer-events:none; padding:14px 18px} .tour-card.hint .tc-foot,.tour-card.hint .skip{display:none}
.tour-card.hint .tc-title{font-size:var(--t4); font-weight:600; padding-right:0; text-align:center}
.tour-card.hint .tc-body{margin-top:2px; text-align:center}
.tour-card .tc-caret{position:absolute; top:-6px; width:12px; height:12px; background:var(--paper); border-radius:2px; transform:rotate(45deg);
  transition:left .4s cubic-bezier(.2,.8,.2,1), opacity .2s}
.tour-card .tc-title{font-size:var(--t5); font-weight:700; letter-spacing:-.02em; line-height:1.3; padding-right:34px}
.tour-card .tc-body{margin:6px 0 0; font-size:var(--t3); line-height:1.55; color:var(--ink-3)}
.tour-card .tc-text.swap{animation:tcin .32s ease-out}
@keyframes tcin{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
.tc-chev{display:inline-flex; gap:1px; margin-left:8px; vertical-align:-1px}
.tc-chev i{font-style:normal; font-weight:400; color:var(--faint); animation:tchev 1.3s ease-in-out infinite}
.tc-chev i:nth-child(2){animation-delay:.16s} .tc-chev i:nth-child(3){animation-delay:.32s}
@keyframes tchev{0%,100%{opacity:.25} 45%{opacity:1}}
.tour-card .tc-foot{display:flex; align-items:center; justify-content:space-between; margin-top:14px; min-height:30px}
.tour-card .dots{display:flex; gap:6px}
.tour-card .dots i{width:6px; height:6px; border-radius:50%; background:var(--hair); transition:background .3s}
.tour-card .dots i.on{background:var(--ink)}
.tour-card .skip{position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
  font-size:20px; line-height:1; color:var(--muted)}
.tour-card .skip:active{background:var(--wash); color:var(--ink)}
/* 첫 카드에만 × 위 말풍선 */
.tour-card .skip-hint{position:absolute; top:-30px; right:10px; background:var(--ink); color:var(--on-ink); font-size:var(--t2); font-weight:600;
  padding:5px 9px; border-radius:8px; white-space:nowrap; pointer-events:none; animation:thint .4s cubic-bezier(.2,.8,.2,1) .5s both}
.tour-card .skip-hint::after{content:""; position:absolute; right:10px; bottom:-4px; width:8px; height:8px;
  background:var(--ink); transform:rotate(45deg); border-radius:1px}
@keyframes thint{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.tour-card .ok{background:var(--ink); color:var(--on-ink); border-radius:11px; padding:9px 18px; font-size:var(--t3); font-weight:600}
.tour-card .ok.soft{background:var(--wash); color:var(--ink-3)}        /* 해 볼 단계의 "다음"은 연하게 */
.tour-card .prev{font-size:var(--t3); font-weight:600; color:var(--muted); padding:9px 10px; margin-right:2px}
.tour-card .prev:active{color:var(--ink)}
.tour-card .tc-foot .btns{display:flex; align-items:center}
.tour-card.done{text-align:center; padding-top:22px}
.tour-card.done .tc-title{padding-right:0}
.tour-card.done .tc-pig{width:64px; height:64px; display:block; margin:0 auto 10px; animation:tpig .5s cubic-bezier(.2,.8,.2,1) both}
.tour-card.done .tc-foot{margin-top:16px}
.tour-card.done .dots{display:none}
.tour-card.done .tc-foot .btns{flex:1}
.tour-card.done .ok{flex:1; padding:12px 18px; font-size:var(--t4); border-radius:13px}
@keyframes tpig{from{transform:scale(.6) rotate(-8deg); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){
  .tour-spot,.tour-card,.tour-pulse,.tour-card .tc-caret{transition:none}
  .tour-pulse i,.tc-chev i,.tour-card .tc-text.swap{animation:none} }
.syncdot{width:6px; height:6px; border-radius:50%; background:var(--faint);
  display:inline-block; margin-right:8px; vertical-align:2px}
.syncdot.on{background:var(--in)}

/* ─── 시작 ─── */
.start-tools{display:flex; gap:14px}
.start{min-height:100dvh; display:flex; flex-direction:column;
  padding:calc(var(--sat) + 8px) 22px calc(30px + var(--sab))}
.start-top{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:20px}
.start-top .logo{width:124px; margin:0 0 var(--s3) -15px}   /* 그림 전체 기준이라 왼쪽 여백만큼 당긴다 */
.start-top .logo img{width:100%; height:auto; display:block}
.start-top h2{font-size:var(--t6); font-weight:700; margin:0; letter-spacing:-.03em; line-height:1.25}
.start-top p{white-space:pre-line; font-size:var(--t4); color:var(--muted); margin:var(--s3) 0 0; line-height:1.65}
.stack{display:flex; flex-direction:column; gap:9px}
.stack .btn{flex:none}   /* .btn{flex:1} 은 세로 묶음에서 높이를 무너뜨린다 */
.warn{background:var(--wash); border-radius:14px; padding:15px 16px; margin-bottom:16px}
.warn b{font-size:var(--t4); font-weight:600; display:block}
.warn p{margin:6px 0 0; font-size:var(--t3); line-height:1.65; color:var(--muted)}
.pair{border:1px solid var(--hair); border-radius:13px; padding:11px 14px;
  display:flex; align-items:center; gap:8px}
.pair:focus-within{border-color:var(--ink)}
.pair input{flex:1; font-size:var(--t5); font-weight:500}
.pair input.r{flex:0 0 100px; text-align:right; font-weight:600; letter-spacing:-.02em}
.pair span{font-size:var(--t3); color:var(--muted)}

.toast{position:fixed; left:50%; bottom:calc(30px + var(--sab)); transform:translateX(-50%);
  background:var(--ink); color:var(--on-ink); padding:12px 18px; border-radius:12px; font-size:var(--t3);
  font-weight:500; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none;
  max-width:88vw; text-align:center}
.toast.show{opacity:1}
</style>

<script src="config.js"></script>
<script>
(function(){
"use strict";

/* 용돈기입장. 한 파일, 빌드 없음. 차례:
   유틸 → 저장소 → 상태 S → 계산 → 돈 그림 → 자동 입금 → 캐시 → 처음 안내 → 데이터 로드 → 렌더 → 시트 → 의견 → 뒤로 가기 → 설정 → 시작 화면 → 부팅
   규칙: S 만 보고 전부 다시 그린다 · 적는 중 · 전환 중엔 안 그린다(S.renderLater) · 저장은 낙관 반영 + 실패 시 직전 값 되돌리기(tryStore)
   코드 지도: docs/ARCHITECTURE.md */
/* ══════════════════════ 유틸 ══════════════════════ */
var APP_VERSION = "1.3.9";   // 올릴 때 sw.js 의 CACHE 도 같이

/* hex = 탭 밑줄 · 점, name = 이름 글자(큰 글자 대비 3.0 이상). 키를 지우면 그 색을 쓰던 아이가 파랑이 된다 */
var COLORS = {
  blue:   {hex:"#1E88E5", name:"#1E88E5"},
  green:  {hex:"#1DB954", name:"#1AA94D"},
  yellow: {hex:"#FFC400", name:"#B78D00"},
  apricot:{hex:"#FF7A1A", name:"#F56700"},
  pink:   {hex:"#FF3D8F", name:"#FF3D8F"},
  purple: {hex:"#8B4FE8", name:"#8B4FE8"}
};

var DOW = ["일","월","화","수","목","금","토"];
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);   // 아이패드는 데스크톱 UA 를 쓴다
// 설정 톱니. 1.75px 선, currentColor
var GEAR_SVG='<svg class="gear-i" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<circle cx="12" cy="12" r="3.2"/>'+
  '<path d="M10.2 4.6 L10.6 1.9 L13.4 1.9 L13.8 4.6 L15.9 5.5 L18.1 3.9 L20.1 5.9 L18.5 8.1 L19.4 10.2 L22.1 10.6 L22.1 13.4 L19.4 13.8 L18.5 15.9 L20.1 18.1 L18.1 20.1 L15.9 18.5 L13.8 19.4 L13.4 22.1 L10.6 22.1 L10.2 19.4 L8.1 18.5 L5.9 20.1 L3.9 18.1 L5.5 15.9 L4.6 13.8 L1.9 13.4 L1.9 10.6 L4.6 10.2 L5.5 8.1 L3.9 5.9 L5.9 3.9 L8.1 5.5z"/></svg>';
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }   // 로컬 날짜. toISOString 금지(UTC 밀림)
function today(){ return ymd(new Date()); }
function addDays(s, n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function dowOf(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getDay(); }
/* 아이 등록일. created_at 은 UTC 라 잘라 쓰면 하루 밀린다 */
function localDay(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d) ? String(iso).slice(0,10) : ymd(d); }
function fmt(n){ n=Math.round(n||0); var s=Math.abs(n).toLocaleString("ko-KR"); return (n<0?"−":"")+s; }
function fmtSigned(n){ return (n>0?"+":"−")+Math.abs(n).toLocaleString("ko-KR"); }
function digits(s){ return (s||"").replace(/[^\d]/g,""); }
function plainDate(s){ var t=today(), p=s.split("-");   // 달력 칩용. 오늘/어제로 바꾸지 않는다
  return (p[0]===t.slice(0,4) ? "" : p[0].slice(2)+".") + (+p[1]) + "." + pad(+p[2]); }
/* 목록 · 입력줄 날짜는 해를 뺀다(해는 월 머리가 보여 준다). 넣으면 44px 칸에서 두 줄로 꺾인다 */
function listDate(s){
  var t=today(), p=s.split("-");
  if(s===t) return "오늘";
  if(s===addDays(t,-1)) return "어제";
  return (+p[1]) + "." + pad(+p[2]);
}
function shortDate(s){                                  // 고치기 시트용: 오늘 · 어제 · "10.03" · 작년이면 "25.10.03"
  var t=today();
  if(s===t) return "오늘";
  if(s===addDays(t,-1)) return "어제";
  return plainDate(s);
}
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
// 로컬 모드 id. randomUUID 는 https 에서만 있다
function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  var b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;     // 버전 4 · 변형 10xx
  var h=Array.prototype.map.call(b, function(x){ return (x+256).toString(16).slice(1); }).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
function genCode(){                                     // 가족 코드 ABCD-1234 — 헷갈리는 I·O·0·1 은 뺀다
  var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out="", r=crypto.getRandomValues(new Uint8Array(8));
  for(var i=0;i<8;i++){ out+=A[r[i]%A.length]; if(i===3) out+="-"; }
  return out;
}
function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(S.ui.toastTimer); S.ui.toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ /* 꽉 찼거나 막힌 저장소 — 못 남겨도 화면은 그대로 */ } }

/* ══════════════════════ 저장소 ══════════════════════
   LocalStore(이 기기)와 SupaStore(가족 동기화)는 같은 Promise 인터페이스. 앱은 store.kind 로만 구분한다 */

function LocalStore(){
  this.kind = "local";
  this.userId = "me";
  this.familyId = null;
  this.key = "yd_local_v1";
  var raw=null;
  try{ raw=JSON.parse(lsGet(this.key) || "null"); }catch(e){}   // 깨진 저장은 빈 것으로(던지면 "불러오는 중"에 멈춘다)
  this.db = (raw && raw.children) ? raw : {family:null, children:[], entries:[]};
}
/* 받은 객체는 바꾸지 않고 복사본을 돌려준다. 그래야 로컬 모드가 서버 모드와 똑같이 돈다 */
function copyOf(x){ return JSON.parse(JSON.stringify(x)); }
LocalStore.prototype = {
  save: function(){ lsSet(this.key, JSON.stringify(this.db)); },
  init: function(){
    var f=this.db.family;
    if(f) this.familyId=f.id;
    return Promise.resolve(f ? {familyId:f.id, code:f.code} : null);
  },
  createFamily: function(code){
    this.db.family={id:uid(), code:code}; this.familyId=this.db.family.id; this.save();
    return Promise.resolve(this.db.family.id);
  },
  joinFamily: function(){
    return Promise.reject(new Error("이 기기 전용 모드라 코드 참여가 안 돼요."));
  },
  gateState: function(){ return Promise.resolve({is_owner:!!this.db.family, open_until:this.db.openUntil||null}); },
  openFamilies: function(min){
    this.db.openUntil = min>0 ? new Date(Date.now()+min*60000).toISOString() : null;
    this.save();
    return Promise.resolve(this.db.openUntil);
  },
  loadAll: function(){
    var d=this.db;
    var children=d.children.slice().sort(function(a,b){ return (a.sort-b.sort) || cmp(a.created_at, b.created_at) || cmp(a.id, b.id); });
    return Promise.resolve(copyOf({family:d.family, children:children, entries:d.entries}));
  },
  upsertChild: function(c){
    var kids=this.db.children, i=kids.findIndex(function(x){ return x.id===c.id; }), row;
    if(i<0){ row=Object.assign({id:uid(), created_at:new Date().toISOString()}, copyOf(c)); kids.push(row); }
    else row=kids[i]=Object.assign({}, kids[i], copyOf(c));
    this.save();
    return Promise.resolve(copyOf(row));
  },
  deleteChild: function(id){
    this.db.children=this.db.children.filter(function(x){ return x.id!==id; });
    this.db.entries=this.db.entries.filter(function(x){ return x.child_id!==id; });
    this.save();
    return Promise.resolve();
  },
  addEntry: function(e){
    var now=new Date().toISOString(), row=Object.assign(copyOf(e), {id:uid(), created_by:"me", updated_by:"me", created_at:now, updated_at:now});
    this.db.entries.push(row); this.save();
    return Promise.resolve(copyOf(row));
  },
  addEntriesIgnoreDup: function(rows){
    var db=this.db, n=0;
    rows.forEach(function(r){
      var dup=db.entries.some(function(x){ return x.child_id===r.child_id && x.auto_key && x.auto_key===r.auto_key; });
      if(dup) return;
      var now=new Date().toISOString();
      db.entries.push(Object.assign(copyOf(r), {id:uid(), created_at:now, updated_at:now})); n++;
    });
    this.save();
    return Promise.resolve(n);
  },
  updateEntry: function(id, patch){
    var e=this.db.entries.find(function(x){ return x.id===id; });
    if(!e) return Promise.reject(new Error(GONE_MSG));
    Object.assign(e, patch); e.updated_by="me"; e.updated_at=new Date().toISOString();
    this.save();
    return Promise.resolve();
  },
  deleteEntry: function(id){
    this.db.entries=this.db.entries.filter(function(x){ return x.id!==id; });
    this.save();
    return Promise.resolve();
  },
  subscribe: function(){ }
};

function SupaStore(cfg){
  this.kind = "supabase";
  this.userId = null;
  this.sb = window.supabase.createClient(normalizeUrl(cfg.SUPABASE_URL), cfg.SUPABASE_ANON_KEY);
  this.familyId = null;
  this.subscribed = false;
  this.chan = null;
  /* 토큰 갱신 실패로 세션이 지워지면 familyId 를 비워 다음 reload 가 init → 캐시의 코드로 재참여하게 한다 */
  var self=this;
  try{
    this.sb.auth.onAuthStateChange(function(ev){
      if(ev!=="SIGNED_OUT") return;
      self.familyId=null; self.userId=null; self.subscribed=false;
      if(self.chan){ try{ self.sb.removeChannel(self.chan); }catch(e){ /* 이미 끊긴 채널 */ } self.chan=null; }
    });
  }catch(e){ /* 옛 supabase-js — 이 복구만 없다 */ }
}
function normalizeUrl(u){ return String(u||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""); }   // 끝 슬래시·/rest/v1 은 떼어낸다
var GONE_MSG="다른 폰에서 지운 기록이에요";
// supabase-js 응답 {data, error} → data 또는 throw
function unwrap(r){ if(r.error) throw r.error; return r.data; }
SupaStore.prototype = {
  init: function(){
    var self=this, sb=this.sb;
    return sb.auth.getSession().then(function(r){
      if(r.data.session) return r.data.session;
      return sb.auth.signInAnonymously().then(function(r2){ if(r2.error) throw r2.error; return r2.data.session; });
    }).then(function(ses){
      self.userId = ses && ses.user ? ses.user.id : null;
      return sb.from("family_members").select("family_id, families(code)").limit(1);
    }).then(function(r){
      var rows=unwrap(r);
      if(!rows || !rows.length) return null;
      self.familyId = rows[0].family_id;
      return {familyId:self.familyId, code:(rows[0].families||{}).code};
    });
  },
  createFamily: function(code){
    var self=this;
    return this.sb.rpc("create_family",{p_code:code}).then(function(r){
      if(r.error) throw new Error(/duplicate|unique/i.test(r.error.message||"") ? "코드가 겹쳤어요. 한 번 더 눌러주세요." : (r.error.message||"실패"));
      self.familyId=r.data; return r.data;
    });
  },
  joinFamily: function(code){
    var self=this;
    return this.sb.rpc("join_family",{p_code:code}).then(function(r){
      if(r.error){                                           // 연결 문제를 "코드 없음"으로 말하지 않게
        var m=String(r.error.message||"");
        throw new Error(/no such|not found|없/i.test(m) ? "코드를 찾을 수 없어요. 다시 확인해 주세요." : "연결이 안 돼요. 잠시 뒤 다시 해 주세요.");
      }
      self.familyId=r.data; return r.data;
    });
  },
  gateState: function(){
    return this.sb.rpc("gate_state").then(function(r){ return r.error ? {is_owner:false, open_until:null} : r.data; });
  },
  openFamilies: function(min){ return this.sb.rpc("open_families",{p_minutes:min}).then(unwrap); },
  sendFeedback: function(kind, body){
    return this.sb.rpc("send_feedback",{p_kind:kind, p_body:body, p_version:APP_VERSION, p_device:deviceName()}).then(unwrap);
  },
  readFeedback: function(){ return this.sb.rpc("read_feedback").then(unwrap); },
  claimFeedback: function(){ return this.sb.rpc("claim_feedback_reader").then(unwrap); },
  closeFeedback: function(id){ return this.sb.rpc("close_feedback",{p_id:id}).then(unwrap); },
  markFeedbackRead: function(upto){ return this.sb.rpc("mark_feedback_read",{p_upto:upto}).then(unwrap); },
  myFeedback: function(){ return this.sb.rpc("my_feedback").then(unwrap); },
  /* Supabase 는 한 번에 1000줄까지. "이 id 다음부터"(키셋)로 나눠 받아야 받는 사이 지우거나 넣어도 빠지거나 겹치지 않는다 */
  allEntries: function(){
    var sb=this.sb, fid=this.familyId, out=[], SIZE=1000;
    // 같은 id 가 두 번 오면 잔액이 틀리므로 한 번 더 거른다
    function dedupe(rows){ var seen={}; return rows.filter(function(e){ if(seen[e.id]) return false; seen[e.id]=1; return true; }); }
    function page(after){
      var q=sb.from("entries").select("*").eq("family_id", fid).order("id");
      if(after) q=q.gt("id", after);
      return q.limit(SIZE).then(function(r){
        var rows=unwrap(r)||[]; out=out.concat(rows);
        return rows.length<SIZE ? dedupe(out) : page(rows[rows.length-1].id);
      });
    }
    return page(null);
  },
  loadAll: function(){
    var sb=this.sb, fid=this.familyId;
    return Promise.all([
      sb.from("families").select("id, code").eq("id", fid).single(),
      sb.from("children").select("*").eq("family_id", fid).order("sort").order("created_at"),   // sort 가 겹쳐도 순서가 흔들리지 않게
      this.allEntries()
    ]).then(function(rs){
      return {family:unwrap(rs[0]), children:unwrap(rs[1])||[], entries:rs[2]};
    });
  },
  upsertChild: function(c){
    var row=Object.assign({}, c, {family_id:this.familyId}), t=this.sb.from("children");
    var q = row.id ? t.update(row).eq("id",row.id).select().single() : t.insert(row).select().single();
    return q.then(unwrap);
  },
  deleteChild: function(id){ return this.sb.from("children").delete().eq("id",id).then(unwrap).then(function(){}); },   // entries 는 on delete cascade
  addEntry: function(e){
    return this.sb.from("entries").insert(Object.assign({}, e, {family_id:this.familyId})).select().single().then(unwrap);
  },
  addEntriesIgnoreDup: function(rows){
    var fid=this.familyId; rows=rows.map(function(r){ return Object.assign({}, r, {family_id:fid}); });
    return this.sb.from("entries").upsert(rows,{onConflict:"child_id,auto_key", ignoreDuplicates:true}).select()
      .then(function(r){ return (unwrap(r)||[]).length; });
  },
  // 고친 줄이 0개면(다른 폰이 지웠다) 실패로 본다
  updateEntry: function(id, patch){
    var row=Object.assign({}, patch, {updated_at:new Date().toISOString(), updated_by:this.userId});
    return this.sb.from("entries").update(row).eq("id",id).select("id").then(unwrap).then(function(rows){
      if(!rows || !rows.length) throw new Error(GONE_MSG);
    });
  },
  deleteEntry: function(id){ return this.sb.from("entries").delete().eq("id",id).then(unwrap).then(function(){}); },
  subscribe: function(cb){
    var fid=this.familyId;
    this.chan=this.sb.channel("fam-"+fid)
      .on("postgres_changes",{event:"*",schema:"public",table:"entries",filter:"family_id=eq."+fid}, cb)
      .on("postgres_changes",{event:"*",schema:"public",table:"children",filter:"family_id=eq."+fid}, cb)
      .subscribe();
  }
};

/* supabase-js 는 설정이 있을 때만 받는다(vendor/). 못 받으면 로컬 모드로 가지 않고 서버 실패와 같은 길로.
   CFG.SUPABASE_JS 는 테스트용 */
var SUPABASE_JS = CFG.SUPABASE_JS || "vendor/supabase-js-2.45.4.js";
function loadSupabase(){
  if(window.supabase) return Promise.resolve();
  return new Promise(function(ok, no){
    var sc=document.createElement("script"); sc.src=SUPABASE_JS; sc.crossOrigin="anonymous";   // CORS 로 받아야 404 가 캐시를 덮지 않는다
    sc.onload=function(){ window.supabase ? ok() : no(new Error("supabase-js 를 받지 못했어요")); };
    sc.onerror=function(){ no(new Error("supabase-js 를 받지 못했어요")); };
    document.head.appendChild(sc);
  });
}
var store=null;
function makeStore(){
  if(store) return Promise.resolve();                       // 다시 시도할 때 클라이언트를 또 만들지 않는다
  if(!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY)){ store=new LocalStore(); return Promise.resolve(); }
  return loadSupabase().then(function(){ store=new SupaStore(CFG); });
}

// signByHand: 부호를 손으로 눌렀다(용도 추측이 안 건드림) · dateByHand: 날짜를 골랐다(저장 때 오늘로 안 바꿈)
function newDraft(){ return {date:today(), memo:"", amount:"", sign:-1, signByHand:false, dateByHand:false}; }

/* ══════════════════════ 계산 ══════════════════════ */
function kidIds(){ return S.children.map(function(c){ return c.id; }); }
function childOf(id){ return S.children.find(function(c){return c.id===id;}); }
// 날짜 → 적은 시각 → id. 폰마다 누적 금액 순서가 같게
function cmp(x, y){ return x<y ? -1 : x>y ? 1 : 0; }
function byDateThenCreated(a, b){ return cmp(a.entry_date, b.entry_date) || cmp(a.created_at, b.created_at) || cmp(a.id, b.id); }
function entriesFor(cid){
  return S.entries.filter(function(e){return e.child_id===cid && !e.skipped;})
    .sort(byDateThenCreated);
}
function withTotals(cid){
  var c=childOf(cid); var run=c?(c.opening_balance||0):0;
  var rows=entriesFor(cid).map(function(e){ run+=e.amount; return Object.assign({},e,{total:run}); });
  return rows.reverse();
}
function balanceOf(cid){ var c=childOf(cid); var b=c?(c.opening_balance||0):0; entriesFor(cid).forEach(function(e){ b+=e.amount; }); return b; }
/* 최근 용도 칩: 많이 쓴 순, 같으면 최근 순. 부호는 다수결, 동률이면 최근 */
function recentMemos(cid){
  var map={}, out=[];
  withTotals(cid).forEach(function(e){                       // withTotals 는 최신순이라 먼저 나온 게 최근
    var m=(e.memo||"").trim(); if(!m||e.auto_key) return;
    var r=map[m] || (map[m]={memo:m, n:0, plus:0, minus:0, at:out.push(m)-1});
    r.n++; if(e.amount>0) r.plus++; else r.minus++;
    if(r.recent==null) r.recent = e.amount>0 ? 1 : -1;       // 가장 최근에 이 용도로 적은 줄의 부호
  });
  return out.map(function(m){ return map[m]; })
    .sort(function(a,b){ return b.n-a.n || a.at-b.at; })
    .slice(0,4)
    .map(function(r){ return {memo:r.memo, sign: r.plus>r.minus ? 1 : r.minus>r.plus ? -1 : r.recent}; });
}

/* 용도 → 부호: 칩과 같은 규칙. 같은 용도가 없으면 괄호 앞 말로 묶는다("용돈(큰아빠)"). 자동 용돈 줄도 센다. 처음 보는 말이면 0 */
function memoBase(m){ return m.split(/[(（]/)[0].trim(); }
function signForMemo(text){
  var m=(text||"").trim(); if(!m) return 0;
  var b=memoBase(m), same={p:0,n:0,at:"",r:0}, base={p:0,n:0,at:"",r:0};
  S.entries.forEach(function(e){
    if(e.skipped) return;
    var em=(e.memo||"").trim(); if(!em) return;
    var g = em===m ? same : (b && memoBase(em)===b) ? base : null; if(!g) return;
    if(g===same) tally(base, e);                  // 똑같은 용도도 괄호 앞 말 묶음에 들어간다
    tally(g, e);
  });
  return pick(same) || pick(base);
  function tally(g, e){ if(e.amount>0) g.p++; else g.n++;
    var at=e.entry_date+"|"+(e.created_at||""); if(at>=g.at){ g.at=at; g.r=e.amount>0?1:-1; } }
  function pick(g){ return g.p>g.n ? 1 : g.n>g.p ? -1 : g.r; }
}

/* 숫자 세로 가운데: dominant-baseline 은 글꼴마다 밀린다. 중심 + 0.35em 으로 놓는다 */
var KID_FONT="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
/* 나간 돈은 45% 바랜 색 + 제 색 점선. 투명도로 하면 겹친 지폐가 비친다(크림과 섞어 불투명하게) */
var KID_BG="#FDF6E7";                               // CSS --kid-bg 와 같은 값 — 바랜 색은 이 크림과 섞는다
function hexRgb(hex){ return [1,3,5].map(function(i){ return parseInt(hex.substr(i,2),16); }); }
function fade(hex, k){ var bg=hexRgb(KID_BG), c=hexRgb(hex);
  return '#'+c.map(function(v,i){ return Math.round(v*k+bg[i]*(1-k)).toString(16).padStart(2,"0"); }).join(""); }
var GONE_K=0.45;                                    // 남길 색의 양
function goneEdge(hex){ return ' stroke="'+hex+'" stroke-width="2" stroke-dasharray="6 4"'; }
/* 겹친 지폐의 바깥선. 가로로만 밀어 겹쳤으니 합집합은 폭만 넓은 같은 모양 */
function goneSilhouette(v, W, z){ var d=NOTE[v], r=Math.round(d.h*.18); z=z||1;
  return svgOpen(W, d.h, z)+
    '<rect x="1" y="1" width="'+(W-2)+'" height="'+(d.h-2)+'" rx="'+r+'" fill="none"'+goneEdge(d.c)+'/></svg>'; }
// 돈 그림 공통: 겉 <svg> · 가운데 맞춘 액면 글자
/* 배율은 width/height 로만(viewBox 그대로). CSS zoom 은 사파리에서 숫자 위치가 틀어진다 */
function svgOpen(w, h, z){ return '<svg width="'+Math.round(w*z)+'" height="'+Math.round(h*z)+'" viewBox="0 0 '+w+' '+h+'">'; }
function svgLabel(x, y, size, fill, v){
  return '<text x="'+x+'" y="'+y+'" dy=".35em" text-anchor="middle" font-family="'+KID_FONT+'" font-weight="800"'+
    ' font-size="'+Math.round(size)+'" fill="'+fill+'">'+v+'</text>';
}
function noteSvg(v, gone, stacked, z){ var d=NOTE[v], r=Math.round(d.h*.18), n=4, k=gone?GONE_K:1; z=z||1;
  var c=gone?fade(d.c,k):d.c, i2=gone?fade(d.i,k):d.i;
  // 겹쳐 쌓을 땐 장마다 점선을 긋지 않고 크림 테두리로 나눈다. 점선은 바깥선 하나(goneSilhouette)
  var edge = (gone && !stacked) ? goneEdge(d.c) : ' stroke="'+KID_BG+'" stroke-width="2"';
  return svgOpen(d.w, d.h, z)+
    '<rect x="1" y="1" width="'+(d.w-2)+'" height="'+(d.h-2)+'" rx="'+r+'" fill="'+c+'"'+edge+'/>'+
    '<rect x="'+(n+1)+'" y="'+(n+1)+'" width="'+(d.w-2*n-2)+'" height="'+(d.h-2*n-2)+'" rx="'+(r-2)+'" fill="'+i2+'"/>'+
    '<circle cx="'+(d.h*.44)+'" cy="'+(d.h/2)+'" r="'+(d.h*.22)+'" fill="'+c+'"/>'+
    svgLabel(d.w*.62, d.h/2, d.h*.36, d.t, v)+'</svg>'; }
function coinSvg(v, gone, z){ var d=COIN[v], R=d.d/2, k=gone?GONE_K:1; z=z||1;
  var c=gone?fade(d.c,k):d.c, i2=gone?fade(d.i,k):d.i;
  var edge = gone ? goneEdge(d.c) : ' stroke="'+KID_BG+'" stroke-width="2"';
  return svgOpen(d.d, d.d, z)+
    '<circle cx="'+R+'" cy="'+R+'" r="'+(R-1)+'" fill="'+c+'"'+edge+'/>'+
    '<circle cx="'+R+'" cy="'+R+'" r="'+(R-5)+'" fill="'+i2+'"/>'+
    '<path d="M '+(R*.55)+' '+(R*.62)+' A '+(R*.62)+' '+(R*.62)+' 0 0 1 '+(R*.9)+' '+(R*.42)+'"'+      // 동전 위의 반짝임
    ' stroke="#fff" stroke-opacity=".75" stroke-width="'+Math.max(2,R*.14)+'" stroke-linecap="round" fill="none"/>'+
    svgLabel(R, R, R*.62, d.t, v)+'</svg>'; }
function splitWon(n){ var out=[]; n=Math.max(0,Math.round(n||0));
  [50000,10000,5000,1000,500,100,50,10].forEach(function(v){ var c=Math.floor(n/v); if(c){ out.push([v,c]); n-=c*v; } }); return out; }
/* 빌린 돈(마이너스)은 빈 점선 틀 + 옅은 숫자. 채운 색이 없어 나간 돈 점선보다 조금 굵다.
   겹치면 크림으로 속을 채워 뒷장 선을 가린다 */
function owedEdge(hex){ return ' stroke="'+hex+'" stroke-width="2.5" stroke-dasharray="7 5"'; }
function owedNote(v, z){ var d=NOTE[v], r=Math.round(d.h*.18); z=z||1;
  return svgOpen(d.w, d.h, z)+
    '<rect x="1.5" y="1.5" width="'+(d.w-3)+'" height="'+(d.h-3)+'" rx="'+r+'" fill="'+KID_BG+'"'+owedEdge(d.c)+'/>'+
    svgLabel(d.w*.62, d.h/2, d.h*.36, fade(d.t,GONE_K), v)+'</svg>'; }
function owedCoin(v, z){ var d=COIN[v], R=d.d/2; z=z||1;
  return svgOpen(d.d, d.d, z)+
    '<circle cx="'+R+'" cy="'+R+'" r="'+(R-1.5)+'" fill="'+KID_BG+'"'+owedEdge(d.c)+'/>'+
    svgLabel(R, R, R*.62, fade(d.t,GONE_K), v)+'</svg>'; }
/* look: 없음 = 가진 돈(꽉 찬 색) · "gone" = 나간 돈(바랜 흔적) · "owed" = 빌린 돈(빈 자리) */
function moneyRows(n, look, z){
  z=z||1;
  var gone=look==="gone", owed=look==="owed";
  var box=el("div","money");
  splitWon(n).forEach(function(p){ var v=p[0], c=p[1], isN=v>=1000, d=isN?NOTE[v]:COIN[v], w=isN?d.w:d.d, h=isN?d.h:d.d;
    // 지폐는 부채꼴, 동전은 나란히. 다섯 장을 넘으면 한 장 + ×n(5만원권만 해당)
    var step=isN?Math.round(w*.30):w+6, show=(c<=4?c:1);
    var W=w+step*(show-1), stacked=isN && show>1;
    var row=el("div","row"), st=el("div","st");
    st.style.width=Math.round(W*z)+"px"; st.style.height=Math.round(h*z)+"px";
    var html=""; for(var i=0;i<show;i++) html+='<div style="position:absolute;left:'+Math.round(i*step*z)+'px;top:0">'+
      (owed ? (isN?owedNote(v,z):owedCoin(v,z)) : (isN?noteSvg(v,gone,stacked,z):coinSvg(v,gone,z)))+'</div>';
    if(gone && stacked) html+='<div style="position:absolute;left:0;top:0">'+goneSilhouette(v,W,z)+'</div>';
    st.innerHTML=html; row.appendChild(st);
    if(c>show){
      // × 는 작고 연하게, 장수는 크고 진하게
      var many=el("span","xn"), sym=el("i",null,"\u00d7");
      var tone=owed?fade(d.t,GONE_K):d.t;   // 빈 자리면 틀 속 숫자처럼 옅게
      sym.style.color=fade(tone,.55);
      many.appendChild(sym);
      many.appendChild(el("b",null,String(c)));
      many.style.color=tone;          // 그 지폐의 진한 톤
      row.appendChild(many);
    }
    box.appendChild(row); });
  return box;
}
// 넘치면 한 단계씩 줄인다(.tight → .tighter)
function shrinkToFit(v){
  v.classList.remove("tight","tighter");
  if(v.scrollHeight > v.clientHeight) v.classList.add("tight");
  if(v.scrollHeight > v.clientHeight) v.classList.add("tighter");
}
function renderKidView(){
  var c=childOf(S.kidView), col=COLORS[(c||{}).color]||COLORS.blue;
  var v=el("div","kid"+(S.ui.kidSlide?" slide-"+S.ui.kidSlide:"")); S.ui.kidSlide=null;
  v.style.setProperty("--c-name",col.name);
  v.onclick=function(){ if(S.ui.kidDragClick){ S.ui.kidDragClick=false; return; } navBack(); };   // 끌어서 생긴 click 은 닫기가 아니다
  kidSwipe(v);
  var x=el("button","x","\u2715"); x.setAttribute("aria-label","닫기"); v.appendChild(x);
  // 캐시된 그림을 첫 프레임에(늦으면 돼지가 깜빡인다)
  var pig=document.createElement("img"); pig.className="pig"; pig.decoding="sync"; pig.src="logo-pig.png"; pig.alt=""; v.appendChild(pig);
  v.appendChild(el("div","kn",c?c.name:""));
  var bal=balanceOf(S.kidView);
  var ka=el("div","ka"); ka.appendChild(el("b",null,fmt(bal))); ka.appendChild(el("i",null,"원")); v.appendChild(ka);
  // 마이너스면 모자란 만큼 빈 자리
  v.appendChild(moneyRows(Math.abs(bal), bal<0?"owed":null));
  function fit(){ shrinkToFit(v); }
  v.fit=fit; pig.addEventListener("load", fit);          // 붙인 직후 동기로(rAF 면 첫 프레임이 큰 크기로 그려진다)
  return v;
}

/* 아이 화면 좌우 밀기: 보여 주기만 하고 S.sel 은 안 바꾼다 */
/* 아이 바꾸는 가로 밀기(홈 · 아이 화면 · 안내 공용). EDGE 는 안드로이드 뒤로 가기 몫 */
var SWIPE={EDGE:40, SLOP:10, FLICK_PX:60, FLICK_SPEED:0.45, FAR:0.22};
// 60px · 0.45px/ms 넘게 튕기거나 폭의 22% 넘게 밀면 넘긴다
function swipeFar(ab, ms){ return (ab>SWIPE.FLICK_PX && ab/Math.max(1,ms) > SWIPE.FLICK_SPEED) || ab > window.innerWidth*SWIPE.FAR; }
// 가로 밀기. 아이 화면 · 홈 공용
//   start(touch, e): false 를 돌려주면 이 터치는 따라가지 않는다
//   vertical: "drop" 이면 세로가 먼저 우세할 때 놓아 준다(목록 스크롤). 아니면 세로 동안은 기다린다
//   end({moved, go, dx, far}): 손을 뗄 때. moved = SLOP 넘게 움직였다(누른 게 아니다), go = 가로로 끌었다, far = 넘길 만큼(swipeFar)
function hSwipe(node, o){
  var x0=0, y0=0, t0=0, on=false, moved=false, go=false;
  node.addEventListener("touchstart", function(e){
    on=false;
    if(e.touches.length!==1) return;
    var t=e.touches[0];
    if(o.start && o.start(t, e)===false) return;
    on=true; moved=false; go=false; x0=t.clientX; y0=t.clientY; t0=e.timeStamp;
  }, {passive:true});
  node.addEventListener("touchmove", function(e){
    if(!on) return;
    var t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>SWIPE.SLOP || Math.abs(dy)>SWIPE.SLOP) moved=true;           // 끈 것은 누른 게 아니다
    if(Math.abs(dy)>Math.abs(dx)){ if(!go){ if(o.vertical==="drop") on=false; return; } }   // 세로가 우세하면 스크롤에 양보
    else if(Math.abs(dx)>SWIPE.SLOP) go=true;
    // 가로로 끄는 동안 기본 동작을 막는다(안 막으면 브라우저가 뒤로 가기로 쓴다)
    if(go && e.cancelable) e.preventDefault();
  }, {passive:false});
  function end(e){
    if(!on) return; on=false;
    var t=e.changedTouches && e.changedTouches[0], dx=t ? t.clientX-x0 : 0;
    o.end({moved:moved, go:go && !!t, dx:dx, far:go && !!t && swipeFar(Math.abs(dx), e.timeStamp-t0)});
  }
  node.addEventListener("touchend", end);
  node.addEventListener("touchcancel", end);
}
function nearEdge(x){ return x<=SWIPE.EDGE || x>=window.innerWidth-SWIPE.EDGE; }   // 가장자리는 안드로이드 뒤로 가기 몫

function kidSwipe(node){
  // 새로 누르면 지난 끌기 표시를 버린다(click 이 안 오는 기기가 있다)
  node.addEventListener("pointerdown", function(){ S.ui.kidDragClick=false; }, {passive:true});
  var edge=false;
  hSwipe(node, {
    start: function(t){ edge=nearEdge(t.clientX); },   // 가장자리에서 시작해도 따라간다(끌기 click 을 버리려고). 넘기지만 않는다
    end: function(r){
      // 끈 터치의 click 하나만 버린다. 시간으로 막으면 일부러 누른 닫기까지 먹는다
      if(r.moved) S.ui.kidDragClick=true;
      if(!r.far || edge || S.children.length<2) return;
      var ids=kidIds(), i=ids.indexOf(S.kidView);
      if(i<0) return;
      S.kidView = ids[(i + (r.dx<0?1:-1) + ids.length) % ids.length];   // 끝에서 처음으로 — 애들이 계속 밀 수 있게
      S.ui.kidSlide = r.dx<0 ? "l" : "r";
      var old=root.querySelector(".kid:not(.one):not(.ghost)"), dir=S.ui.kidSlide;
      render();
      ghostOut(old, dir, false);
    }
  });
}

/* 줄을 길게 누르면 그 금액만 그림으로. 돼지가 없는 게 "이건 한 건" 표시 */
function renderEntryView(){
  var e=S.entryView, c=childOf(e.child_id), col=COLORS[(c||{}).color]||COLORS.blue;
  var v=el("div","kid one"); v.style.setProperty("--c-name",col.name);
  v.onclick=navBack;
  var x=el("button","x","\u2715"); x.setAttribute("aria-label","닫기"); v.appendChild(x);
  if(e.memo) v.appendChild(el("div","kn", e.memo));         // 용도가 없으면 금액만
  var ka=el("div","ka"), b=el("b",null,fmtSigned(e.amount));
  if(e.amount>0) b.className="in";
  ka.appendChild(b); ka.appendChild(el("i",null,"원")); v.appendChild(ka);
  var money=moneyRows(Math.abs(e.amount), e.amount<0?"gone":null);   // 나간 돈이면 "빠진 자리"로
  v.appendChild(money);
  function fit(){          // 돼지가 없어 크게. 넘치면 아이 화면과 같은 규칙
    v.classList.remove("tight","tighter");
    var zooms=[1.6,1.45,1.3,1.15,1];
    for(var i=0;i<zooms.length;i++){
      var m2=moneyRows(Math.abs(e.amount), e.amount<0?"gone":null, zooms[i]);
      v.replaceChild(m2, money); money=m2;
      // 가로도 본다(5만원권 다섯 장 줄은 키우면 잘린다)
      if(v.scrollHeight <= v.clientHeight && v.scrollWidth <= v.clientWidth) return;
    }
    shrinkToFit(v);
  }
  requestAnimationFrame(fit);
  return v;
}

/* 길게 누르기. 10px 움직이면 취소. 뗄 때 오는 click 은 삼킨다(안 그러면 열린 그림이 바로 닫힌다) */
function swallowNextClick(){
  function kill(ev){ ev.preventDefault(); ev.stopPropagation(); done(); }
  function done(){ document.removeEventListener("click", kill, true); clearTimeout(tm); }
  var tm=setTimeout(done, 500);                 // click 이 안 오는 기기도 있으니 스스로 물러난다
  document.addEventListener("click", kill, true);
}
var LONG_PRESS={MS:500, SLOP:10};                       // 이만큼 누르고 있으면, 이만큼 넘게 움직이면 취소(스크롤)
function longPress(node, fn){
  var t=null, x0=0, y0=0, fired=false;
  function clear(){ if(t){ clearTimeout(t); t=null; } }
  node.addEventListener("touchstart", function(ev){
    if(ev.touches.length!==1) return;
    fired=false; x0=ev.touches[0].clientX; y0=ev.touches[0].clientY;
    clear(); t=setTimeout(function(){
      t=null; fired=true;
      if(navigator.vibrate) navigator.vibrate(12);   // 열리는 순간 진동(iOS 는 무시)
      fn();
    }, LONG_PRESS.MS);
  }, {passive:true});
  node.addEventListener("touchmove", function(ev){
    if(!t) return;
    var p=ev.touches[0];
    if(Math.abs(p.clientX-x0)>LONG_PRESS.SLOP || Math.abs(p.clientY-y0)>LONG_PRESS.SLOP) clear();      // 스크롤이면 취소
  }, {passive:true});
  function end(){ clear(); if(fired){ fired=false; swallowNextClick(); } }   // 얼마나 오래 눌렀든 뗀 순간부터
  node.addEventListener("touchend", end);
  node.addEventListener("touchcancel", end);
  node.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });
}

/* ══════════════════════ 자동 입금 ══════════════════════ */
// 마지막 자동 용돈 날은 열쇠(w:날짜)로 센다(entry_date 는 옮길 수 있다). 오늘보다 뒤인 열쇠는 무시
function lastAutoDay(cid){
  var t=today(), last="";
  S.entries.forEach(function(e){ if(e.child_id===cid && e.auto_key){ var kd=e.auto_key.slice(2); if(kd>last && kd<=t) last=kd; } });
  return last;
}
/* 첫 용돈 날 후보: 가까운 그 요일 · 한 주 뒤(부모가 고른다).
   미리 고를 쪽: 처음 켜면 가까운 날, 요일만 바꾸면 원래 받을 날(마지막 + 7)에 가까운 날 */
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function firstPayChoices(c, dow){
  var d=today(); while(dowOf(d)!==dow) d=addDays(d,1);
  var two=[d, addDays(d,7)];
  if(!c.weekly_on) return {dates:two, pick:0};
  // 원래 받을 날. 아직 안 온 첫 날이 있으면 그 날
  var last=lastAutoDay(c.id), due = (c.weekly_start && c.weekly_start > last) ? c.weekly_start : (last ? addDays(last,7) : "");
  if(!due) return {dates:two, pick:0};
  return {dates:two, pick: Math.abs(daysBetween(two[0],due)) < Math.abs(daysBetween(two[1],due)) ? 0 : 1};
}
function ensureAllowances(){
  var t=today(), rows=[];
  S.children.forEach(function(c){
    if(!c.weekly_on || c.weekly_dow==null || !(c.weekly_amount>0)) return;
    // 마지막 자동 줄 다음 날부터. weekly_start 부터 세면 루프가 400 에 걸려 최근 주가 빈다
    var have={}, last=lastAutoDay(c.id);
    S.entries.forEach(function(e){ if(e.child_id===c.id && e.auto_key) have[e.auto_key]=1; });
    var start = c.weekly_start || localDay(c.created_at) || t;
    var from = last && last>=start ? addDays(last,1) : start;
    var floor = addDays(t,-400);          // 400일 바닥
    if(from < floor) from = floor;        // 루프는 늘 오늘까지 간다
    var d=from, guard=0;
    while(d<=t && guard++<420){
      if(dowOf(d)===c.weekly_dow){ var k="w:"+d; if(!have[k]) rows.push({child_id:c.id, entry_date:d, memo:"용돈", amount:c.weekly_amount, auto_key:k}); }
      d=addDays(d,1);
    }
  });
  if(!rows.length) return Promise.resolve(0);
  return store.addEntriesIgnoreDup(rows);
}

/* ══════════════════════ 마지막으로 받은 내용 ══════════════════════ */
// 서버가 안 되면 마지막으로 받은 내용 + 띠(빈 화면이면 기록이 날아간 것처럼 보인다)
var CACHE_KEY="yd_cache_v1";
function cacheSave(d){
  if(store.kind!=="supabase") return;
  lsSet(CACHE_KEY, JSON.stringify({family:d.family, children:d.children, entries:d.entries, at:Date.now()}));
}
function cacheLoad(){
  try{ var c=JSON.parse(lsGet(CACHE_KEY)||"null"); return (c && c.children) ? c : null; }catch(e){ return null; }
}
function useCache(){
  var c=cacheLoad(); if(!c) return false;
  S.family=c.family; S.children=c.children; S.entries=c.entries;
  if(!S.sel || !childOf(S.sel)) S.sel = S.children.length ? S.children[0].id : null;
  S.offline=true; tourInit(); return true;
}

/* ══════════════════════ 처음 안내 ══════════════════════
   숨은 동작을 그 자리에서 한 번 해 보게 한다. 기록은 만들지 않는다(예시 줄). 쓰던 흔적(캐시)이 있는 기기엔 안 뜬다 */
function tourInit(){                                   // cacheSave 전에 불러야 새 기기가 "쓰던 기기"로 안 읽힌다
  var v=lsGet("yd_tour");
  if(v==null){ var used = !!cacheLoad() || (store.kind==="local" && S.entries.length>0); v = used ? "done" : "new"; lsSet("yd_tour", v); }
  if(v==="new" && !S.tour) S.tour={step:"sign", sel0:S.sel};   // 하다 말고 껐으면 처음부터. sel0 = 끝나면 돌아갈 아이
}
function tourEnd(){                                    // 안내에서 바꾼 것(부호, 아이)은 되돌린다
  var t=S.tour; S.tour=null; lsSet("yd_tour","done");
  if(t && t.sel0 && childOf(t.sel0) && t.sel0!==S.sel){ S.sel=t.sel0; lsSet("yd_sel",S.sel); S.limit=LIST_PAGE; resetDraft(); }
  else if(!S.draft.memo && !S.draft.amount) resetDraft();
  if(S.edit && S.edit.id==="sample") navBack();          // 예시 시트도 닫는다
}
/* 단계 표 — 순서·성격·곁화면·넘어가는 조건·밝힐 곳이 단계마다 한 곳에 있다.
   do      해 보는 단계(카드의 "다음"이 연하다). 없으면 보여주기만 하는 단계
   where   "settings" = 설정 안의 단계. 하다가 설정을 나가면 안내가 끝난다
   only()  이 단계가 있는지 — 밀기는 아이가 둘 이상일 때만
   view    해 보면 열리는 곁화면 {open() 열렸나, sub "kid"(그림 위 한 줄) | "sheet"(시트 설명), hide() 설명을 잠깐 접을 때, key 카드 글}
           열렸다 닫히면 다음 단계로
   arrive  이 화면에 오면 다음 단계로
   next    다음 단계 — 없으면 순서(TOUR_ORDER)의 다음
   spot()  밝힐 곳 {key 카드 글, hole, pulse, full 막 없이, radius} — 곁화면이 없을 때
   sample  안내 위의 예시 줄로 해 본다(기록을 만들지 않는다)
   card    설정의 한 묶음(제목 줄부터 카드까지)을 밝힌다. row=첫 줄에 번지는 테
   ok()    카드의 "다음"이 단계 순서대로 넘기지 않고 따로 하는 일 */
var TOUR={
  sign:  {do:true, spot:function(){ var plus=S.draft.sign>0;      // + 가 됐으면 바로 넘기지 않고 "다음"을 기다린다
           return entrySpot(plus ? "signDone" : "sign", !plus); }},
  bal:   {do:true, view:{open:function(){ return S.kidView; }, sub:"kid", key:"balView"},
           spot:function(){ var h=tourHole(".balbtn", 8); return {hole:h, pulse:h && centerOf(h)}; }},
  swipe: {do:true, only:function(){ return S.children.length>1; },
           spot:function(){ return {full:true}; }},                 // 어디서든 되는 동작이라 막 없이 카드만
  press: {do:true, sample:true, view:{open:function(){ return S.entryView; }, sub:"kid", key:"pressView"}},
  edit:  {do:true, sample:true, view:{open:function(){ return S.edit && S.edit.id==="sample"; }, sub:"sheet", key:"editView",
           hide:function(){ return S.pickDate; }}},
  gear:  {do:true, arrive:"settings",
           spot:function(){ var h=tourHole(".gear", 4); return {hole:h, pulse:h && centerOf(h)}; },
           ok:function(){ navOpen("settings", function(){ S.screen="settings"; }); }},   // 설정 단계는 설정 안에서만. 대신 열어 준다
  color: {where:"settings", card:true},
  week:  {do:true, where:"settings", card:true, row:true, view:{open:function(){ return S.editWeek; }, sub:"sheet", key:"weekView"}},
  export:{where:"settings", card:true},
  sync:  {where:"settings", card:true, only:function(){ return !!store && store.kind==="supabase"; }},   // 이 기기 전용 모드엔 가족 코드가 없다
  back:  {do:true, where:"settings", arrive:"home", next:"done",
           spot:function(){
             if(window.scrollY){ scrollTop0(); tourSettle(); }       // 내보내기까지 내려와 있었으면 ‹ 가 화면 밖이다
             var h=tourHole(".nav .back", 4); return {hole:h, pulse:h && centerOf(h)}; },
           ok:function(){ leaveSettings(); }},                       // 끝 = 설정에서 나가기
  done:  {spot:function(){ return entrySpot("done", false); },        // 마지막 한 장
           ok:function(){ tourEnd(); render(); }}
};
var TOUR_ORDER=["sign","bal","swipe","press","edit","gear","color","week","export","sync","back"];   // done 은 점 밖의 마지막 한 장
function tourOrder(){ return TOUR_ORDER.filter(function(k){ return !TOUR[k].only || TOUR[k].only(); }); }
// 다음 단계: 따로 없으면 순서의 다음
function tourNext(step){
  var d=TOUR[step]; if(d.next) return d.next;
  var o=tourOrder(); return o[o.indexOf(step)+1];
}
function tourSub(){                                    // 지금 떠 있는 곁화면의 종류 — 그림이면 "kid", 시트면 "sheet"
  var t=S.tour; if(!t) return null;
  var v=TOUR[t.step].view;
  return (v && v.open() && !(v.hide && v.hide())) ? v.sub : null;
}
function tourTick(){                                   // 화면 상태를 보고 다음 단계로 — render 마다 한 번
  var t=S.tour; if(!t) return;
  var d=TOUR[t.step];
  if(d.view && (d.where!=="settings" || S.screen==="settings")){
    if(d.view.open()) t.opened=true;                    // 곁화면을 열었다 → 닫으면 다음
    else if(t.opened){ t.opened=false; t.step=tourNext(t.step); }
  } else if(d.arrive && S.screen===d.arrive) t.step=tourNext(t.step);
  var now=TOUR[t.step];
  if(now.where==="settings" && !now.arrive && S.screen!=="settings") tourEnd();   // 설정 단계 중간에 나가면 그냥 끝
}
function tourText(step){

  return { sign:["\u2212 를 눌러 받은 돈으로 바꿔 보세요","쓴 돈은 \u2212, 받은 돈은 + 로 적어요"],
           signDone:["이제 받은 돈이에요","\u2018용돈\u2019처럼 받은 돈으로 한 번 적은 용도는 다음부터 자동으로 + 가 돼요"],
           bal:["잔액을 눌러 보세요","아이에게 보여주는 화면이 열려요"],

           swipe:["좌우로 밀어 보세요","다른 아이의 용돈기입장으로 넘어가요. 위의 이름을 눌러도 돼요"],
           press:["이 줄을 길게 눌러 보세요","이 금액만 따로 보여줘요"],

           edit:["이번엔 짧게 눌러 보세요","기록을 고치는 창이 열려요"],
           editView:["기록 고치기","날짜·용도·금액을 바꾸거나 지울 수 있어요. 매주 들어오는 용돈은 이번 주만 건너뛸 수도 있어요"],
           gear:["오른쪽 위 톱니를 눌러 설정으로 가 볼게요","나머지는 설정에 있어요"],
           color:["아이 이름과 색","여기서 고른 색이 홈과 아이 화면에 쓰여요"],
           week:[first+" 줄을 눌러 보세요","매주 용돈을 정하는 곳이에요"],
           weekView:["매주 용돈","요일과 금액을 정해 두면 그날 기록이 저절로 생겨요. 안 쓰면 꺼 두면 돼요"],
           export:["기록 내보내기","전체 기록을 엑셀로 열 수 있는 파일로 저장해요"],
           sync:["가족 코드","다른 폰에서 이 코드로 참여하면 같은 기록을 같이 보고 적어요. 누르면 복사돼요"],
           back:["\u2039 를 눌러 나가면 끝이에요","이 안내는 설정의 \u2018처음 안내 다시 보기\u2019에서 언제든 다시 볼 수 있어요"],
           done:["다 됐어요","이제 오늘 쓴 돈부터 적어 보세요"] }[step];
}
function tourPrev(){                                   // 한 단계 뒤로. 곁화면이 떠 있으면 그것만 닫는다(다음으로 안 넘어가게 opened 를 끈다)
  var t=S.tour, o=tourOrder(), i=o.indexOf(t.step);
  if(tourSub()){ t.opened=false; navBack(); return; }
  if(t.step==="done"){ t.step="back"; navOpen("settings", function(){ S.screen="settings"; }); return; }
  if(i<=0) return;
  var prev=o[i-1]; t.opened=false;
  if(t.step==="color"){ t.step="gear"; leaveSettings(); return; }   // 설정 첫 단계에서 이전 = 설정에서 나가기
  t.step=prev; tourSync();
}
/* 막이 떠 있는 동안 상태바도 어둡게(theme-color). 홈 화면 앱의 상태바는 웹 화면 밖이다 */
var THEME_PAPER="#FDFCFA", THEME_DIM="#797A7B";          // DIM = PAPER 위에 rgba(17,19,23,.56)
function setThemeColor(c){ var m=document.querySelector('meta[name="theme-color"]'); if(m && m.content!==c) m.content=c; }
function tourSync(){                                   // render 끝에서. 있어야 하면 만들고 자리를 맞추고, 아니면 숨기거나 치운다
  var t=S.tour, sub=tourSub();
  var show = !!t && (S.screen==="home" || S.screen==="settings") && (sub ||
             !overlayOpen());
  if(!t){                                               // 안내가 끝났다 — 레이어를 흐려지며 치운다
    setThemeColor(THEME_PAPER);
    if(S.ui.tourL){
      var box=S.ui.tourL.box; S.ui.tourL=null; box.classList.add("out");
      setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 260);
    }
    return;
  }
  if(!S.ui.tourL){
    S.ui.tourL=tourBuild(); document.body.appendChild(S.ui.tourL.box);
    requestAnimationFrame(function(){ if(S.ui.tourL) S.ui.tourL.box.classList.add("in"); });
  }
  S.ui.tourL.box.classList.toggle("hide", !show);
  if(show) tourLayout(sub); else setThemeColor(THEME_PAPER);
}
/* 자리 다시 재기: iOS 는 프로그램 스크롤 직후 잰 자리가 한 프레임 뒤 틀어질 수 있다. 최대 40프레임 */
function tourSettle(){
  if(S.ui.tourSettling) return; S.ui.tourSettling=true;
  var last=window.scrollY, stable=0, n=0, t0=performance.now(), changed=t0;
  (function tick(){
    if(!S.tour || !S.ui.tourL){ S.ui.tourSettling=false; return; }
    var y=window.scrollY, now=performance.now(), first=(n++===0);
    if(first || y!==last){ last=y; stable=0; changed=now; tourSync(); } else stable++;   // 첫 프레임은 무조건 다시 잰다
    // 여섯 프레임과 0.12초 동안 그대로면 끝(바쁜 기기는 프레임이 몰려 온다)
    var still = stable>=6 && now-changed>=120;
    if(!still && now-t0<1000) requestAnimationFrame(tick); else S.ui.tourSettling=false;
  })();
}
function tourBuild(){
  var box=el("div","tour"), L={box:box, step:null};
  L.spot=el("div","tour-spot"); box.appendChild(L.spot);
  L.blocks=["t","b","l","r"].map(function(){ var d=el("div","tour-block"); box.appendChild(d); return d; });
  L.pulse=el("div","tour-pulse"); L.pulse.appendChild(el("i")); L.pulse.appendChild(el("i")); box.appendChild(L.pulse);
  L.sample=el("div","tour-sample");                    // 예시 줄. 기록은 안 만든다
  var r=el("button","row sample");
  r.appendChild(el("span","d","오늘")); r.appendChild(el("span","m","젤리")); r.appendChild(el("span","a","−800")); r.appendChild(el("span","t",""));
  longPress(r, function(){ navOpen("entryView", function(){ S.entryView={id:"sample", child_id:S.sel, memo:"젤리", amount:-800}; }); });
  r.onclick=function(){                                // 짧게 누르기는 고치기 단계에서만
    if(S.tour && S.tour.step==="edit")
      navOpen("edit", function(){ S.edit={id:"sample", child_id:S.sel, memo:"젤리", amount:-800, amountStr:"800", sign:-1, entry_date:today(), arm:false}; });
  };
  L.sample.appendChild(r); box.appendChild(L.sample);
  L.card=el("div","tour-card"); L.caret=el("div","tc-caret"); L.card.appendChild(L.caret);
  L.text=el("div","tc-text"); L.card.appendChild(L.text);
  L.foot=el("div","tc-foot"); L.dots=el("div","dots"); L.foot.appendChild(L.dots);
  // × 는 안내 전체 끝, "다음"은 이 단계만 건너뛰기
  L.skip=el("button","skip","×"); L.skip.setAttribute("aria-label","그만하기"); L.skip.onclick=function(){ tourEnd(); render(); };
  L.ok=el("button","ok","다음"); L.ok.onclick=function(){ var st=S.tour.step, d=TOUR[st];
    if(tourSub()==="sheet"){ navBack(); return; }                                      // 시트를 닫으면 tick 이 다음으로
    if(d.ok){ d.ok(); return; }
    S.tour.step=tourNext(st); S.tour.opened=false; tourSync(); };
  L.prev=el("button","prev","이전"); L.prev.onclick=tourPrev;
  var btns=el("div","btns"); btns.appendChild(L.prev); btns.appendChild(L.ok);
  L.skipHint=el("span","skip-hint","언제든 그만두기");
  L.card.appendChild(L.skip); L.card.appendChild(L.skipHint); L.foot.appendChild(btns); L.card.appendChild(L.foot); box.appendChild(L.card);
  return L;
}
// 안내가 재는 자리 — 화면 좌표(뷰포트)
function padRect(r,p){ return {x:r.left-p, y:r.top-p, w:r.width+2*p, h:r.height+2*p}; }
function tourHole(sel, p){ var n=document.querySelector(sel); return n ? padRect(n.getBoundingClientRect(), p) : null; }
function centerOf(h){ return {x:h.x+h.w/2, y:h.y+h.h/2}; }
function scrollTop0(){ try{ window.scrollTo({top:0, behavior:"instant"}); }catch(_){ window.scrollTo(0,0); } }
function scrollCenter(n){ try{ n.scrollIntoView({block:"center", behavior:"instant"}); }catch(_){ n.scrollIntoView({block:"center"}); } }
function cssPx(name){ var v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); return isNaN(v)?0:v; }
// 입력줄을 밝힌다 — 첫 단계(부호)와 마지막 한 장
function entrySpot(key, pulseSign){
  var hole=tourHole(".entry", 6), sg=document.querySelector(".entry .sign"), pulse=null;
  if(hole && sg && pulseSign){ var r=sg.getBoundingClientRect(); pulse={x:r.left+r.width/2, y:r.top+r.height/2}; }
  return {key:key, hole:hole, pulse:pulse, radius:"18px"};
}
// 설정의 한 묶음 — 제목 줄부터 카드까지. 화면 밖이면 보이게 올린다
function cardSpot(step, row){
  var c=document.querySelector(".card."+step); if(!c) return {};
  var h=c.previousElementSibling, r1=c.getBoundingClientRect(), vh=window.innerHeight, pulse=null;
  if(r1.top<60 || r1.bottom>vh-180){ scrollCenter(c); r1=c.getBoundingClientRect(); tourSettle(); }
  var r2=h ? h.getBoundingClientRect() : r1, top0=Math.min(r1.top,r2.top);
  if(row){ var fb=c.querySelector(".srow"); if(fb){ fb=fb.getBoundingClientRect(); pulse={x:fb.left+40, y:fb.top+fb.height/2}; } }
  return {hole:{x:r1.left-8, y:top0-6, w:r1.width+16, h:r1.bottom-top0+12}, pulse:pulse};
}
// 길게 누르기·고치기는 안내 위의 예시 줄로 — 입력줄 바로 아래에 놓고 그 줄을 밝힌다
function sampleSpot(L){
  var e2=document.querySelector(".entry"), eb=e2 && e2.getBoundingClientRect();
  L.sample.style.top=(eb ? eb.bottom+12 : 200)+"px"; L.sample.classList.add("on");
  var sr=L.sample.getBoundingClientRect(), hole=padRect(sr, 6);
  return {hole:hole, pulse:{x:sr.left+34, y:sr.top+sr.height/2}};
}
function tourLayout(sub){
  var L=S.ui.tourL, step=S.tour.step, d=TOUR[step], vw=window.innerWidth, vh=window.innerHeight;
  // 밝힐 곳 — 곁화면이면 그 종류대로, 아니면 단계가 정한다
  var at;
  if(sub==="kid") at={key:d.view.key, full:true};                                       // 그림 위엔 막 없이 한 줄만
  else if(sub==="sheet")                                                                // 시트는 보여 주기만
    at={key:d.view.key, hole:tourHole(".sheet", 0), blockAll:true, above:true, radius:"22px 22px 0 0"};
  else if(d.sample) at=sampleSpot(L);
  else if(d.card) at=cardSpot(step, d.row);
  else at=d.spot ? d.spot() : {};
  if(!(d.sample && !sub)) L.sample.classList.remove("on");   // 그림 · 시트가 떠 있으면 예시 줄을 치운다
  var key=at.key || step, full=!!at.full, hole=full ? {x:-20, y:-20, w:vw+40, h:vh+40} : (at.hole || null);
  setThemeColor(full ? THEME_PAPER : THEME_DIM);          // 막이 있으면 상태바도 같이 어둡게
  // 구멍(=밝은 곳)
  var sp=L.spot.style;
  if(hole){ sp.left=hole.x+"px"; sp.top=hole.y+"px"; sp.width=hole.w+"px"; sp.height=hole.h+"px"; }
  else { sp.left=(vw/2)+"px"; sp.top=(vh/2)+"px"; sp.width="0px"; sp.height="0px"; }
  sp.borderRadius = full ? 0 : (at.radius || "14px");
  // 막 — 구멍 둘레 네 조각. 시트 설명 중엔 구멍까지 막는다(보여주기만)
  var H = hole || {x:vw/2, y:vh/2, w:0, h:0}, B = at.blockAll ? {x:0, y:0, w:0, h:0} : H;
  var bl=L.blocks, st=[[0,0,vw,Math.max(0,B.y)], [0,B.y+B.h,vw,Math.max(0,vh-B.y-B.h)], [0,B.y,Math.max(0,B.x),B.h], [B.x+B.w,B.y,Math.max(0,vw-B.x-B.w),B.h]];
  st.forEach(function(q,i){ bl[i].style.left=q[0]+"px"; bl[i].style.top=q[1]+"px"; bl[i].style.width=q[2]+"px"; bl[i].style.height=q[3]+"px"; });
  // 누를 곳에 번지는 테(밀기 단계 없음)
  if(at.pulse){ L.pulse.classList.remove("off"); L.pulse.style.left=at.pulse.x+"px"; L.pulse.style.top=at.pulse.y+"px"; }
  else L.pulse.classList.add("off");
  if(L.step!==key) tourCard(L, key, step, sub, at.above);
  // 카드 자리 — 막 없으면 아래, 시트면 그 위, 아니면 밝힌 곳 아래(첫 카드는 × 말풍선이 들어갈 틈만큼 더)
  var ch2=L.card.offsetHeight, cardTop;
  if(full) cardTop = vh - ch2 - 28 - cssPx("--sab");
  else if(at.above) cardTop = Math.max(12 + cssPx("--sat"), H.y - ch2 - 16);
  else cardTop = Math.min(H.y+H.h+(key==="sign" ? 40 : 16), vh - ch2 - 16 - cssPx("--sab"));
  L.card.style.top=cardTop+"px";
  if(hole && !full){ L.caret.style.opacity="1"; L.caret.style.left=Math.max(18, Math.min(vw-40-30, H.x+H.w/2-20-6))+"px"; }
  else L.caret.style.opacity="0";
}
// 카드 — 글은 단계가 바뀔 때만 갈아 끼우고 살짝 떠오른다
function tourCard(L, key, step, sub, above){
  L.step=key; L.text.innerHTML="";
  var tx=tourText(key), tt=el("div","tc-title",tx[0]);

  var doing = !!TOUR[step].do && !sub && key!=="signDone";   // 해 볼 단계(곁화면이 떠 있거나 이미 했으면 설명 단계)

/* ══════════════════════ 데이터 로드 ══════════════════════ */
/* 가족 확인. 부팅 · reload · 온보딩의 한 길. true = 가족 있음, false = 처음인 기기.
   familyId 가 비었으면 init 부터(서버 멈춤 뒤 복구), 세션이 사라졌으면 캐시의 가족 코드로 다시 참여, 실시간 구독은 한 번만 */
function ensureFamily(){
  return makeStore().then(function(){                      // supabase-js 를 못 받아 store 가 아직 없으면 여기서 다시 받는다
    if(store.familyId) return true;
    return store.init().then(function(fam){
      if(fam) return true;
      var c=cacheLoad(), code=c && c.family && c.family.code;
      if(!code) return false;
      return store.joinFamily(code).then(function(){ return true; });
    });
  }).then(function(ok){
    if(ok && !store.subscribed){ store.subscribed=true; store.subscribe(function(){ clearTimeout(S.ui.rtTimer); S.ui.rtTimer=setTimeout(reload, 300); }); }
    return ok;
  });
}
// 시트 · 설정의 칸도 포함(적는 중 다시 그리면 치던 게 날아간다)
function typing(){ var a=document.activeElement; return !!(a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA")); }
document.addEventListener("focusout", function(){          // 칸을 떠나면 미뤄둔 다시 그리기
  setTimeout(function(){ if(S.renderLater && !typing()) render(); }, 0);
});
/* 다시 받기. 받는 중이면 한 번 더 받고, 그 끝에 풀리는 약속을 돌려준다 */
function reload(again){
  if(S.ui.loading){
    S.ui.pendingReload=true;
    if(!S.ui.nextReload){ var done; S.ui.nextReload=new Promise(function(r){ done=r; }); S.ui.nextReload.done=done; }
    return S.ui.nextReload;
  }
  S.ui.loading=true; var failed=null;
  return ensureFamily().then(function(ok){ if(!ok) throw new Error("no family"); return store.loadAll(); }).then(function(d){
    S.family=d.family; S.children=d.children; S.entries=d.entries; S.offline=false;
    if(!S.sel || !childOf(S.sel)) S.sel = S.children.length ? S.children[0].id : null;
    tourInit();
    return ensureAllowances().catch(function(e){ console.warn("auto", e); report("자동 용돈", e); return 0; });   // 자동 용돈만 실패하면 데이터는 최신이다(띠 없음)
  }).then(function(n){
    if(n>0) return store.loadAll().then(function(d){ S.entries=d.entries; });
  }).then(function(){ cacheSave({family:S.family, children:S.children, entries:S.entries}); })
  .catch(function(e){ console.error(e); failed=e; })
  .then(function(){
    S.ui.loading=false;
    // 오랜만에 열면 토큰 갱신과 겹쳐 한 번 튕긴다. 조용히 한 번 더 받는다
    if(failed && !again){ return new Promise(function(go){ setTimeout(go, 800); }).then(function(){ return reload(true); }); }
    if(failed){ S.offline=true; if(!S.children.length) useCache(); }   // 띠로 남긴다
    // 적는 중이면 칸을 떠날 때 그린다(키보드 유지)
    if(typing()) S.renderLater=true; else render();
    if(S.ui.pendingReload){
      var nx=S.ui.nextReload; S.ui.pendingReload=false; S.ui.nextReload=null;
      reload().then(function(){ if(nx) nx.done(); });
    }
  });
}

/* ══════════════════════ 렌더 ══════════════════════ */
/* 화면 위에 뜨는 것들(아래 → 위). 새 시트는 여기 한 줄만 더한다 */
var OVERLAYS=[["edit",renderEditSheet], ["editOpen",renderOpenSheet], ["editKid",renderKidSheet], ["editWeek",renderWeekSheet],
  ["editGate",renderGateSheet], ["pickDate",renderDateSheet], ["kidView",renderKidView], ["entryView",renderEntryView],
  ["fbSend",renderFbSend], ["fbView",renderFbView]];
function overlayOpen(){ return OVERLAYS.some(function(o){ return !!S[o[0]]; }); }
function render(){
  S.renderLater=false; tourTick();
  root.innerHTML="";
  if(S.screen==="loading") root.appendChild(renderLoading());
  else if(S.screen==="fail") root.appendChild(renderFail());
  else if(S.screen==="onboard") root.appendChild(renderOnboard());
  else if(S.screen==="settings") root.appendChild(renderSettings());
  else root.appendChild(renderHome());
  OVERLAYS.forEach(function(o){
    if(!S[o[0]]) return;
    var n=o[1](); root.appendChild(n);
    if(n.fit) n.fit();                                          // 아이 화면은 붙인 직후 동기로 맞춘다(첫 프레임부터 맞는 크기)
  });
  tourSync();                                                   // 처음 안내 레이어는 root 밖 — 그림이 떠 있는 동안은 숨는다
  var sheets=root.querySelectorAll(".sheet");
  if(sheets.length) sheetDrag(sheets[sheets.length-1]);      // 맨 위에 있는 시트만
}

/* 불러오는 중: 0.35초까지는 빈 화면, 그보다 오래면 글자만 */
function renderLoading(){ return el("div","empty-msg load","불러오는 중…"); }

/* ── 홈 ── */
function offlineBar(){
  var b=el("button","offbar");
  b.appendChild(el("span","d"));
  b.appendChild(el("span",null,"연결이 안 돼요. 마지막으로 받은 내용이에요"));

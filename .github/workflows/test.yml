# main 에 올릴 때마다 전체 테스트를 돌린다(결과: Actions 탭, 커밋 옆 ✓/✗).
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 기준 그림과 같은 글꼴(글자 높이를 재는 테스트가 있다)
      - name: Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter fonts-noto-cjk fonts-noto-cjk-extra fonts-wqy-zenhei fonts-ipafont-gothic fonts-noto-color-emoji fonts-liberation fonts-dejavu
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      # 스냅샷이 기준과 다를 때 받을 비교용 그림(다른 기계라 참고용)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-actual
          path: tests/snapshots/*.actual.png
          if-no-files-found: ignore
